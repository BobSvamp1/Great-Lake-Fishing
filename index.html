<style>
/* Layout: one-screen portrait game. Glass HUD on top, rounded HD stage, action buttons below, sheets slide up over everything. */
:root{

}
*{box-sizing:border-box}
html,body{height:100%}

}

#view{position:relative;width:180px;height:320px;border-radius:18px;overflow:hidden;background:#0b2230;box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.45)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:max-content;max-width:92%;background:rgba(9,27,37,.94);color:var(--mist);border:1px solid rgba(242,199,92,.7);border-radius:14px;padding:10px 15px;text-align:center;font-size:15px;font-weight:700;pointer-events:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}

#btnGear[hidden]{display:none}
.btn{font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--mist);
  background:linear-gradient(#3a7d61,#2a5e48);border:0;border-radius:14px;padding:12px 8px;min-height:52px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}

.sheet-in{position:relative;width:min(560px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(#163a4c,#10303f 120px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));-webkit-user-select:text;user-select:text;box-shadow:0 -10px 40px rgba(0,0,0,.4)}

.sheet-in p{margin:6px 0;max-width:62ch}
.sheet-in ul,.sheet-in ol{margin:6px 0;padding-left:22px}

.x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:50%;background:#24506a;color:var(--mist);font-family:var(--font-ui);font-weight:700;font-size:16px;cursor:pointer}
.sub{color:var(--soft);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.card{background:linear-gradient(#123547,#0d2735);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%;height:auto;max-height:76px;object-fit:contain;margin:2px auto 4px}
.card strong{font-weight:700;font-size:16px}
.card small{color:var(--soft);font-size:14px;line-height:1.35}
.card.locked strong{color:#7f9fab}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gear{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.gear .name{font-weight:700}
.gear .ib{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:4px;padding:0;border-radius:50%;border:1.5px solid currentColor;background:none;color:inherit;font:700 italic 13px Georgia,serif;opacity:.7;vertical-align:1px;cursor:pointer}
.gear .ib.on{opacity:1;background:#e8b84a;border-color:#e8b84a;color:#2a1a0e}
.gear .bubble{position:relative;margin-top:9px;padding:9px 11px;border-radius:10px;background:#fff4dc;color:#3a2414;font-size:14px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.gear .bubble::before{content:'';position:absolute;top:-6px;left:18px;border:6px solid transparent;border-top:0;border-bottom-color:#fff4dc}
.gear .bubble[hidden]{display:none}
@keyframes nudge{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-4px) rotate(-2deg)}30%{transform:translateX(4px) rotate(2deg)}45%{transform:translateX(-3px) rotate(-1.5deg)}60%{transform:translateX(3px) rotate(1.5deg)}75%{transform:translateX(-1px)}}

.list{margin:6px 0;padding:0;list-style:none}

.list li span:last-child{color:var(--birch);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.catch{text-align:center}
.catch h2{margin:0 0 6px}

.maprow{padding:10px 0;border-top:1px solid var(--line)}

.stars{color:#ffd45a;letter-spacing:1px;font-size:13px;margin-right:6px;font-variant-numeric:tabular-nums}
.tip{margin-top:4px;font-size:14px;color:#e6dcb8;line-height:1.4}

.rank.me{background:linear-gradient(#2f6a50,#1f4836);border-color:var(--birch)}

.lvlcard .name{font:600 18px var(--font-display);color:#fff6dc}
.goldtxt{color:#ffd45a;font-weight:700}

.catch canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:12px auto;max-width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--rowan);color:#fff;padding:4px 9px;margin:2px;border-radius:999px}

.hubcard.sport{border:3px solid #f2b84a;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 18px rgba(242,184,74,.35)}

.plate{align-self:center;margin-top:-16px;position:relative;padding:6px 12px;border-radius:999px;background:linear-gradient(#2a6f9a,#1b4d70);border:2px solid #f2c75c;

.hubcard.fish .plate{border-color:#5fd6d0}
.hub-sub{display:block;text-align:center;margin-top:7px;font-size:13px;color:var(--soft);line-height:1.3}
.savecode{width:100%;min-height:92px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:#0b2532;color:var(--mist);font:13px/1.35 ui-monospace,Menlo,monospace;padding:10px;word-break:break-all;-webkit-user-select:text;user-select:text}
.savecode:focus-visible{outline:3px solid var(--birch);outline-offset:2px}
.err{color:#ff9a7a;font-weight:700}
.btn.back{min-height:38px;padding:6px 14px;margin-bottom:10px}

.greet{margin:10px 0 2px;padding:9px 12px;border-radius:12px;background:rgba(242,199,92,.1);border-left:3px solid var(--birch);color:#f3e6c0;font-size:15px}

.d0{color:var(--good);font-weight:700}.d1{color:#f6d36e;font-weight:700}.d2{color:#ff9a7a;font-weight:700}

</style>

/* --- Skyltar högst upp --- */

.chip{position:relative;line-height:1.2;background:var(--grain) 0 0/480px 80px,linear-gradient(#80552f,#5e3c22);border:2px solid var(--wood-lo);border-radius:9px;padding:4px 11px 4px 8px;

/* --- Startmenyn: titeln på en hängande skylt --- */
#menu{background:linear-gradient(to bottom,rgba(6,20,30,.35),rgba(6,20,30,0) 30%,rgba(6,20,30,0) 50%,rgba(6,20,30,.85) 80%)}
.menu-top{padding-top:2%}
.kicker{display:inline-block;color:#fff4d8;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:11.5px}
#menu h1{position:relative;display:inline-block;margin:20px 0 4px;padding:9px 16px 11px;color:var(--cream);font-size:clamp(23px,7vmin,34px);line-height:1;
  background:var(--nails),var(--grain) 0 0/480px 80px,linear-gradient(#8f6238,#6a4426 60%,#55361d);background-size:auto,240px 60px,auto;
  border:3px solid var(--wood-lo);border-radius:12px;text-shadow:0 2px 0 #2a170a,0 4px 10px rgba(0,0,0,.35);
  box-shadow:0 6px 0 #1c1009,0 12px 24px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,220,170,.3);transform:rotate(-1.2deg);
  animation:sway 6s ease-in-out infinite;transform-origin:50% -24px}
#menu h1::before,#menu h1::after{content:"";position:absolute;top:-27px;width:3px;height:26px;background:repeating-linear-gradient(#c9a66b 0 3px,#8a6a3a 3px 5px);border-radius:2px}
#menu h1::before{left:22%}#menu h1::after{right:22%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1deg)}}
.menu-btns{gap:12px}
.menu-btns .btn{min-height:50px;font-size:18px}

/* --- Ark som glider upp: ett mörkt timmerbord med näverkant --- */
#sheet{background:rgba(6,14,18,.62)}
.sheet-in{background:var(--grain) 0 0/480px 80px,linear-gradient(#4a2f1b,#38230f 160px,#2f1d0e);
  border:2px solid #1a0f07;border-bottom:0;border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,220,170,.15)}

.sheet-in h2{font-family:var(--font-display);color:#ffe08a;text-shadow:0 2px 0 #1d1008;font-size:28px}
.sheet-in h3{color:#e9c88a;display:flex;align-items:center;gap:8px}
.sheet-in h3::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(233,200,138,.45),transparent)}
.sheet-in p,.sheet-in li{color:#f6ead2}
.sub{color:var(--soft)}
.x{background:radial-gradient(circle at 35% 30%,#d0583f,#a8382a 60%,#7d2419);color:#fff;border:2px solid #3d120b;box-shadow:0 3px 0 #3d120b;font-family:var(--font-display);font-size:17px}
.card{background:var(--grain) 0 0/480px 80px,linear-gradient(#6a4628,#523519);border:2px solid #1f130a;border-radius:12px;
  box-shadow:0 3px 0 #1a0f07,inset 0 2px 0 rgba(255,220,170,.18)}
.card strong{color:var(--cream)}
.card.locked{filter:saturate(.4) brightness(.85)}
.card.locked strong{color:#bba88a}
.card canvas{background:radial-gradient(ellipse at 50% 60%,rgba(120,190,210,.35),rgba(120,190,210,0) 70%);border-radius:10px}
.gear,.maprow{border-top:2px dashed rgba(255,214,160,.14)}
.gear .max{color:#ffe08a}
.list li{border-bottom:1px dashed rgba(255,214,160,.18)}
.list li span:last-child{color:#ffe08a}
.rank{background:var(--grain) 0 0/480px 80px,linear-gradient(#5e3c22,#4a2f1b);border:2px solid #1f130a}
.rank.me{background:var(--grain) 0 0/480px 80px,linear-gradient(#3f7a52,#2c5a3c);border-color:#f2c75c}
.lvlcard{background:var(--grain) 0 0/480px 80px,linear-gradient(#5e3c22,#4a2f1b);border:2px solid #1f130a;box-shadow:0 3px 0 #1a0f07}
.lvlcard.boss{background:var(--grain) 0 0/480px 80px,linear-gradient(135deg,#6e2418,#45150e);border-color:#e2553b}
.tag{background:var(--falu);border:1px solid #3d120b;box-shadow:0 2px 0 #3d120b}
.tag.gold{background:#f2c75c;border-color:#5a3d10;box-shadow:0 2px 0 #5a3d10}
.tabs{gap:6px}
.tab{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--grain) 0 0/480px 80px,linear-gradient(#6a4628,#523519);color:#f2e3bd;border:2px solid #1f130a;border-radius:10px;box-shadow:0 3px 0 #1a0f07}
.tab.on{background:var(--grain) 0 0/480px 80px,linear-gradient(#fbe08e,#e8b84a);color:#2a1a06;border-color:#5a3d10;box-shadow:0 3px 0 #5a3d10}
.pbar{height:11px;background:#1d1108;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,220,170,.15)}
.pbar i{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.18) 0 4px,transparent 4px 8px),linear-gradient(90deg,#e0ac3e,#f7d77a)}
.sheet-in .greet{color:#3a2614}
.greet{background:linear-gradient(#f4e6c4,#e6d2a6);color:#3a2614;border-left:0;border-radius:4px 12px 12px 4px;box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(-.6deg);font-style:italic}
.hubcard,.shop-banner{background:var(--grain) 0 0/480px 80px,linear-gradient(#4a2f1b,#38230f)}
.hubcard{box-shadow:0 4px 0 #1a0f07!important}
.plate{background:var(--grain) 0 0/480px 80px,linear-gradient(#8f6238,#6a4426);border-color:#f2c75c;border-radius:8px;text-shadow:0 1px 0 #1d1008}
.savecode{background:#1f140b;border:2px solid #3a2414;color:#f2e3bd}
.tip{color:#f0dfb4}
.stars{color:#ffd45a;text-shadow:0 1px 0 #1d1008}
.done,.d0{color:#9ff0ae}

.card.tap{cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .1s}
.card.tap:active{transform:scale(.97)}
.kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;background:#2a1a0e;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.kdot.on{background:radial-gradient(circle at 35% 30%,#fff3b5,#e8b84a);box-shadow:0 0 4px rgba(255,214,90,.6)}
.notes{display:grid;gap:6px;margin:8px 0;text-align:left}
.note{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.note b{font-family:var(--font-display);font-weight:600;color:#e9c88a}
.catch .greet{text-align:left}
#thr{position:absolute;left:8px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--cream);
  padding:7px 12px 7px 9px;border-radius:999px;border:2px solid var(--wood-lo);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.5);
  background:var(--grain) 0 0/480px 80px,linear-gradient(#8a5d34,#6a4426 55%,#55361d);box-shadow:0 3px 0 #1c1009,0 5px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.25)}
#thr[hidden]{display:none}
#thr:active{transform:translateY(2px);box-shadow:0 1px 0 #1c1009}
#thr .thr-ic{display:flex;gap:2px;align-items:flex-end;height:14px}
#thr .thr-ic::before,#thr .thr-ic::after{content:"";width:4px;border-radius:1px;background:#ffe08a}
#thr .thr-ic::before{height:6px}#thr .thr-ic::after{height:14px;opacity:var(--b3,.3)}
#thr.troll{background:var(--grain) 0 0/480px 80px,linear-gradient(#3f7a94,#2f6a86 55%,#24546b)}
.htrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:10px -2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.htrack::-webkit-scrollbar{display:none}
.hcard{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:0 2px;text-align:center}
.hcard .hart{display:block;width:100%;height:auto;aspect-ratio:13/10;object-fit:cover;border-radius:12px;border:3px solid #1f130a;box-shadow:0 4px 0 #1a0f07,inset 0 0 0 1px rgba(255,220,170,.2);background:#0d2633}
.hcard .hnum{margin-top:10px;font-size:12px;letter-spacing:.12em;color:#c9a66b;font-weight:700}
.hcard h3{justify-content:center;margin:4px 0 4px;font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:0;text-transform:none;color:#ffe08a}
.hcard h3::after{display:none}
.hcard p{margin:0 auto;max-width:34ch;font-size:16px;line-height:1.45;color:#f6ead2;min-height:4.4em}
.hdots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}
.hdot{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:#2a1a0e;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);cursor:pointer}
.hdot.on{background:radial-gradient(circle at 35% 30%,#fff3b5,#e8b84a);box-shadow:0 0 5px rgba(255,214,90,.6)}
/* --- Toast: en liten skylt --- */
#toast{background:var(--grain) 0 0/480px 80px,linear-gradient(#8a5d34,#6a4426);border:2px solid #1c1009;color:var(--cream);font-family:var(--font-display);font-weight:600;font-size:16px;
  border-radius:12px;box-shadow:0 4px 0 #1c1009,0 10px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,220,170,.28);text-shadow:0 1px 0 rgba(0,0,0,.5);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateX(-50%) translateY(-8px) scale(.94);opacity:0}to{transform:translateX(-50%);opacity:1}}
/* --- Startmenyn: titeln i himlen och ett fiskekort --- */
#menu{background:linear-gradient(to bottom,rgba(6,20,30,.25),rgba(6,20,30,0) 30%,rgba(6,20,30,0) 45%,rgba(6,20,30,.7) 85%)}
#menu h1{background:none;border:0;box-shadow:none;animation:none;transform:none;padding:0;margin:26px 0 0;font-size:clamp(34px,11vmin,52px);line-height:.92;color:#fff4d8;
  text-shadow:0 3px 0 #6a4426,0 5px 0 #3a2414,0 10px 22px rgba(0,0,0,.5)}
#menu h1::before,#menu h1::after{display:none}
.fcard{margin:0 6% 7%;padding:16px 16px 14px;border-radius:6px;position:relative;color:#3a2414;
  background:repeating-linear-gradient(0deg,rgba(120,80,40,.05) 0 2px,transparent 2px 4px),linear-gradient(#f6ead0,#ead8b0);
  box-shadow:0 0 0 2px #c9a66b inset,0 0 0 5px #f6ead0 inset,0 0 0 6px #c9a66b inset,0 12px 30px rgba(0,0,0,.5);transform:rotate(-1.2deg)}
.fc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px dashed #c9a66b;padding:4px 4px 8px;margin-bottom:10px}
.fc-head b{font-family:var(--font-display);font-size:22px;letter-spacing:.12em;color:#a8382a}
.fc-head span{font-size:12px;color:#7a5a3a}
.fc-l{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 4px;border-bottom:1px dotted rgba(122,90,58,.4)}
.fc-l i{font-style:normal;color:#6e4f30}
.fc-l b{font-family:var(--font-display);font-weight:600;text-align:right}
#menu .fcard .menu-btns{padding:12px 0 0}
.fc-row{display:flex;gap:10px}
.m-acct{display:block;width:100%;margin-top:10px;background:none;border:0;padding:6px;color:inherit;font:600 14px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;opacity:.85;cursor:pointer}
.m-acct[hidden]{display:none}
.acc-in{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:12px 14px;border-radius:10px;border:2px solid rgba(0,0,0,.18);background:#fffaf0;color:#2a1a0e;font:16px "Atkinson Hyperlegible",system-ui,sans-serif}
.lb-tabs{display:flex;gap:6px;margin:4px 0 10px}.lb-tabs .btn{flex:1;min-height:44px;padding:6px 4px;font-size:14px}
.lb-list{list-style:none;margin:0;padding:0}.lb-list li{display:flex;align-items:center;gap:8px;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.lb-list li.me{background:rgba(232,184,74,.22);border-radius:8px}.lb-list .lb-r{flex:0 0 30px;text-align:center;font-weight:700}.lb-list .lb-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-list .lb-v{font-weight:700;white-space:nowrap}
.lb-list li.lb-wait{justify-content:center;opacity:.8;border:0}.lb-me{margin-top:10px;font-size:14px;opacity:.9}
.acc-link{background:none;border:0;padding:8px 0;color:inherit;font:600 14px "Atkinson Hyperlegible",system-ui,sans-serif;text-decoration:underline;cursor:pointer;opacity:.85}
.fc-row .btn{flex:1}
.fc-row .fc-ic{flex:0 0 52px;width:52px;height:52px;min-height:52px;border-radius:50%;padding:0;display:grid;place-items:center}
.fc-ic svg{width:24px;height:24px}
#where::before{display:none!important}
#wxIc{display:inline-block;width:18px;height:18px;margin-right:6px;vertical-align:-4px}
#clk{font-variant-numeric:tabular-nums;margin-right:7px;opacity:.95}
#clk:empty{display:none}
#wxIc svg{display:block;width:100%;height:100%;overflow:visible}
/* --- Fiskelådan --- */
.tbox{margin:8px 0 10px;border-radius:14px;padding:10px;position:relative;
  background:linear-gradient(#3f8a5e,#2c6b47 60%,#235a3b);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.25),0 5px 0 #173a27,0 10px 22px rgba(0,0,0,.4)}

    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&L(x+dx,y+dy))ln++;if(ln<=2)M.LAND[y*M.WT+x]=0}}
  M.isLand=(px,py)=>L(Math.floor(px/T),Math.floor(py/T));
  M.free=(x,y)=>!M.isLand(x-6,y-2)&&!M.isLand(x+6,y-2)&&!M.isLand(x-6,y+3)&&!M.isLand(x+6,y+3);
  const snap=(tx,ty,r)=>{

  M.spots=def.spots.map(s=>{const o=Object.assign({},s);o.map=def.id;return mk(o,s.clear||2)});
  M.dock=mk({name:def.dock.name,t:def.dock.t},1);

  M.ramp=def.ramp?mk({name:def.ramp.name,t:def.ramp.t},1):null;

  if(M.comp){const d=def.comp.dir;let n=0;while(n<12&&!M.isLand(M.comp.x+d[0]*n*T,M.comp.y+d[1]*n*T))n++;M.comp.pier={d:d,len:n}}
  M.cabin=def.cabin?mk({name:def.cabin.name,t:def.cabin.t},1):null;
  if(M.cabin){const d=def.cabin.dir;let n=0;while(n<12&&!M.isLand(M.cabin.x+d[0]*n*T,M.cabin.y+d[1]*n*T))n++;M.cabin.pier={d:d,len:n}}
  M.yard=def.yard?mk({name:def.yard.name,t:def.yard.t},1):null;
  M.portals=(def.portals||[]).map(p=>{const o=mk({name:p.name,t:p.t},1);o.pier=dirToLand(o.x,o.y);o.id=p.id;o.to=p.to;return o});
  M.chest=def.chest?mk({name:'Kistan',t:def.chest.t},1):null;
  if(M.chest){const p=dirToLand(M.chest.x,M.chest.y);M.chest.lx=M.chest.x+p.d[0]*(p.len*T+7);M.chest.ly=M.chest.y+p.d[1]*(p.len*T+7)}
  if(M.yard){const d=def.yard.dir;let n=0;while(n<12&&!M.isLand(M.yard.x+d[0]*n*T,M.yard.y+d[1]*n*T))n++;M.yard.pier={d:d,len:n}}

  /* Objekt som står upp: hus, kyrka, sjöbodar, träd och stenar. Sorteras i rader efter y. */
  const items=[],occ=new Set();

  const WALLS=['#b8392a','#e9c25a','#efeee6','#c98a2a','#b8392a','#efeee6'];
  const village=(cx,cy,n,seed,rx,ry)=>{

      if(M.isLand(x-2,y-4)&&M.isLand(x+w+2,y-4)&&M.isLand(x-2,y+9)&&M.isLand(x+w+2,y+9)&&!occ.has(occKey(x+w/2,y+7)))

  };
  const landPt=o=>{const p=dirToLand(o.x,o.y);return {x:o.x+p.d[0]*(p.len+3)*T,y:o.y+p.d[1]*(p.len+3)*T}};
  const shoreHut=o=>{const p=o.pier,e={x:o.x+p.d[0]*(p.len*T+4)+(p.d[1]?9:0),y:o.y+p.d[1]*(p.len*T+4)+(p.d[0]?-6:0)};if(M.isLand(e.x,e.y))add({x:e.x,y:e.y,k:'shed',w:8,h:6.5})};

    for(let dy=-3;dy<=2;dy++)for(let dx=-3;dx<=3;dx++)occ.add(Math.floor(hx/T+dx)+','+Math.floor(hy/T+dy));add({x:hx,y:hy,k:'cabin',w:24,h:21})}
  if(M.yard){const c=M.yard,p=c.pier;const hx=c.x+p.d[0]*(p.len*T+13),hy=c.y+p.d[1]*(p.len*T+13)+6;M.yard.hx=hx;M.yard.hy=hy;
    for(let dy=-4;dy<=2;dy++)for(let dx=-4;dx<=4;dx++)occ.add(Math.floor(hx/T+dx)+','+Math.floor(hy/T+dy));add({x:hx,y:hy,k:'yard',w:30,h:26})}

  }else if(!def.cave&&!def.fjall){

  items.forEach(o=>{const r=Math.floor((o.y+PAD)/2);(M.rows[r]||(M.rows[r]=[])).push(o)});

/* --- Brus och oskärpa för HD-texturen --- */
function boxBlur(src,w,h,r,passes){

      for(let x=0;x<w;x++){b[o+x]=s/(2*r+1);s+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)]}}
    for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[clamp(y,0,h-1)*w+x];
      for(let y=0;y<h;y++){a[y*w+x]=s/(2*r+1);s+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]}}
  }
  return a;
}

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function buildTex(M,win){

  if(M[KEY])return M[KEY];
  const WWp=M.WW+2*PAD,WHp=M.WH+2*PAD,CS=2;
  const GW=Math.ceil(WWp/CS)+2,GH=Math.ceil(WHp/CS)+2,N=GW*GH;
  const land=new Float32Array(N),nz=new Float32Array(N),nz2=new Float32Array(N);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const i=gy*GW+gx,wx=gx*CS-PAD,wy=gy*CS-PAD;

    const i=gy*GW+gx,e=k=>fB[k]+nz[k]*.35;

  }

  const g=c0.getContext('2d');const img=g.createImageData(tw,th),D=img.data;

  const SH=[110,196,198],MID=[46,132,164],DEEP=[22,82,124],SAND=[214,196,142],GRASS=[104,142,72],FOR=[46,84,52],F1=[204,182,98],F2=[158,174,82];

      }else if(win){

      }

      const out=Math.max(0,PAD-wx,wx-PAD-M.WW,PAD-wy,wy-PAD-M.WH),fo=M.def&&M.def.cave?0:clamp(out/EDGE_F,0,1);
      if(fo>0){const k=1-.45*fo;r*=k;gg*=k;bb*=k}
      D[p]=Math.round((r+bd)/10)*10;D[p+1]=Math.round((gg+bd)/10)*10;D[p+2]=Math.round((bb+bd)/10)*10;D[p+3]=Math.round(255*(1-fo*fo));
    }
  }

    const pr=o.pier,len=pr.len*T+3,dx=pr.d[0],dy=pr.d[1],nx=-dy,ny=dx;

function pickFish(spot,u){
  let tot=0;const ws=[];
  for(const id in spot.pool){
    const f=FBY[id];let w=spot.pool[id]*timeMul(f,u)*wxFishMul(f)*depthMul(f,spot)*seasonMul(f);
    ws.push([f,w]);tot+=w;
  }
  let r=Math.random()*tot,f=ws[0][0];
  for(const a of ws){r-=a[1];if(r<=0){f=a[0];break}}
  /* Storsjöodjuret: låg slumpchans, bara på Storsjöflaket (högre på natten) */
  if(spot.beast&&Math.random()<((u>=.6&&u<.88)?0.01:0.005)*wxBeastMul())f=FBY.odjur;
  /* Gillhovsöringen: bara vid Gillhov, oftast i gryning och skymning och när det regnar */
  if(MOD.legend&&(spot.legend||spot.beast||spot.under==='cave'||spot.kungen)){f=spot.kungen?FBY.kung:spot.under==='cave'?FBY.drake:spot.legend?FBY.legend:FBY.odjur;MOD.legend=false}
  else if(spot.under==='cave'&&Math.random()<(S.baitSel==='silver'?.006:.0015)*(spot.id==='morkadjupet'?1.6:1))f=FBY.drake;
  else if(spot.kungen&&auroraAmt(u,'fjall')>.3&&Math.random()<(S.baitSel==='renhorn'?.012:.004))f=FBY.kung;
  else if(spot.legend&&Math.random()<0.004*((phaseOf(u)==='g'||phaseOf(u)==='s')?2:1)*(wxA('rain')>.3?2:1))f=FBY.legend;
  const elr=S.baitSel==='elritsa'&&(f.id==='lax'||f.id==='gadda');
  const k=Math.max(elr?0.6:0.8,(2.4-0.3*S.rod-0.22*S.sonar)/(spot.big||1))*(elr?.7:1);
  const frac=Math.pow(Math.random(),k);
  let kg=f.kg[0]+(f.kg[1]-f.kg[0])*frac;
  /* Riktiga bjässar: väldigt ovanliga, lite vanligare med bra spö och på storfiskplatser */
  let giant=false;
  if(!f.beast&&f.max&&Math.random()<0.005*(spot.big||1)*(1+0.2*S.rod)*(elr?2.5:1)*(!S.winter&&S.boat===5?2.5:1)){giant=true;kg=f.kg[1]+(f.max-f.kg[1])*Math.pow(Math.random(),1.8)}
  kg=f.beast?Math.round(kg):(kg>=1?Math.round(kg*10)/10:Math.round(kg*100)/100);
  kg=Math.max(kg,f.kg[0]);
  /* Gyllene fiskar: ungefär 1 på 250, värda fem gånger mer */
  const gold=!f.beast&&!f.legend&&(MOD.gold||Math.random()<GOLD_CHANCE);if(gold)MOD.gold=false;
  return {f:f,kg:kg,frac:giant?1:frac,giant:giant,price:Math.round(priceFor(f,kg)*(gold?5:1)*(mastLvl(f.id)===2?1.1:1)),spot:spot.name,spotId:spot.id,gold:gold};
}

const ZN={cur:null,sd:0,t:0,banner:null,bt:0};
function shoreDist(x,y){
  if(M.isLand(x,y))return 0;let best=140;
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
    for(let r=3;r<best;r+=3)if(M.isLand(x+ca*r,y+sa*r)){best=r;break}}
  return best;
}
/* Djupa områden (som Storsjöflaket) gäller bara långt ut från land, annars det närmaste området */
function zoneAt(x,y,sd){
  if(sd==null)sd=shoreDist(x,y);
  let best=null,bd=1e9;
  for(const s of M.spots){if(s.zoneDeep&&sd<s.zoneDeep)continue;const d=Math.hypot(s.x-x,s.y-y)*(s.zoneDeep?.55:1);if(d<bd){bd=d;best=s}}
  return best||M.spots[0];
}
function depthAt(z,sd){const r=spotDepth(z),span=M&&(M.id==='nak'||M.id==='fjall'||M.id==='alv')?45:110,k=Math.pow(clamp((sd-7)/span,0,1),.8);return {m:Math.max(1,Math.round(lerp(r[0],r[1],k))),k:k}}
function fishSpotAt(x,y){
  const sd=shoreDist(x,y),z=zoneAt(x,y,sd),dp=depthAt(z,sd);
  const shallowUnder=z.under==='deep'?'rocks':z.under;
  if(z.under==='cave')return Object.assign({},z,{dep:[0,depthAt(z,sd).m],depthM:depthAt(z,sd).m,dz:depthAt(z,sd).k,hot:false,big:z.big||1});
  const under=dp.m>=18?'deep':shallowUnder;
  const theme=sd>105?'open':z.theme;
  const hot=hotNear(x,y);
  return Object.assign({},z,{under:under,theme:theme,dep:[0,dp.m],depthM:dp.m,dz:dp.k,hot:!!hot,big:(z.big||1)*(1+.18*dp.k)*(hot?1.25:1)});
}

function hotNear(x,y){if(HOT.map!==M)return null;return HOT.list.find(h=>Math.hypot(h.x-x,h.y-y)<30&&h.age>2)||null}
function hotSpawn(){
  for(let i=0;i<60;i++){const x=rnd(16,M.WW-16),y=rnd(16,M.WH-16);if(M.isLand(x,y))continue;const sd=shoreDist(x,y);if(sd<16)continue;
    if(Math.hypot(x-M.dock.x,y-M.dock.y)<100)continue;if(HOT.list.some(h=>Math.hypot(h.x-x,h.y-y)<160))continue;

  for(let i=HOT.list.length-1;i>=0;i--){const h=HOT.list[i];h.age+=dt;if(h.age>h.life){HOT.list.splice(i,1);continue}

  if(HOT.list.length<4&&Math.random()<dt*.08){const h=hotSpawn();if(h)HOT.list.push(h)}

}

const SKYK=[[0,['#f4b48c','#f8dcc0']],[.1,['#6fb2df','#cfe8f2']],[.42,['#6fb2df','#cfe8f2']],[.5,['#7a6ea6','#f5a77a']],[.6,['#0f1d3e','#2a3e66']],[.86,['#0f1d3e','#2a3e66']],[1,['#f4b48c','#f8dcc0']]];

/* ---------- Djurliv: bara för stämningen, påverkar inte spelet ---------- */
const ZOO={map:null,win:null,a:[],jumps:[],jt:2};
function zooWater(x,y,r){return x>8&&y>8&&x<M.WW-8&&y<M.WH-8&&!M.isLand(x,y)&&!M.isLand(x-r,y)&&!M.isLand(x+r,y)&&!M.isLand(x,y-r)&&!M.isLand(x,y+r)}
function zooNearShore(x,y,maxd){for(const d of [[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]])for(let n=6;n<=maxd;n+=4)if(M.isLand(x+d[0]*n,y+d[1]*n))return true;return false}
function zooLandOk(x,y){
  if(x<6||y<6||x>M.WW-6||y>M.WH-6)return false;
  if(!M.isLand(x,y)||!M.isLand(x-3,y)||!M.isLand(x+3,y)||!M.isLand(x,y-2)||!M.isLand(x,y+2))return false;
  for(const o of [M.dock,M.ramp,M.comp,M.cabin,M.yard].concat(M.portals||[]))if(o&&Math.hypot(o.x-x,o.y-y)<60)return false;
  for(let r=Math.floor((y-14+PAD)/2);r<=Math.floor((y+14+PAD)/2);r++){const row=M.rows[r];if(!row)continue;
    for(const o of row)if((o.k==='house'||o.k==='church'||o.k==='shed'||o.k==='cabin'||o.k==='yard')&&Math.abs(o.x-x)<16&&Math.abs(o.y-y)<14)return false}
  return true;
}
function zooShorePt(){
  for(let i=0;i<400;i++){const x=rnd(10,M.WW-10),y=rnd(10,M.WH-10);if(!zooLandOk(x,y))continue;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){let n=4;while(n<=22&&M.isLand(x+d[0]*n,y+d[1]*n))n+=2;if(n<=22)return {x:x,y:y}}}
  return null;
}
function zooWaterPt(shore){
  for(let i=0;i<300;i++){const x=rnd(10,M.WW-10),y=rnd(10,M.WH-10);if(!zooWater(x,y,4))continue;
    if(shore&&!zooNearShore(x,y,34))continue;if(Math.hypot(x-M.dock.x,y-M.dock.y)<40)continue;return {x:x,y:y}}

}
function zooSpawn(){

  const k=clamp(M.WW*M.WH/(420*420),.45,1.4),n=b=>Math.max(0,Math.round(b*k));
  const put=(o,p)=>{if(p){o.x=p.x;o.y=p.y;o.hx=p.x;o.hy=p.y;o.f=Math.random()<.5?-1:1;o.ph=rnd(0,9);o.tx=null;o.wt=rnd(0,4);ZOO.a.push(o)}};
  if(!ZOO.win){

    for(let i=0;i<Math.max(1,n(1));i++){const p=zooWaterPt(true);put({k:'swan',sp:3.5},p);if(p)put({k:'swan',sp:3.5,mate:ZOO.a[ZOO.a.length-1]},{x:p.x+5,y:p.y+2})}
    for(let i=0;i<Math.max(1,n(1.4));i++)put({k:'loon',sp:4,dive:rnd(5,12),under:0},zooWaterPt(false));
  }
  for(let i=0;i<Math.max(1,n(1.5));i++)put({k:'moose',sp:3,bull:Math.random()<.5},zooShorePt());
  for(let i=0;i<Math.max(1,n(2));i++){const p=zooShorePt();put({k:'deer',sp:4.5},p);if(p&&Math.random()<.5)put({k:'deer',sp:4.5,small:1},{x:p.x+4,y:p.y+1})}

    ZOO.a.push({k:'gull',cx:c.x,cy:c.y,r:rnd(18,50),a:rnd(0,7),w:(Math.random()<.5?-1:1)*rnd(.25,.45),h:rnd(22,38),ph:rnd(0,9),drift:rnd(0,7)})}

function zooWander(o,dt,water){

function zooDyn(dyn,g,t,sq,WIN){

function snowify(src){

  const snow=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;if(!d[i+3])continue;
    if(!A(x,y-1)||(!A(x,y-2)&&ihash(x,y)<.7))snow[y*w+x]=1;
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;if(!d[i+3])continue;
    if(snow[y*w+x]){const k=snow[(y-1)*w+x]?1:0;d[i]=k?232:246;d[i+1]=k?238:249;d[i+2]=k?246:253}
    else{const l=(d[i]+d[i+1]+d[i+2])/3;d[i]=lerp(d[i],l,.35)*.9+10;d[i+1]=lerp(d[i+1],l,.35)*.92+14;d[i+2]=lerp(d[i+2],l,.35)*.95+30}
  }
  g.putImageData(im,0,0);return c;

const ICE_DEPTH={kung:.88,lax:.5,legend:.55,harr:.22,abborre:.42,gadda:.35,oring:.5,mort:.3,lake:.86,sik:.66,kanada:.76,nors:.46,regnbage:.38,roding:.8,bergsimpa:.92,odjur:.9};
const MET_L=6,MET_W=14;
const spotDepthM=()=>F.spot.under==='deep'?20:F.spot.under==='rocks'?14:F.spot.under==='weeds'||F.spot.under==='mud'?7:10;
function ensureIce(){if(F.jd==null){F.jd=S.iceDepth!=null?S.iceDepth:.5;F.jigT=9;F.jigA=0;F.msg=null;F.boost=0;F.drag=false}}
function setDepth(y){ensureIce();F.jd=clamp((y-BAR_T)/BAR_H,0,1);S.iceDepth=F.jd}
function winterPress(x,y){
  ensureIce();
  if(x<MET_L+MET_W+8&&y>BAR_T-10&&y<BAR_T+BAR_H+10&&F.state!=='reel'&&F.state!=='bite'){setDepth(y);F.drag=true;holding=false;return true}
  if(F.state==='waiting'){jig();return true}
  return false;
}
function winterMove(p){if(F.drag)setDepth(p.y)}
function winterTick(dt){
  ensureIce();F.jigT+=dt;F.jigA=Math.max(0,F.jigA-dt*3);F.boost=Math.max(0,F.boost-dt);
  if(F.msg){F.msg.t-=dt;if(F.msg.t<=0)F.msg=null}
  if(F.state==='casting'&&F.t<.6){}
}
function jig(){
  const dtj=F.jigT;F.jigT=0;F.jigA=1;tone(520+Math.random()*80,.06,'triangle',.06);
  let q;
  if(dtj<.35){q=-1;F.msg={s:'För snabbt, fisken skräms',c:'#ffb070',t:.9}}
  else if(dtj<=1.7){q=1;F.boost=1.2;F.msg={s:'Bra rytm!',c:'#9df5b0',t:.7}}
  else{q=.4;F.msg={s:'Pimpla i jämn takt',c:'#e8f4f8',t:.8}}
  for(const s of F.school){
    const dd=Math.abs(s.d-F.jd),dist=Math.hypot(s.x-BX,s.y-HOOK_Y);
    if(dd<.16&&dist<70){
      if(q<0){s.int=Math.max(0,s.int-.4);if(dist<30){s.vx=(s.x<BX?-1:1)*Math.max(18,Math.abs(s.vx)*1.5);s.flee=1.2}}
      else s.int+=.28*q;
    }
  }
}
function updateSchoolWinter(dt){
  ensureIce();
  F.sp-=dt;
  const nb=newbie();
  if(F.sp<=0&&F.school.length<4){spawnFish(false);F.sp=(10+(1-activity(F.spot,clock))*16)*rnd(0.7,1.3)*(1-.6*nb)}
  const hunting=F.state==='waiting',bait=BAITBY[S.baitSel];
  let biter=null;
  for(const s of F.school){
    const fav=nb>=1||bait.fav.indexOf(s.p.f.id)>=0||s.p.f.beast||s.p.f.legend;
    const dd=Math.abs(s.d-F.jd),dist=Math.hypot(s.x-BX,s.y-HOOK_Y);
    if(s.flee>0)s.flee-=dt;
    if(nb>0&&hunting&&dist<95)s.d+=Math.sign(F.jd-s.d)*Math.min(Math.abs(F.jd-s.d),.12*nb*dt);
    const lured=hunting&&!(s.flee>0)&&dd<.13+.17*nb&&dist<72+23*nb&&(fav||(s.lk==null?(s.lk=Math.random()<.25):s.lk));
    if(lured){
      s.att=Math.min(1,(s.att||0)+dt);
      const k=Math.min(1,dt*(.8+F.boost));s.x+=(BX-s.x)*k*.6;s.y+=(HOOK_Y+4-s.y)*k*.6;
      if(fav)s.d+=Math.sign(F.jd-s.d)*Math.min(Math.abs(F.jd-s.d),.06*dt);
    }else{
      s.att=Math.max(0,(s.att||0)-dt);
      s.x+=s.vx*dt*(1-.8*(s.att||0));s.y+=Math.sin(clock*1.3+s.ph)*5*dt;
    }
    if(hunting&&dd<.11+.09*nb&&dist<16)s.int+=dt*(fav?.22:.07)*(F.boost>0?1.6:.7)*(1+nb*2);
    else s.int=Math.max(0,s.int-dt*.35);
    if(hunting&&!biter&&s.int>=1.55)biter=s;
  }
  F.school=F.school.filter(s=>s!==biter&&s.x>-30&&s.x<W+30);
  if(biter){F.pick=biter.p;F.bfish=biter;F.state='bite';F.t=0;vib(50);SND.bite()}
}
function drawDepthMeter(g,t){

    g.fillStyle=col;g.beginPath();g.ellipse(x+MET_W/2+2,y+s.d*h,2.6,1.3,0,0,7);g.fill();g.beginPath();g.moveTo(x+MET_W/2-.6,y+s.d*h);g.lineTo(x+MET_W/2-2.2,y+s.d*h-1.4);g.lineTo(x+MET_W/2-2.2,y+s.d*h+1.4);g.fill()}}

}

  const sg=g.createLinearGradient(0,0,0,86);sg.addColorStop(0,'#7ab6d8');sg.addColorStop(1,'#cfe6ee');g.fillStyle=sg;g.fillRect(0,0,128,86);
  g.fillStyle=S.winter?'#e8eef4':'#4a7a5a';g.fillRect(0,56,128,30);g.fillStyle=S.winter?'#c8d6e2':'#3c7fa6';g.fillRect(0,74,128,12);
  for(let i=0;i<9;i++){g.fillStyle=S.winter?'#3a5a4a':'#244e3b';const x=i*15+4;g.beginPath();g.moveTo(x,58);g.lineTo(x+5,36-((i*7)%10));g.lineTo(x+10,58);g.fill()}
  const sp=S.winter?winterSprites().cabin:SPRS.cabin;g.imageSmoothingEnabled=false;g.drawImage(sp,34,22,60,52);
  g.fillStyle='#8a6440';g.fillRect(84,70,30,4);
  return pixelize(c,6);
}
function cabinSmoke(dyn,g,t){
  const c=M.cabin;if(!c.hx)return;
  dyn.push({y:c.hy+.5,fn:()=>{for(let i=0;i<5;i++){const k=((t*.4+i/5)%1),wx=c.hx+6+k*6,wy=c.hy;const p=proj(wx,wy);if(!p)continue;
    const r=(1.2+k*3)*p.s;g.fillStyle='rgba(230,230,235,'+((1-k)*.55).toFixed(2)+')';g.beginPath();g.arc(p.x+Math.sin(t+i)*p.s,p.y-(17+k*16)*p.s,r,0,7);g.fill()}}});
}

let toastTimer=0,lockSheet=false,tt=(typeof S.tt==='number'&&isFinite(S.tt))?S.tt:0;
/* klockan sparas lokalt då och då och när man lämnar spelet, så att tiden fortsätter där man var */
function saveClock(){try{S.tt=tt%(DAY*100);localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
setInterval(()=>{if(mode!=='menu')saveClock()},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveClock()});
window.addEventListener('pagehide',saveClock);
function toast(msg){
  const e=$('toast');e.textContent=msg;e.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{e.hidden=true},2600);
}
function updateHUD(){
  $('money').textContent=Math.round(S.money).toLocaleString('sv-SE');
  $('hold').textContent=S.hold.length+'/'+cap();
}
function setWhere(){
  let p='';
  if(mode==='fish')p=F.spot.name;
  else if(nearRamp)p=M.ramp.name;
  else if(nearDock)p=M.dock.name;
  else if(nearComp&&M.comp)p=M.comp.name;
  else if(nearCabin&&M.cabin)p=M.cabin.name;
  else if(nearYard&&M.yard)p=M.yard.name;
  else if(nearPortal)p=nearPortal.name;
  else if(nearQ&&nearQ.indexOf('npc:')===0)p=LOOK[nearQ.slice(4)].name;
  else if(nearQ==='board')p='Topplistan';
  else if(nearQ)p=nearQ==='nils'?'Gamle Nils':nearQ==='stone'?'Runstenen':nearQ==='chest'?'Gädd-Gurras kista':'Gädd-Gurras grotta';
  else if(ZN.cur)p=ZN.cur.name;
  if(mode==='cabin')p='Stugan';
  if(mode==='cave')p='Gädd-Gurras grotta';
  $('whereTxt').textContent=p;wxIcon();
}
function updateAction(){
  const b=$('btnAct');
  if(mode==='fish'){b.textContent='Åk vidare';b.disabled=false;return}
  if(mode==='cabin'){b.textContent='Gå ut';b.disabled=false;return}
  if(mode==='cave'){b.textContent='Ro ut ur grottan';b.disabled=false;return}
  if(TRL.bite){b.textContent='Dra in!';b.disabled=false;return}
  if(nearQ==='board'){b.textContent='Se topplistan';b.disabled=false;return}
  if(nearQ&&nearQ.indexOf('npc:')===0){b.textContent='Prata med '+LOOK[nearQ.slice(4)].name.split(' ')[0];b.disabled=false;return}
  if(nearQ){b.textContent=nearQ==='nils'?'Prata med Nils':nearQ==='stone'?'Undersök stenen':nearQ==='chest'?'Öppna kistan':'Ro in i grottan';b.disabled=false;return}
  if(nearSpot){
    if(spotLocked(nearSpot)){b.textContent=lockTxt(nearSpot);b.disabled=true}
    else{b.textContent=S.winter?'Pimpla här':'Fiska här';b.disabled=false}
  }else if(nearRamp){
    if(S.nakten){b.textContent='Till Näkten';b.disabled=false}
    else{b.textContent='Kräver båtsläp';b.disabled=true}
  }else if(nearPortal){const lk=portalLock(nearPortal);b.textContent=lk||('Till '+nearPortal.name);b.disabled=!!lk}
  else if(nearYard){b.textContent='Gå in på varvet';b.disabled=false}
  else if(nearDock){b.textContent=M.def.back?'Till '+MAPS[M.def.back.map].name:M.id==='nak'?'Till Storsjön':M.id==='grotta'?'Ro ut ur grottan':'Gå i hamn';b.disabled=false}
  else if(nearComp){b.textContent=COMP?'Tävling pågår':'Tävling';b.disabled=!!COMP}
  else if(nearCabin){b.textContent=S.cabin?'Gå in i stugan':'Stuga till salu';b.disabled=false}
  else{b.textContent='Tryck på sjön';b.disabled=true}
}
function openSheet(node,lock){
  const box=$('sheetIn');box.innerHTML='';lockSheet=!!lock;
  if(!lock){const x=document.createElement('button');x.className='x';x.type='button';x.textContent='X';x.setAttribute('aria-label','Stäng');x.addEventListener('click',closeSheet);box.appendChild(x)}
  box.appendChild(node);
  $('sheet').hidden=false;sheetOpen=true;holding=false;box.scrollTop=0;
}
function closeSheet(){$('sheet').hidden=true;sheetOpen=false;lockSheet=false}
$('sheet').addEventListener('pointerdown',e=>{if(e.target===$('sheet')&&!lockSheet)closeSheet()});
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function btn(label,cls,fn){const b=el('button','btn '+(cls||''),label);b.type='button';if(fn)b.addEventListener('click',fn);return b}

function showHelp(){
  const n=el('div','helpw');
  n.appendChild(el('h2',null,'Så spelar du'));
  const track=el('div','htrack');
  HELP.forEach((c,i)=>{const card=el('div','hcard');const im=document.createElement('img');im.className='hart';im.src=c.img;im.alt='';im.draggable=false;card.appendChild(im);
    card.appendChild(el('div','hnum',(i+1)+' / '+HELP.length));card.appendChild(el('h3',null,c.t));card.appendChild(el('p',null,c.d));track.appendChild(card)});
  n.appendChild(track);
  const dots=el('div','hdots');HELP.forEach((c,i)=>{const d=el('button','hdot'+(i?'':' on'));d.type='button';d.setAttribute('aria-label','Kort '+(i+1));d.addEventListener('click',()=>go(i));dots.appendChild(d)});n.appendChild(dots);
  const row=el('div','actions'),prev=btn('‹ Förra','quiet',()=>go(cur-1)),next=btn('Nästa ›','main',()=>{if(cur>=HELP.length-1)closeSheet();else go(cur+1)});
  row.appendChild(prev);row.appendChild(next);n.appendChild(row);
  let cur=0;
  const go=i=>{i=clamp(i,0,HELP.length-1);track.scrollTo({left:i*track.clientWidth,behavior:'smooth'})};
  const upd=()=>{cur=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));prev.disabled=cur===0;next.textContent=cur>=HELP.length-1?'Okej, kör!':'Nästa ›'};
  track.addEventListener('scroll',()=>requestAnimationFrame(upd));
  openSheet(n);upd();
}
function showSaveSheet(){
  save();
  const n=el('div');n.appendChild(el('h2',null,'Spara och flytta'));
  n.appendChild(el('p','sub','Spelet sparar automatiskt i den här webbläsaren, och sparningen finns kvar när spelet uppdateras. Vill du byta telefon eller ha en extra säkerhetskopia kan du använda en sparkod.'));
  n.appendChild(el('h3',null,'Din sparkod'));
  const out=el('textarea','savecode');out.id='saveOut';out.readOnly=true;out.value=exportSave();out.setAttribute('aria-label','Din sparkod');n.appendChild(out);
  const r1=el('div','actions');
  const cp=btn('Kopiera sparkoden','gold',()=>{const done=()=>toast('Sparkoden är kopierad');
    try{navigator.clipboard.writeText(out.value).then(done,()=>{out.select();toast('Markera och kopiera koden')})}catch(e){out.select();toast('Markera och kopiera koden')}});
  r1.appendChild(cp);n.appendChild(r1);
  n.appendChild(el('p','sub','Spara koden i till exempel Anteckningar. Klistra in den på en annan enhet för att fortsätta där du var.'));
  n.appendChild(el('h3',null,'Ladda en sparkod'));
  const inp=el('textarea','savecode');inp.id='saveIn';inp.placeholder='Klistra in en sparkod som börjar med GLF1:';inp.setAttribute('aria-label','Klistra in sparkod');n.appendChild(inp);
  const msg=el('p','sub');n.appendChild(msg);
  const r2=el('div','actions');
  const ld=btn('Ladda sparkoden','quiet',()=>{
    const o=parseSave(inp.value);
    if(!o){msg.className='err';msg.textContent='Det där ser inte ut som en sparkod. Kontrollera att hela koden kom med, från GLF1: till slutet.';return}
    msg.className='sub';msg.innerHTML='Sparkoden har <b>'+kr(o.money||0)+'</b> och <b>'+(o.catches||0)+'</b> fångster. Den ersätter spelet du har nu.';
    r2.innerHTML='';
    r2.appendChild(btn('Avbryt','quiet',()=>showSaveSheet()));
    r2.appendChild(btn('Ersätt mitt spel','main',()=>{
      const d=defaultS();S=Object.assign(d,o);migrateSave();save();if(mode==='fish')exitFish();switchMap('stor','dock');updateHUD();updateAction();setWhere();closeSheet();toast('Sparkoden är laddad')}));
  });
  r2.appendChild(ld);n.appendChild(r2);
  openSheet(n);
}
function freshSave(){const d=defaultS();d.music=S.music;d.sfx=S.sfx;return d}
function showResetSheet(){
  const n=el('div');n.appendChild(el('h2',null,'Börja om?'));
  n.appendChild(el('p',null,'Alla pengar, uppgraderingar och loggbok raderas.'));
  const row=el('div','actions');
  row.appendChild(btn('Avbryt','quiet',closeSheet));
  row.appendChild(btn('Radera och börja om','main',()=>{S=freshSave();save();switchMap('stor','dock');updateHUD();closeSheet();showStartMenu()}));
  n.appendChild(row);openSheet(n);
}

let logTab='catch';
const recKg=f=>f.kg[0]+(f.kg[1]-f.kg[0])*0.96;
function showLog(tab){
  if(typeof tab==='string')logTab=tab;
  const n=el('div');
  n.appendChild(el('h2',null,'Loggbok'));
  n.appendChild(el('p','sub','Arter '+speciesCount()+' av '+visFish().length+' · Fångster '+S.catches));
  const tabs=el('div','tabs');
  [['catch','Fångster'],['map','Fiskekarta'],['rec','Rekordjakt'],['ach','Prestationer']].forEach(t=>{
    const b=el('button','tab'+(logTab===t[0]?' on':''),t[1]);b.type='button';b.addEventListener('click',()=>showLog(t[0]));tabs.appendChild(b);
  });
  n.appendChild(tabs);
  if(logTab==='rec')logRec(n);else if(logTab==='ach')logAch(n);else if(logTab==='map')logMap(n);else logCatch(n);
  openSheet(n);
}
function logRec(n){
  n.appendChild(el('p','sub','Jaga storlek. Brons, silver och guld ger pengar första gången. Rekordfisk är en riktig jätte.'));
  visFish().filter(f=>!f.beast&&!f.legend).forEach(f=>{
    const e=S.log[f.id],lv=S.medals[f.id]||0,rec=!!S.ach['rec_'+f.id];
    const goal=lv>=3?recKg(f):medalKg(f,lv+1);
    const best=e?e.best:0,frac=clamp((best-f.kg[0])/(goal-f.kg[0]),0,1);
    const row=el('div','gear'),box=el('div');box.style.flex='1';
    let med='';for(let i=1;i<=3;i++)med+='<span class="medal'+(lv>=i?' m'+i:'')+'" title="'+MEDNAME[i-1]+'"></span>';
    box.appendChild(el('div','name',med+f.name+(rec?' <span class="done">· Rekordfisk</span>':'')));
    const nxt=lv>=3?(rec?'Alla mål klara':'Nästa: Rekordfisk '+kgTxt(recKg(f))):'Nästa: '+MEDNAME[lv]+' '+kgTxt(medalKg(f,lv+1));
    box.appendChild(el('div','sub',(e?'Bäst '+kgTxt(best):'Inte fångad än')+' · '+nxt));
    const bar=el('div','pbar'),fill=el('i');bar.appendChild(fill);fill.style.width=Math.round(frac*100)+'%';
    box.appendChild(bar);row.appendChild(box);n.appendChild(row);
  });
}
function logAch(n){
  const got=ACH.filter(a=>S.ach[a.id]).length;
  n.appendChild(el('p','sub','Klara '+got+' av '+ACH.length+'. Varje prestation ger pengar.'));
  ACH.forEach(a=>{
    const d=!!S.ach[a.id],pr=a.pr(S),row=el('div','gear'),box=el('div');box.style.flex='1';
    box.appendChild(el('div','name',a.n+(d?' <span class="done">· Klar</span>':'')));
    box.appendChild(el('div','sub',a.d+' · Belöning '+kr(a.r)));
    if(!d){const bar=el('div','pbar'),fill=el('i');bar.appendChild(fill);fill.style.width=Math.round(clamp(pr[0]/pr[1],0,1)*100)+'%';box.appendChild(bar)}
    row.appendChild(box);n.appendChild(row);
  });
}

function knowTick(dt){
  if(F.state==='idle'&&!F.land&&F.t>20)return;
  const E=S.expo||(S.expo={});const add=(c,x)=>{const o=E[c]||(E[c]={});o[x]=(o[x]||0)+dt};
  add('ph',phaseOf(dayU(clock)));add('wx',wxKey());if(F.spot)add('sp',F.spot.id);add('bt',S.baitSel);add('rd',S.rodSel);
}
function knowEntry(fid){const K=S.know||(S.know={});return K[fid]||(K[fid]={n:0,sp:{},ph:{},wx:{},bt:{},rd:{},dz:[0,0,0]})}
function curDepth(){return S.winter?(F.jd==null?.5:F.jd):clamp((F.dy-128)/162,0,1)}
/* En slutsats per område, eller null om det är för tidigt att säga */
function knowSure(k,cat){
  const o=cat==='dz'?{0:k.dz[0],1:k.dz[1],2:k.dz[2]}:k[cat];const keys=Object.keys(o).filter(x=>o[x]>0);
  const N=keys.reduce((a,x)=>a+o[x],0);if(N<4)return null;
  let sc={};
  if(cat!=='dz'){/* jämför mot hur länge du fiskat med varje: minst två olika måste vara provade */
    const E=(S.expo&&S.expo[cat])||{},tried=Object.keys(E).filter(x=>E[x]>=120);if(tried.length<2)return null;
    tried.concat(keys).forEach(x=>{sc[x]=(o[x]||0)/Math.max(E[x]||0,120)});}
  else keys.forEach(x=>sc[x]=o[x]);
  const tot=Object.keys(sc).reduce((a,x)=>a+sc[x],0);if(!tot)return null;
  let best=null,bs=0;for(const x in sc)if(sc[x]>bs){bs=sc[x];best=x}
  if((o[best]||0)<3||bs/tot<.45)return null;
  return best;
}

function knowRecord(c){
  if(c.f.beast||c.f.legend)return [];
  const k=knowEntry(c.f.id),before={};KCATS.forEach(cat=>before[cat]=knowSure(k,cat));
  const inc=(o,x)=>o[x]=(o[x]||0)+1;
  k.n++;inc(k.sp,c.spotId);inc(k.ph,phaseOf(dayU(clock)));inc(k.wx,wxKey());inc(k.bt,S.baitSel);inc(k.rd,S.rodSel);
  const dz=curDepth();k.dz[dz<.34?0:dz<.67?1:2]++;
  const out=[];KCATS.forEach(cat=>{const a=knowSure(k,cat);if(a!=null&&a!==before[cat])out.push(knowPhrase(c.f,cat,a))});
  return out;
}

const ORDLVL=['Lätt','Medel','Svår'];
/* Svårighet = hur många fångster det väntas ta (E). Lätt ~7, medel ~22, svår ~55,
   räknat på fiskplatser du redan kan nå. */
function orderShares(){
  const spots=[];
  (S.nakten?['stor','nak']:['stor']).forEach(m=>MAPS[m].spots.forEach(s=>{if(!spotLocked(s))spots.push(s)}));
  const share={};
  spots.forEach(s=>{
    const tot=Object.keys(s.pool).reduce((a,i)=>a+s.pool[i],0);
    for(const i in s.pool)if(!FBY[i].beast&&!FBY[i].legend)share[i]=(share[i]||0)+s.pool[i]/tot/spots.length;
  });
  return share;
}
function newOrder(lvl){
  const share=orderShares(),ids=Object.keys(share),have=S.orders.map(o=>o.fid);
  const tgt=[7,22,55][lvl]*rnd(0.8,1.2);
  const opts=[];
  ids.forEach(id=>{
    [1,2].forEach(n=>{
      if(lvl===0&&n===2&&Math.random()<0.5)return;
      const p=n/(share[id]*tgt);
      if(p<0.05||p>0.95)return;
      opts.push({id:id,n:n,p:p,dup:have.indexOf(id)>=0});
    });
  });
  let pool=opts.filter(o=>!o.dup);if(!pool.length)pool=opts;
  if(!pool.length){const id=ids[0];pool=[{id:id,n:1,p:0.5}]}
  const o=pool[Math.floor(Math.random()*pool.length)],f=FBY[o.id];
  const q=Math.pow(1-o.p,2);
  const minKg=Math.max(f.kg[0],Math.round((f.kg[0]+(f.kg[1]-f.kg[0])*q)*20)/20);
  const reward=Math.round((o.n*priceFor(f,minKg)*[1.3,1.6,2][lvl]+[20,120,400][lvl]*(o.n>1?1.3:1))/5)*5;
  const from=ORDERERS[Math.floor(Math.random()*ORDERERS.length)];
  return {id:Date.now()+Math.random(),fid:f.id,n:o.n,minKg:minKg,reward:reward,from:from,lvl:lvl};
}
function ensureOrders(){
  for(let l=0;l<3;l++)if(!S.orders.some(o=>o.lvl===l))S.orders.push(newOrder(l));
  S.orders.sort((a,b)=>a.lvl-b.lvl);
}
function orderMatches(o){
  const m=[];S.hold.forEach((h,i)=>{if(h.id===o.fid&&h.kg>=o.minKg)m.push(i)});
  m.sort((a,b)=>S.hold[a].kg-S.hold[b].kg);return m;
}

function deliverOrder(o){

  const del=m.slice(0,o.n).sort((a,b)=>b-a);del.forEach(i=>S.hold.splice(i,1));

function showHarbor(tab){

  const d=SHOPS[shop];
  const n=el('div');
  const back=btn('‹ Hamnen','small quiet back',showHarborHub);n.appendChild(back);
  const ban=el('div','shop-banner '+shop);const art=shopArtCopy(shop);art.className='hub-art';ban.appendChild(art);

  d.tabs.forEach(t=>{
    let label=t[1];
    if(t[0]==='sell'&&S.hold.length)label+=' ('+S.hold.length+')';
    const b=el('button','tab'+(harborTab===t[0]?' on':''),label);b.type='button';b.addEventListener('click',()=>showHarbor(t[0]));tabs.appendChild(b);
  });
  n.appendChild(tabs);
  const k=harborTab;
  if(k==='sell')harborSell(n);

  const y=Math.round(M.WH*fy);let a=-1,b=-1;for(let x=4;x<M.WW-4;x+=2){if(!M.isLand(x,y)){if(a<0)a=x;b=x}}

function boardPos(){
  if(M.id!=='stor')return null;if(M.bp)return M.bp;
  const cx=313;let y=142;while(y<M.WH-10&&M.isLand(cx,y))y++;
  const bp={lx:cx,ly:y-7,x:cx,y:y+14};
  if(M.rows)M.rows.forEach((r,i)=>{if(r)M.rows[i]=r.filter(o=>Math.hypot(o.x-bp.lx,o.y-bp.ly)>14)});
  return M.bp=bp;
}
function boardNear(){const bp=boardPos();return bp&&B.tx==null&&Math.hypot(bp.x-B.x,bp.y-B.y)<30}
function boardDyn(dyn,g,t,WIN){
  const bp=boardPos();if(!bp)return;
  dyn.push({y:bp.ly,fn:()=>{const p=proj(bp.lx,bp.ly);if(p)drawBoard(g,p.x,p.y,p.s,t,WIN)}});
}
function drawBoard(g,x,y,s,t,WIN){
  const u=s*1.15;
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x+u,y,u*5,u*1.1,0,0,7);g.fill();
  /* stolpar */
  g.fillStyle='#5a3a1e';g.fillRect(x-u*4.2,y-u*9,u*.9,u*9);g.fillRect(x+u*3.3,y-u*9,u*.9,u*9);
  /* tavlan */
  g.fillStyle='#7a5230';g.fillRect(x-u*4.8,y-u*11.5,u*9.6,u*6.2);
  g.fillStyle=WIN?'#e8eef2':'#c99a5e';g.fillRect(x-u*4.3,y-u*11,u*8.6,u*5.2);
  /* rader */
  g.fillStyle='rgba(60,36,16,.55)';for(let i=0;i<3;i++){g.fillRect(x-u*1.6,y-u*(10.1-i*1.5),u*5,u*.45)}
  ['#e8b84a','#c9ced3','#c07a3e'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(x-u*2.6,y-u*(9.9-i*1.5),u*.55,0,7);g.fill()});
  /* tak */
  g.fillStyle=WIN?'#f4f7fa':'#8a2a22';g.beginPath();g.moveTo(x-u*5.6,y-u*11.4);g.lineTo(x,y-u*14);g.lineTo(x+u*5.6,y-u*11.4);g.closePath();g.fill();
  /* pokal på toppen */
  const by=y-u*15.6+Math.sin(t*2)*u*.2;
  g.fillStyle='#e8b84a';g.beginPath();g.moveTo(x-u*1.2,by-u*1);g.lineTo(x+u*1.2,by-u*1);g.lineTo(x+u*.7,by+u*.6);g.lineTo(x-u*.7,by+u*.6);g.closePath();g.fill();
  g.fillRect(x-u*.25,by+u*.6,u*.5,u*.8);g.fillRect(x-u*.8,by+u*1.3,u*1.6,u*.4);
  g.fillStyle='rgba(255,250,220,.8)';g.fillRect(x-u*.7,by-u*.8,u*.35,u*.9);
  const na=nightAmt(dayU(t));
  if(na>.2)LAMPQ.push(()=>{g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,by,0,x,by,u*5);gr.addColorStop(0,'rgba(255,210,110,'+(.3*na).toFixed(2)+')');gr.addColorStop(1,'rgba(255,210,110,0)');g.fillStyle=gr;g.beginPath();g.arc(x,by,u*5,0,7);g.fill();g.restore()});
}

function sunPos(u){if(u<.02||u>=.55)return null;const p=(u-.02)/.53;return {p:p,x:14+p*152,y:64-Math.sin(p*Math.PI)*48,lo:1-Math.sin(p*Math.PI)}}
function sunRays(g,t,u,na){
  const sun=sunPos(u);if(!sun||na>.9||mode==='cabin'||mode==='cave'||inCaveMap())return;
  const wa=typeof wxA==='function'?(1-wxA('rain')*.9)*(1-wxA('fog')*.5):1,base=(1-na)*wa;if(base<.02)return;
  g.globalCompositeOperation='screen';
  if(mode==='sail'){
    /* strålar som står på bestämda platser i landskapet; lutningen följer solen */
    const slant=lerp(-.55,.55,sun.p),warm=sun.lo>.6?'255,190,120':'255,222,160';
    const SX=150,SY=170,d=V.D||D0;
    const y0=Math.floor((V.camY-d*1.7)/SY),y1=Math.floor((V.camY-d*.05)/SY);
    for(let j=y1;j>=y0;j--)for(let i=Math.floor((V.camX-260)/SX);i<=Math.floor((V.camX+260)/SX);i++){
      if(hash2(i*3.1,j*7.7)<.35)continue;
      const wx=i*SX+hash2(i,j+5)*SX*.7,wy=j*SY+hash2(i+9,j)*SY*.7,p=proj(wx,wy);if(!p)continue;
      const hgt=170*p.s,bw=(9+hash2(i,j)*12)*p.s,tx=p.x+slant*hgt,ty=p.y-hgt;
      if(Math.max(p.x,tx)+bw<-10||Math.min(p.x,tx)-bw>W+10||p.y<-20||ty>H+20)continue;
      const a=.2*base*(.6+.4*Math.sin(t*.25+i*1.7+j*2.3));
      const lg=g.createLinearGradient(tx,ty,p.x,p.y);lg.addColorStop(0,'rgba('+warm+',0)');lg.addColorStop(.35,'rgba('+warm+','+a.toFixed(3)+')');lg.addColorStop(1,'rgba('+warm+','+(a*.35).toFixed(3)+')');
      g.fillStyle=lg;g.beginPath();g.moveTo(tx-bw*.7,ty);g.lineTo(tx+bw*.7,ty);g.lineTo(p.x+bw,p.y);g.lineTo(p.x-bw,p.y);g.closePath();g.fill();
      const pr=bw*1.3,pg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,pr);pg.addColorStop(0,'rgba('+warm+','+(a*1.2).toFixed(3)+')');pg.addColorStop(1,'rgba('+warm+',0)');
      g.fillStyle=pg;g.save();g.translate(p.x,p.y);g.scale(1,.42);g.translate(-p.x,-p.y);g.fillRect(p.x-pr,p.y-pr,pr*2,pr*2);g.restore();
    }
  }else{
    /* från sidan: mjuka, svaga strålar från solen som bara syns i luften ovanför vattnet */
    g.save();g.beginPath();g.rect(0,0,W,101);g.clip();
    for(let i=0;i<5;i++){
      const ang=Math.PI/2+(i-2)*.36+(90-sun.x)/260+Math.sin(t*.15+i*1.9)*.04,len=150;
      const a=.028*base*(.55+.45*Math.sin(t*.35+i*2.1)),ex=sun.x+Math.cos(ang)*len,ey=sun.y+Math.sin(ang)*len;
      const lg=g.createLinearGradient(sun.x,sun.y,ex,ey);lg.addColorStop(0,'rgba(255,226,170,0)');lg.addColorStop(.12,'rgba(255,226,170,'+a.toFixed(3)+')');lg.addColorStop(1,'rgba(255,226,170,0)');
      g.fillStyle=lg;
      for(let k=0;k<3;k++){const w=.025+k*.02;g.beginPath();g.moveTo(sun.x,sun.y);g.lineTo(sun.x+Math.cos(ang-w)*len,sun.y+Math.sin(ang-w)*len);g.lineTo(sun.x+Math.cos(ang+w)*len,sun.y+Math.sin(ang+w)*len);g.closePath();g.fill()}
    }
    g.restore();
  }
  g.globalCompositeOperation='source-over';
}
/* Svävande partiklar: pollen och damm som glittrar i solen på dagen, eldflugor som blinkar på natten */
const PART={list:[],lt:0};
function partSpawn(night,fishView,init){
  const z=Math.random(),base={vx:rnd(-2,2),vy:night?rnd(-1.5,1.5):rnd(-3,-.5),z:z,ph:Math.random()*6.3,age:init?Math.random()*6:0,
    life:night?rnd(7,13):rnd(5,10),night:night,blink:rnd(1.6,3.4),world:!fishView};
  if(fishView)return Object.assign(base,{x:Math.random()*W,y:6+Math.random()*88});
  /* På sjön hör partiklarna till världen: en plats på kartan och en höjd över marken */
  const d=V.D||D0,wy=V.camY-rnd(d*.12,d*1.5),w=W/(V.f/(V.camY-wy))*1.1;
  return Object.assign(base,{x:V.camX+rnd(-w/2,w/2),y:wy,h:night?rnd(2,9):rnd(4,26)});
}
function partScreen(p){
  if(!p.world)return {x:p.x,y:p.y,s:1};
  const q=proj(p.x,p.y);if(!q)return null;return {x:q.x,y:q.y-p.h*q.s,s:q.s};
}
function partDraw(g,t,na){
  const dt=clamp(t-PART.lt,0,.05);PART.lt=t;
  const night=na>.5,fishView=mode!=='sail',rain=typeof wxA==='function'?wxA('rain'):0,wind=typeof wxA==='function'?wxA('wind'):0,fog=typeof wxA==='function'?wxA('fog'):0;
  const want=Math.round((night?12:16)*(fishView?1:1.6)*(1-rain)*(1-fog*.5));
  if(PART.list.length<want&&Math.random()<dt*(fishView?6:10))PART.list.push(partSpawn(night,fishView,PART.list.length<want/2));
  g.globalCompositeOperation='lighter';
  for(let i=PART.list.length-1;i>=0;i--){
    const p=PART.list[i];p.age+=dt;
    if(p.night!==night&&p.age<p.life-1.2)p.age=p.life-1.2;
    const sp=p.age>p.life||p.world===fishView||PART.list.length>want+6?null:partScreen(p);
    if(!sp||sp.x<-14||sp.x>W+14||sp.y<-14||sp.y>H+14||(!p.world&&(sp.y<2||sp.y>98))){PART.list.splice(i,1);continue}
    const sw=p.night?1.6:1;
    p.vx+=(Math.sin(t*.6+p.ph)*2.2*sw+wind*14-p.vx*.6)*dt;p.vy+=(Math.cos(t*.8+p.ph*1.7)*1.6*sw-(p.night||p.world?0:.6)-p.vy*.5)*dt;
    const k=dt*(.6+.6*p.z);p.x+=p.vx*k;
    if(p.world){p.y+=p.vy*k*.6;p.h=Math.max(1.5,p.h+(p.night?Math.sin(t*1.3+p.ph)*2:.8+Math.sin(t+p.ph))*dt)}else p.y+=p.vy*k;
    const fade=Math.sin(Math.PI*clamp(p.age/p.life,0,1)),zs=p.world?clamp(sp.s/1.4,.55,1.6):1,x=sp.x,y=sp.y;
    if(p.night){
      const c=((t+p.ph)%p.blink)/p.blink,on=c<.36?Math.sin(c/.36*Math.PI):0;if(on<.02)continue;
      const r=(3+p.z*3.5)*zs;g.globalAlpha=fade*on*.95;g.drawImage(GLOW_N,x-r,y-r,r*2,r*2);
      g.globalAlpha=fade*on;g.fillStyle='#f6ffc4';g.beginPath();g.arc(x,y,(.45+p.z*.35)*zs,0,7);g.fill();
    }else{
      const tw=.65+.35*Math.sin(t*2.3+p.ph*3),r=(2+p.z*2.6)*zs,a=fade*tw*(.5+.45*p.z);
      g.globalAlpha=a*.6;g.drawImage(GLOW_W,x-r,y-r,r*2,r*2);
      g.globalAlpha=a;g.fillStyle='#fff6dc';g.beginPath();g.arc(x,y,(.4+p.z*.5)*zs,0,7);g.fill();
      const gl=Math.sin(t*1.7+p.ph*5);if(gl>.94&&p.z>.4){const kk=(gl-.94)/.06,L=(1.2+kk*2.6*p.z)*zs;g.globalAlpha=fade*kk*.85;g.strokeStyle='#fffaf0';g.lineWidth=.3;
        g.beginPath();g.moveTo(x-L,y);g.lineTo(x+L,y);g.moveTo(x,y-L);g.lineTo(x,y+L);g.stroke()}
    }
  }
  g.globalAlpha=1;
}
const MOTES=[];for(let i=0;i<34;i++)MOTES.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,sp:1.5+Math.random()*4,ph:Math.random()*6.3,big:i<6});
function post(t){
  const g=mctx,sail=mode==='sail',u=dayU(t),na=nightAmt(u);
  q1c.imageSmoothingEnabled=true;q1c.drawImage(buf,0,0,q1.width,q1.height);
  q2c.drawImage(q1,0,0,q2.width,q2.height);q3c.drawImage(q2,0,0,q3.width,q3.height);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.imageSmoothingEnabled=false;g.drawImage(buf,0,0,cv.width,cv.height);
  /* tilt-shift: suddig upptill och nertill, skarp runt båten */
  blc.globalCompositeOperation='copy';blc.imageSmoothingEnabled=true;blc.drawImage(q2,0,0,bl.width,bl.height);
  
  blc.globalCompositeOperation='destination-in';
  const mk=blc.createLinearGradient(0,0,0,bl.height);
  const stops=(mode==='cabin'||mode==='cave')?[[0,.35],[.06,0],[.94,0],[1,.35]]:sail?[[0,.8],[.1,.55],[.26,0],[.8,0],[.94,.4],[1,.7]]:[[0,.6],[.1,.25],[.17,0],[.88,0],[1,.45]];
  stops.forEach(s=>mk.addColorStop(s[0],'rgba(0,0,0,'+s[1]+')'));
  blc.fillStyle=mk;blc.fillRect(0,0,bl.width,bl.height);blc.globalCompositeOperation='source-over';
  g.imageSmoothingEnabled=true;g.drawImage(bl,0,0,cv.width,cv.height);
  /* glöd */
  g.globalCompositeOperation='screen';g.globalAlpha=.12+.08*na;g.drawImage(q3,0,0,cv.width,cv.height);
  /* varm färgton */
  g.globalAlpha=1;g.globalCompositeOperation='soft-light';
  const gr=g.createLinearGradient(0,0,0,cv.height);
  const WN=!!S.winter,nk=clamp((na-.25)/.5,0,1),nm=nk*nk*(3-2*nk),mixc=(a,b)=>'rgba('+a.map((v,i)=>i<3?Math.round(v+(b[i]-v)*nm):(v+(b[i]-v)*nm).toFixed(3)).join(',')+')';
  gr.addColorStop(0,mixc(WN?[255,214,170,.5]:[255,186,100,.8],[110,140,220,.55]));gr.addColorStop(1,mixc(WN?[120,150,210,.45]:[196,104,40,.7],[40,60,120,.5]));
  g.fillStyle=gr;g.fillRect(0,0,cv.width,cv.height);
  g.globalCompositeOperation='source-over';
  const vg=g.createRadialGradient(cv.width/2,cv.height*.56,cv.height*.22,cv.width/2,cv.height*.56,cv.height*.74);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,8,0,.5)');g.fillStyle=vg;g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(K,0,0,KY,0,0);
  /* solstrålar: på sjön sitter de fast i världen, vid fiskeplatserna kommer de från solen */
  sunRays(g,t,u,na);
  /* svävande ljuspartiklar, eldflugor på natten */
  if(mode==='cabin'||mode==='cave'||inCaveMap()){
  }else if(S.winter){
    g.globalCompositeOperation='source-over';
    for(const f of FLAKES){const y=((f.y+t*f.sp)%(H+10)+H+10)%(H+10)-5,x=((f.x+Math.sin(t*.7+f.ph)*8+t*3*f.z)%(W+10)+W+10)%(W+10)-5;
      g.globalAlpha=.55+.4*f.z;g.fillStyle='#ffffff';g.beginPath();g.arc(x,y,.35+f.z*1.1,0,7);g.fill()}
    g.globalAlpha=1;
  }else{
  partDraw(g,t,na);
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.imageSmoothingEnabled=false;
  if(mode==='fish'&&F.state==='reel'&&F.reel)reelUI(g);
  if(COMP&&!COMP.ended&&mode!=='menu')compUI(g,t);
  if(FADE.a>0&&FADE.c){const nw=performance.now();FADE.a=Math.max(0,FADE.a-(nw-FADE.lt)/1000/FADE.d);FADE.lt=nw;const e=FADE.a*FADE.a*(3-2*FADE.a);
    g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=e;g.drawImage(FADE.c,0,0,cv.width,cv.height);g.restore();g.setTransform(K,0,0,KY,0,0);g.globalAlpha=1}
  flushTxt();
}

/* klockan: ett dygn i spelet är sex minuter, gryningen börjar vid sex */
let clkTxt='';
function clockUI(){
  const el0=$('clk');if(!el0)return;
  const m=Math.floor(((dayU(tt)*24+6)%24)*60/10)*10,s0=mode==='menu'?'':String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  if(s0!==clkTxt){clkTxt=s0;el0.textContent=s0}
}
/* den röda knappen ruskar till när det dyker upp något nytt att trycka på (inte fiskeplatser) */
const NUD={k:''};
function nudgeCheck(){
  let k='';
  if(mode==='sail'&&B.tx==null&&!sheetOpen)k=nearQ||(nearYard?'yard':'')||(nearComp&&!COMP?'comp':'')||(nearCabin?'cabin':'')||(nearPortal&&!portalLock(nearPortal)?'portal:'+nearPortal.to:'');
  if(k&&k!==NUD.k){const b=$('btnAct');if(b&&!b.disabled){b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge');vib(30)}}
  if(mode==='sail'&&B.tx!=null)return;
  NUD.k=k;
}
/* ---------- Huvudloop ---------- */
let last=performance.now(),whereT=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!sheetOpen){
    tt+=dt;
    if(mode==='sail')sailUpdate(dt,tt);else if(mode==='fish'){fishUpdate(dt,tt);hotUpdate(dt)}
    if(mode==='sail'||mode==='fish')seasonTick(dt);
    if(COMP)compTick(dt);
    if(mode!=='menu')wxUpdate(dt);
    whereT-=dt;if(whereT<=0){whereT=1.5;if(mode!=='menu')setWhere()}
  }
  ctx.setTransform(PB,0,0,PB,0,0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  TXQ.length=0;
  if(mode==='sail')sailDraw(tt);else if(mode==='cabin')cabinDraw(tt);else if(mode==='cave')caveDraw(tt);else fishDraw(tt);
  if(mode==='fish')depthScale(ctx,tt);
  if(mode!=='cabin'&&mode!=='cave'&&!inCaveMap())wxScreen(ctx,tt);
  if(mode==='fish'&&F.land)landingDraw(tt);
  post(tt);
  updateGear();thrUI();clockUI();nudgeCheck();
  requestAnimationFrame(frame);
}
placeAt(M.dock);
fit();updateHUD();showStartMenu();
setTimeout(()=>{try{buildTex(MAPS.stor)}catch(e){}},400);
requestAnimationFrame(frame);
})();
