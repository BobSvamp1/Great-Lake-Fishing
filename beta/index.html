      FIGK='mp'+id;if(WIN)drawSledMap(g,p.x,p.y,p.s,o.a,sq(p),t,Math.min(2,o.s),'def');else drawBoatMap(g,p.x,p.y,p.s,o.a,o.b,sq(p),t,0);
      if(pas.length){FIGK='mpp'+id;mpPassFig(g,p,o.a,sq(p),WIN,o.b)}FIGK=null;
      TXQ.push([[o.n].concat(pas).join(' + '),p.x,p.y-11*p.s-4,{col:'#bfe9ff',size:7}])}});
  }
}
/* vänner utanför skärmen visas med en liten blå pil vid kanten */
function mpArrows(g,t){
  if(!MP.role||mode!=='sail')return;
  const bp=proj(B.x,B.y);if(!bp)return;
  for(const id in MP.others){const o=MP.others[id];if(o.x==null||o.r||id===MP.ride||o.m!==M.id||(o.md!=='sail'&&o.md!=='fish'))continue;
    const p=proj(o.x,o.y);if(p&&p.x>8&&p.x<W-8&&p.y>8&&p.y<H-8)continue;
    let dx=o.x-B.x,dy=o.y-B.y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    let k=1e9;if(dx)k=Math.min(k,((dx>0?W-12:12)-bp.x)/dx);if(dy)k=Math.min(k,((dy>0?H-12:12)-bp.y)/dy);
    const ax=bp.x+dx*k,ay=bp.y+dy*k;
    g.save();g.translate(ax,ay);g.rotate(Math.atan2(dy,dx));
    g.fillStyle='rgba(8,20,32,.55)';g.beginPath();g.moveTo(6,0);g.lineTo(-3.5,-4.2);g.lineTo(-1.5,0);g.lineTo(-3.5,4.2);g.closePath();g.fill();
    g.fillStyle='#7fd0ff';g.beginPath();g.moveTo(5,0);g.lineTo(-3,-3.4);g.lineTo(-1.3,0);g.lineTo(-3,3.4);g.closePath();g.fill();
    g.restore();
    TXQ.push([o.n,clamp(ax-dx*14,18,W-18),clamp(ay-dy*10,10,H-8),{col:'#bfe9ff',size:6}]);
  }
}

/* ---- åka med i en kompis båt ---- */
let SIDE2=null;
MP.ride=null;
function mpRiders(id){const r=[];for(const k in MP.others)if(MP.others[k].r===id)r.push(MP.others[k]);return r}
function mpBoardable(){
  if(!MP.role||MP.ride||mode!=='sail'||COMP||mpRiders(MP.me).length)return null;
  let best=null,bd=20;
  for(const id in MP.others){const o=MP.others[id];
    if(o.x==null||o.r||o.m!==M.id||!!o.w!==!!S.winter||o.md!=='sail'||mpRiders(id).length)continue;
    const d=Math.hypot(o.x-B.x,o.y-B.y);if(d<bd){bd=d;best=id}}
  return best;
}
function mpBoard(id){
  const o=MP.others[id];if(!o)return;
  MP.ride=id;B.tx=null;B.path=[];B.wake=[];SND.click();
  toast(LANG==='en'?'You boarded '+o.n+"'s "+(S.winter?'snowmobile':'boat')+'. '+o.n+' drives, and when they fish, you fish together.':'Du klev på '+o.n+(S.winter?'s skoter':'s båt')+'. '+o.n+' kör, och när '+o.n+' fiskar fiskar ni tillsammans.');
  updateAction();mpNet();
}
function mpUnboard(msg){
  if(!MP.ride)return;MP.ride=null;
  const a=B.ang+Math.PI/2;
  for(const d of [10,-10,14,-14,18,-18,24,-24]){const x=B.x+Math.cos(a)*d,y=B.y+Math.sin(a)*d;if(M.free(x,y)){B.x=x;B.y=y;break}}
  B.tx=null;B.path=[];if(msg)toast(msg);updateAction();mpNet();
}
function mpRideTick(){
  const bb=$('mpBoard');
  if(MP.ride){
    const o=MP.others[MP.ride];
    if(!o||!(o.md==='sail'||o.md==='fish')||!!o.w!==!!S.winter){mpUnboard(o?o.n+' gick i land, så du klev av.':'Föraren lämnade spelet, så du klev av.')}
    else{
      if(o.m!==M.id&&MAPS[o.m]&&!sheetOpen){if(mode==='fish'&&!F.land)exitFish();if(mode==='sail'){switchMap(o.m,'dock');updateAction();setWhere()}}
      if(o.m===M.id){B.x=o.x;B.y=o.y;B.ang=o.a;B.tx=null;B.path=[]}
      if(!sheetOpen&&o.m===M.id){
        if(o.md==='fish'&&mode==='sail')enterFish(fishSpotAt(B.x,B.y));
        else if(o.md==='sail'&&mode==='fish'&&!F.land&&['idle','waiting','casting','done'].indexOf(F.state)>=0)exitFish();
      }
    }
  }
  const id=mpBoardable(),want=id?(LANG==='en'?'Board '+MP.others[id].n+(S.winter?"'s snowmobile":"'s boat"):'Kliv på '+MP.others[id].n+(S.winter?'s skoter':'s båt')):'';
  if(bb){if(!want){if(!bb.hidden)bb.hidden=true}else{if(bb.hidden)bb.hidden=false;if(bb.dataset.id!==id||bb.textContent!==want){bb.dataset.id=id;bb.textContent=want}}}
}
function mpPassFig(g,p,ang,sqv,WIN,lvl){
  const s=p.s,u=s*.95,ca=Math.cos(ang),sa=Math.sin(ang);
  if(WIN){const x=p.x-ca*6.6*s,y=p.y-sa*6.6*s*sqv-3.2*s;mapFigure(g,x,y+u*.2,u,ang,{col:'#3a8fd0',hat:'beanie',pose:'drive'})}
  else{const B0=hullOf(lvl,0),k=B0.canoe?1:B0.trawler?1.65:lvl>=2?1.15:1,off=(B0.cabin?3.2:4.4)*k,x=p.x+ca*off*s,y=p.y+sa*off*s*sqv-s*2.6+s*.6;
    mapFigure(g,x,y+u*.3,u,ang,{col:'#3a8fd0',hat:'beanie',pose:'drive',vest:true})}
}
/* i fiskevyn: kompisen sitter i fören med sitt eget spö */
function mpSidePartner(){
  if(!MP.role||mode!=='fish'||S.winter)return null;
  if(MP.ride){const o=MP.others[MP.ride];if(o&&o.md==='fish'&&o.m===M.id)return {o:o,b:o.b}}
  const rs=mpRiders(MP.me).filter(o=>o.md==='fish'&&o.m===M.id);
  return rs.length?{o:rs[0],b:null}:null;
}
function mpSideRod(g,t,rigY){
  const P=SIDE2,o=P.o,h=P.hand;if(!h)return;
  const st=o.fs||'idle',tipX=h.x+30,tipY=rigY-38+(st==='reel'?6+Math.sin(t*20):st==='bite'?3:0);
  g.lineCap='round';
  for(let k=0;k<5;k++){const a=k/5,b2=(k+1)/5;g.strokeStyle='#2e3238';g.lineWidth=1.05*(1-k*.13);g.beginPath();
    g.moveTo(h.x+(tipX-h.x)*a,h.y+(tipY-h.y)*a-Math.sin(a*Math.PI)*3);g.lineTo(h.x+(tipX-h.x)*b2,h.y+(tipY-h.y)*b2-Math.sin(b2*Math.PI)*3);g.stroke()}
  const lx=Math.min(BAR_X-10,BX+14),inW=st==='waiting'||st==='bite'||st==='reel'||st==='strike';
  const ly=inW?clamp(o.fd||HOOK_Y,WATER_Y+10,292):tipY+12;
  g.strokeStyle='rgba(236,244,240,.6)';g.lineWidth=.4;g.beginPath();g.moveTo(tipX,tipY);
  if(inW){g.quadraticCurveTo((tipX+lx)/2,tipY+4,lx+(st==='reel'?Math.sin(t*9)*2:0),WATER_Y+1);g.stroke();
    g.strokeStyle='rgba(236,244,240,.32)';g.beginPath();g.moveTo(lx,WATER_Y+1);g.lineTo(lx+(st==='reel'?Math.sin(t*9)*2:0),ly);g.stroke();
    g.fillStyle=st==='reel'?'#ffd45a':'rgba(220,230,235,.8)';g.beginPath();g.arc(lx,ly+1.5,1.3,0,7);g.fill();
    if(st==='bite'||st==='reel'){const r=2+((t*3)%1)*5;g.strokeStyle='rgba(255,255,255,'+(.6-((t*3)%1)*.5).toFixed(2)+')';g.lineWidth=.5;g.beginPath();g.ellipse(lx,WATER_Y+.6,r,r*.3,0,0,7);g.stroke()}}
  else{g.lineTo(tipX+1,tipY+12);g.stroke()}
  TXQ.push([o.n+(st==='reel'?(LANG==='en'?' is reeling!':' drar in en fisk!'):''),h.x+8,rigY-46,{col:'#bfe9ff',size:6.5}]);
}
/* fångster syns för alla */
function mpCatch(c){
  if(!MP.role||!c||!c.f)return;
  const d={t:'c',f:c.f.id,kg:c.kg,g:c.gold?1:0};
  if(MP.role==='guest')mpSend(MP.host,d);else mpAll(Object.assign({n:mpName()},d));
}
function mpCatchToast(n,d){
  const f=FBY[d.f];if(!f)return;
  const nm=d.g?gname(f,true):f.name,big=f.legend||f.beast||d.g;
  toast((n||'Din kompis')+' fick '+(f.legend||f.beast?nm:nm.toLowerCase())+' · '+kgTxt(d.kg)+(big?'!':''));
}
/* skatter: gästen frågar hosten när den kommer fram, hosten avgör vem som hann först */
function mpTreasure(){
  if(MP.role!=='guest')return false;
  const o=TR.obj;if(o&&!o.asked&&Math.hypot(o.x-B.x,o.y-B.y)<13){o.asked=1;mpSend(MP.host,{t:'grab',k:o.mid})}
  return true;
}
function mpEnd(msg){
  const role=MP.role;
  try{if(role==='guest'&&MP.host)mpSend(MP.host,{t:'bye'})}catch(_){}
  if(role==='host')mpAll({t:'bye'});
  const p=MP.peer;setTimeout(()=>{try{p&&p.destroy()}catch(_){}},250);
  if(role==='guest'&&MP.own){
    const o=MP.own;const was=!!S.winter;
    MPKEYS.forEach(k=>{if(k!=='tt')S[k]=o[k]});tt=o.tt;
    if(was!==!!S.winter){if(mode==='fish')exitFish();B.wake=[];SCHOOLMEM.length=0;if(mode==='cabin'&&typeof CAB_FG2!=='undefined')CAB_FG2=null;fadeSnap(2.2)}
    TR.obj=null;WX.k='sun';WX.a=0;WX.next=rnd(100,170);wxHud();updateAction();setWhere();
  }
  MP.ride=null;MP.role=null;MP.peer=null;MP.host=null;MP.conns={};MP.others={};MP.own=null;MP.want=null;MP.busy=false;MP.tr=null;MP.code='';
  save();mpUI();if(msg)toast(msg);if(MP.sheet)mpSheet();
}
window.addEventListener('pagehide',()=>{if(MP.role)try{mpEnd('')}catch(e){}});
function mpUI(){
  const c=$('mpChip');if(!c)return;c.hidden=!MP.role;if(MP.role)$('mpN').textContent=mpCount();
}
function mpSheet(){
  const n=el('div','mpsheet');
  n.appendChild(el('h2',null,'Spela med kompisar'));
  if(MP.role==='host'){
    n.appendChild(el('p','sub','Be dina kompisar trycka på <b>Gå med</b> och skriva in koden. Ni kan vara upp till '+MP_MAX+' stycken.'));
    n.appendChild(el('div','mpcode',MP.code));
  }else if(MP.role==='guest'){
    n.appendChild(el('p','sub','Du är med i ett spel. Tiden, årstiden, vädret och skatterna följer hostens spel. Dina pengar och fångster är dina egna.'));
  }
  if(MP.role){
    const ul=el('div','mplist');
    const EN=LANG==='en',row0=(nm,tag,cls)=>{const r=document.createElement('div');r.className='mprow'+(cls?' '+cls:'');const b0=document.createElement('span');b0.textContent=nm;r.appendChild(b0);if(tag){const s0=document.createElement('small');s0.textContent=tag;r.appendChild(s0)}return r};
    ul.appendChild(row0(mpName(),MP.role==='host'?(EN?'host · you':'host · du'):(EN?'you':'du'),'me'));
    for(const id in MP.others){const o=MP.others[id],where=o.m&&o.m!==M.id&&MAPS[o.m]?(LANG==='en'?tr(MAPS[o.m].name):MAPS[o.m].name):'';ul.appendChild(row0(o.n,[id==='h'?'host':'',where].filter(Boolean).join(' · ')))}
    if(!Object.keys(MP.others).length)ul.appendChild(el('div','mprow wait',MP.role==='host'?'Väntar på kompisar...':'Ansluter...'));
    n.appendChild(ul);
    const row=el('div','actions');
    row.appendChild(btn('Fortsätt spela','main',closeSheet));
    row.appendChild(btn(MP.role==='host'?'Avsluta spelet':'Lämna spelet','quiet',()=>{mpEnd(MP.role==='host'?'Spelet är avslutat.':'Du lämnade spelet.')}));
    n.appendChild(row);
  }else{
    n.appendChild(el('p','sub','Fiska tillsammans på samma sjö. En av er startar ett spel och får en kod, de andra går med med koden. Var och en behåller sina egna pengar och prylar.'));
    const nm=document.createElement('input');nm.className='acc-in';nm.maxLength=14;nm.placeholder='Ditt namn';nm.value=mpName();nm.setAttribute('aria-label','Ditt namn');
    n.appendChild(el('h3',null,'Ditt namn'));n.appendChild(nm);
    const keepName=()=>{const v=nm.value.replace(/[<>&"]/g,'').trim().slice(0,14);if(!v){MP.err='Skriv ett namn först.';mpSheet();return false}S.mpName=v;save();return true};
    const r1=el('div','actions');
    r1.appendChild(btn('Starta ett spel','gold',()=>{if(keepName())mpHost()}));
    n.appendChild(r1);
    n.appendChild(el('h3',null,'Gå med i en kompis spel'));
    const cd=document.createElement('input');cd.className='acc-in mpin';cd.maxLength=5;cd.placeholder='Kod';cd.setAttribute('aria-label','Kod');cd.autocapitalize='characters';cd.autocomplete='off';cd.spellcheck=false;cd.value=MP.lastCode||'';
    cd.addEventListener('input',()=>{cd.value=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)});
    n.appendChild(cd);
    const r2=el('div','actions');
    r2.appendChild(btn('Gå med','main',()=>{if(keepName()){MP.lastCode=cd.value;mpJoin(cd.value)}}));
    n.appendChild(r2);
    if(MP.busy)n.appendChild(el('p','sub','Ansluter...'));
    if(MP.err)n.appendChild(el('p','err',MP.err));
    n.appendChild(el('p','sub small','Ni behöver vara uppkopplade mot internet. På vissa skol- och jobbnät kan det vara spärrat.'));
  }
  openSheet(n);MP.sheet=true;
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  mpTick(dt);if(sheetOpen&&MP.role)tt+=dt;
  if(!sheetOpen){
    tt+=dt;
    if(mode==='sail'){holdSteer(dt);sailUpdate(dt,tt)}else if(mode==='fish'){fishUpdate(dt,tt);hotUpdate(dt)}
    if(mode==='sail'||mode==='fish'||mode==='cabin')seasonTick(dt);
    if(COMP)compTick(dt);
    if(mode!=='menu')wxUpdate(dt);
    whereT-=dt;if(whereT<=0){whereT=1.5;if(mode!=='menu')setWhere()}
  }
  ctx.setTransform(PB,0,0,PB,0,0);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  TXQ.length=0;
  if(mode==='sail')sailDraw(tt);else if(mode==='cabin')cabinDraw(tt);else if(mode==='cave')caveDraw(tt);else fishDraw(tt);
  if(mode==='fish')depthScale(ctx,tt);
  if(mode!=='cabin'&&mode!=='cave'&&!inCaveMap())wxScreen(ctx,tt);
  if(mode==='fish'&&F.land)landingDraw(tt);
  post(tt);
  updateGear();thrUI();clockUI();nudgeCheck();homeTick();
  requestAnimationFrame(frame);
}
$('mpBoard').addEventListener('click',()=>{const id=$('mpBoard').dataset.id;if(id&&MP.others[id]&&!sheetOpen)mpBoard(id)});
$('mpChip').addEventListener('click',()=>{if(!sheetOpen){SND.click();mpSheet()}});
placeAt(M.dock);
fit();updateHUD();showStartMenu();
setTimeout(()=>{try{buildTex(MAPS.stor)}catch(e){}},400);
requestAnimationFrame(frame);
})();
</script>
