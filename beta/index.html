const I18N_FR=[["Jag heter Nils. Min farfar Gustav fiskade här på Näkten i femtio år. Alla kallade honom Gädd-Gurra, för han drog upp gäddor som andra drog upp mört. På äldre dar sa han att han hittat något inne i berget, något han aldrig vågade ta med sig hem.","My name is Nils. My grandfather Gustav fished here on Näkten for fifty years. Everyone called him Gädd-Gurra, because he pulled up pike the way others pulled up roach. In his old age he said he'd found something inside the mountain, something he never dared bring home."],["Siffrorna är hur många du fångat. En slutsats dyker upp först när du provat flera platser, årstider, tider, väder, beten och spön och ser en tydlig skillnad. Rykten från Fiskhandlaren står i blått tills du själv har bekräftat dem.","The numbers show how many you've caught. A conclusion only appears once you've tried several spots, seasons, times of day, weather, baits and rods and there's a clear difference. Rumours from the fishmonger are shown in blue until you've confirmed them yourself."],["Här i viken vid morfars stuga är vattnet kallt och klart, perfekt för en egen fiskodling. Sätt ut en kasse, släpp i fisk du fångat och mata dem varje dygn. Välmatade fiskar växer och förökar sig, och de vuxna kan du sälja.","Here in the bay by Grandpa's cabin the water is cold and clear, perfect for a fish farm of your own. Put out a pen, release fish you've caught and feed them every day. Well-fed fish grow and breed, and you can sell the adults."],["Ett riktigt havsfartyg på insjön. Släpar en trål som fångar fisk av sig själv medan du kör ute på öppet vatten, trollar med fyra linor, lockar fisk från hela sjön och drar oftare upp riktiga bjässar. Lastrum 200.","A proper seagoing ship on an inland lake. It drags a trawl that catches fish on its own while you cruise open water, trolls with four lines, draws in fish from all over the lake and pulls up real giants more often. Holds 200 fish."],["Du har 3 minuter på dig att fiska var du vill på sjön. Du får poäng för hur många fiskar du fångar och hur stora de är. När tiden är slut kommer du tillbaka hit till bryggan och får dina prispengar.","You have 3 minutes to fish wherever you like on the lake. You score points for how many fish you catch and how big they are. When time is up you come back here to the jetty and get your prize money."],["gädda, öring, lax, kanadaröding, röding, storabborre, sik och det som kan lura i djupet. Låter dig också trolla från en motorbåt: kör sakta ute på sjön så släpar du betet efter båten","pike, brown trout, salmon, lake trout, Arctic char, big perch, whitefish and whatever lurks in the deep. Also lets you troll from a motorboat: drive slowly out on the lake and the lure trails behind the boat"],["Spelet sparar automatiskt i den här webbläsaren, och sparningen finns kvar när spelet uppdateras. Vill du byta telefon eller ha en extra säkerhetskopia kan du använda en sparkod.","The game saves automatically in this browser, and your progress is kept when the game is updated. If you want to switch phones or keep an extra backup, you can use a save code."],["Hemma i stan var det spårvagnar, trafik och asfalt. Hos morfar var det tyst, ljusa nätter och en sjö som aldrig tog slut. \"Min lilla stadsråtta\", brukade han kalla dig.","Back home in the city it was all trams, traffic and concrete. At Grandpa's it was quiet, the summer nights never got dark, and the lake seemed to go on forever. \"My little city mouse,\" he used to call you."],["Jag har en teori: rödingen i Näkten, uppe vid Gillhov, kan vara en egen stam som funnits där sedan istiden. Men jag behöver ett levande exemplar för att ta prov.","I have a theory: the Arctic char in Näkten, up by Gillhov, might be a separate strain that has been there since the ice age. But I need a live specimen to take samples."],["Jag tappade min mammas guldring i sjön förra veckan. Den gled av när jag sköljde händerna från båten, och en stor gädda högg efter glittret innan den sjönk.","I dropped my mum's gold ring in the lake last week. It slipped off when I rinsed my hands over the side of the boat, and a big pike snapped at the glitter before it sank."],["Laga mat av fisken i lastrummet. Varje rätt kostar ved. Maten ger en fördel i ett dygn, till exempel att fisken nappar oftare eller att linan håller bättre.","Cook the fish in your hold. Every dish costs firewood. A meal gives you a bonus for a day, such as fish biting more often or your line holding up better."],["Ett djupkort berättar inte var fisken finns, det får du lära dig själv. Men det visar hur djupt det är, och djupet spelar roll för vilka fiskar som trivs.","A depth chart doesn't tell you where the fish are, you have to learn that yourself. But it shows how deep it is, and depth matters for which fish thrive."],["\"Glad jul! Jag hittade en gammal bild på dig och Erik på bryggan, du med en abborre nästan lika stor som du själv. Den har fått en plats på mitt kylskåp.\"","\"Merry Christmas! I found an old photo of you and Erik on the jetty, you holding a perch almost as big as yourself. It has a spot on my fridge now.\""],["Pappa säger att den är borta för alltid. Men gäddor sväljer ju allt som glänser... Om du får en riktigt stor gädda här i Storsjön, kan du titta efter?","Dad says it's gone for good. But pike swallow anything shiny... If you catch a really big pike here in Storsjön, could you take a look?"],["Fiska tillsammans på samma sjö. En av er startar ett spel och får en kod, de andra går med med koden. Var och en behåller sina egna pengar och prylar.","Fish together on the same lake. One of you starts a game and gets a code, the others join with the code. Everyone keeps their own money and gear."],["Med ett konto sparas spelet i molnet. Då kan du byta telefon eller spela på datorn och fortsätta där du var. Ditt spel på den här enheten följer med.","With an account your game is saved in the cloud, so you can switch phones or play on a computer and continue where you left off. Your game on this device comes with you."],["Som tack: här är en burk elritsor jag fångat i bäcken. Småfisken lockar inte vad som helst, men de riktigt stora rovfiskarna kan inte låta bli.","As a thank you, here's a jar of minnows I caught in the stream. Small fish like these don't tempt just anything, but the really big predators can't resist them."],["Morfar lärde dig att sätta mask på kroken, rensa abborre på bryggan och lyssna efter odjuret i dimman. Han skrattade alltid när du blev rädd.","Grandpa taught you how to bait a hook, clean perch on the jetty and listen for the monster in the fog. He always laughed when you got scared."],["Gädd-Gurras lykta... Han sa alltid att man bara ser den när det är mörkt. Ro norrut när natten kommer, och håll utkik längs östra stranden.","Gädd-Gurra's lantern... He always said you can only see it in the dark. Row north when night falls, and keep watch along the east shore."],["Ståltafs närmast betet. Gädda och mörkerål kan inte bita av linan, men skygg fisk som öring, röding och harr ser den och nappar sämre.","A steel leader next to the lure. Pike and dark eels can't bite through the line, but shy fish like brown trout, Arctic char and grayling see it and bite less."],["Min farmor berättade om Rödingkungen: en uråldrig röding, stor som en kalv, som bara kommer upp när norrskenet dansar över Kallkällan.","My grandmother told me about the Char King: an ancient char, big as a calf, that only comes up when the northern lights dance over Kallkällan."],["Så nu har du lämnat stan, packat bilen och kört norrut. Stugan är sliten men varm, och nere vid bryggan ligger morfars gamla roddbåt.","So you've left the city behind, packed the car and driven north. The cabin is worn but cosy, and Grandpa's old rowing boat is tied up down by the jetty."],["\"God jul, kära du! Det värmer mitt hjärta att någon i familjen fiskar på Storsjön igen. Jag hoppas att gäddorna nappar för dig i år.\"","\"Merry Christmas, dear! It warms my heart that someone in the family is fishing on Storsjön again. I hope the pike are biting for you this year.\""],[" finns nu i din fiskelåda. Det biter inte ute i sjön, men här i grottan lockar det kristallröding och mörkerål. Plåtasken innehöll "," is now in your tackle box. It's no use out on the lake, but here in the cave it attracts crystal char and dark eels. The tin held "],[" arter simmar här. När du fångar en art som inte finns i akvariet kan du välja att släppa ner den här i stället för att sälja den."," species swim here. When you catch a species that isn't in the aquarium yet, you can choose to put it here instead of selling it."],["\"God jul! Erik sa alltid att odjuret visar sig om natten, eller när dimman ligger tät över Storsjöflaket. Var försiktig där ute.\"","\"Merry Christmas! Erik always said the monster shows itself at night, or when the fog lies thick over Storsjöflaket. Be careful out there.\""],["Norra Näkten, djupt vatten. Du behöver färgekolod. Röding, öring och stor gädda. Gamla fiskare pratar om en jättelik öring här.","Northern Näkten, deep water. You need a colour sonar. Arctic char, brown trout and big pike. Old anglers talk about a giant trout here."],["\"När solen gått ner och sjön ligger svart, tänds Gädd-Gurras lykta där berget lutar över vattnet. Norrut, på östra stranden.\"","\"When the sun has set and the lake lies black, Gädd-Gurra's lantern is lit where the mountain leans over the water. To the north, on the east shore.\""],["Olof har fiskat på Storsjön i sextio år och aldrig förlorat. Ingen vet hur han gör. Bara en mot en, och bara vinst ger pris.","Olof has fished Storsjön for sixty years and never lost. Nobody knows how he does it. Just one on one, and only a win pays."],["\"Sjön ger till den som har tålamod. Börja med masken, sälj fångsten i hamnen och glöm inte att elda i spisen. Kram, morfar.\"","\"The lake rewards patience. Start with worms, sell your catch at the harbour and don't forget to light the stove. Love, Grandpa.\""],["\"Glad jul! Här är en slant till nya drag. Erik gjorde alltid gravad lax till julbordet, jag har inte glömt hur god den var.\"","\"Merry Christmas! Here's a little something for new lures. Erik always made gravlax for the Christmas table, I haven't forgotten how good it was.\""],[". Spelet sparas automatiskt i molnet. Logga in med samma konto på en annan telefon eller dator så fortsätter du där du var.",". The game saves automatically in the cloud. Log in with the same account on another phone or computer and you'll continue where you left off."],["Varje sommar när skolan slutade packade mamma bilen och körde dig hela vägen från Göteborg upp till morfar Erik i Jämtland.","Every summer, as soon as school was over, Mum packed the car and drove you all the way from Gothenburg to Grandpa Erik's place in Jämtland."],["Behåll det. Han ville att det skulle användas, inte ligga i en kista. Tack för att du lät honom bli klar med sin historia.","Keep it. He wanted it to be used, not sit in a chest. Thank you for letting him finish his story."],["I våras kom ett brev från Östersund. Morfar har gått bort, och han har lämnat sin gamla timmerstuga vid Storsjön till dig.","This spring a letter arrived from Östersund. Grandpa had passed away, and he had left his old log cabin on Storsjön to you."],["Matade fiskar växer varje dygn, och vuxna par får yngel. Hungriga fiskar växer inte, och efter två dygn utan mat dör de.","Fed fish grow every day, and adult pairs produce fry. Hungry fish don't grow, and after two days without food they die."],["Du är med i ett spel. Tiden, årstiden, vädret och skatterna följer hostens spel. Dina pengar och fångster är dina egna.","You're in a friend's game. Time, season, weather and treasures follow the host's game. Your money and catches are your own."],["Sälj fångsten i Hamnen. Bättre spö orkar tyngre fisk och starkare lina går inte av. Båtar och skotrar finns på Varvet.","Sell your catch at the Harbour. A better rod handles heavier fish and a stronger line doesn't snap. Boats and snowmobiles are at the Boatyard."],["Ta det här som tack. Och jag ska be pappa om något mer: han har en burk med guldfärg kvar från när han målade skylten.","Take this as a thank you. And I'll ask dad for something more: he has a tin of gold paint left over from when he painted the sign."],["Gädd-Gurras handgjorda silverdrag. Ute i sjön är det värdelöst, men i grottan lockar det kristallröding och mörkerål.","Gädd-Gurra's handmade silver lure. Out on the lake it's worthless, but in the cave it attracts crystal char and dark eels."],["Det enda han lämnade efter sig var ett tecken: en runsten på västra stranden, ungefär mitt på sjön, mittemot Monäset.","All he left behind was a clue: a rune stone on the west shore, about halfway up the lake, across from Monäset."],["Akvariet är tomt. När du fångar en art som inte finns här kan du välja \"Till akvariet\" i stället för att behålla den.","The aquarium is empty. When you catch a species that isn't here yet, you can choose \"To the aquarium\" instead of keeping it."],["Loggboken samlar allt du lär dig om var, när och hur varje art nappar. Fiskhandlaren delar ett nytt rykte varje dag.","The logbook collects everything you learn about where, when and how each species bites. The fishmonger shares a new rumour every day."],["Mycket stark, tål ungefär 8 kg. Men den syns i vattnet, så skygg fisk som öring, röding och harr nappar mer sällan.","Very strong, holds about 8 kg. But it shows in the water, so shy fish like brown trout, Arctic char and grayling bite less often."],["Laga något gott av fångsten. Maten håller dig igång ett helt dygn, men du kan bara ha en maträtt i magen åt gången.","Cook something tasty from your catch. A meal keeps you going for a whole day, but you can only have one dish in your belly at a time."],["En mysig timmerstuga vid Storsjöns strand. Kamin, egen brygga och väggar som bara väntar på dina finaste fångster.","A cosy log cabin on the shore of Storsjön. A stove, its own jetty and walls just waiting for your finest catches."],["\"Till den som hittar hit: lyktan har väntat länge. Ta väl hand om draget, det har aldrig svikit mig. /Gädd-Gurra\"","\"To whoever finds their way here: the lantern has waited a long time. Take good care of the lure, it has never let me down. /Gädd-Gurra\""],["Här, ta den här vattenhinken. Fånga en röding vid Gillhov så håller den sig levande tills du kommer tillbaka hit.","Here, take this water bucket. Catch an Arctic char at Gillhov and it'll stay alive until you come back here."],["Är det... farfars silverdrag? Det är det! Han gjorde det själv av en gammal sked, det har jag hört tusen gånger.","Is that... grandfather's silver lure? It is! He made it himself out of an old spoon, I've heard that a thousand times."],["Midsommarstången står vid hamnen. Fiskhandlaren betalar dubbelt för sik, röding och öring till midsommarborden.","The maypole stands by the harbour. The fishmonger pays double for whitefish, Arctic char and brown trout for the midsummer tables."],["\"Glad jul från din faster! Jag funderade på att sticka en mössa, men pengar passar nog bättre i en fiskestuga.\"","\"Merry Christmas from your aunt! I thought about knitting you a hat, but money is probably more useful in a fishing cabin.\""],["När sjön fryser åker du skoter och pimplar. Välj djup, pimpla i jämn takt och se fisken simma fram under isen.","When the lake freezes you ride a snowmobile and jig through the ice. Pick a depth, jig at a steady pace and watch the fish swim up under the ice."],["Jag är för gammal för att ro dit själv. Men du har ju båt. Leta upp stenen med märket. Den visar vägen vidare.","I'm too old to row there myself. But you've got a boat. Find the stone with the mark. It will show you the way."],["Välj en fisk från lastrummet eller bland dina finaste fångster. Sedan trycker du på väggen där den ska hänga.","Pick a fish from the hold or from your finest catches. Then tap the wall where it should hang."],["Julgran i stugan och en julklapp under granen. Fiskhandlaren betalar dubbelt för lax och lake till julbordet.","A Christmas tree in the cabin and a present underneath it. The fishmonger pays double for salmon and burbot for the Christmas table."],["Vanlig lina som tål fisk upp till ungefär 3 kg. Tyngre fisk får linan att spännas fort, så släpp efter ofta.","Standard line that holds fish up to about 3 kg. Heavier fish make the line tighten quickly, so give slack often."],["\"God jul, min fiskare! Jag hör att stugan står varm igen. Erik hade varit stolt. Köp något fint till båten.\"","\"Merry Christmas, my angler! I hear the cabin is warm again. Erik would have been proud. Buy something nice for the boat.\""],["Du har ingen fisk i lastrummet som går att odla. Prova regnbåge, röding, öring, sik, kanadaröding eller lax.","You have no fish in the hold that can be farmed. Try rainbow trout, Arctic char, brown trout, whitefish, lake trout or salmon."],["I kistan ligger ett handgjort silverdrag inlindat i en oljad trasa, en plåtask med gamla mynt och en lapp.","Inside the chest is a handmade silver lure wrapped in an oiled rag, a tin of old coins and a note."],["Gillhov ligger längst norrut i Näkten. Rödingen står djupt, så du behöver nog färgekolod och ett skeddrag.","Gillhov is in the far north of Näkten. The char stay deep, so you'll probably need a colour sonar and a spoon lure."],["\"Hej min vän! Snön ligger hög här också. Jag lägger i lite pengar, så har du något att elda för. God jul!\"","\"Hello, dear! The snow is deep here too. I've put in a little money so you can keep the fire going. Merry Christmas!\""],["\"God jul! Din pappa och Erik satt alltid på bryggan och ljög om sina fångster. Jag tror du slår dem båda.\"","\"Merry Christmas! Your dad and Erik always sat on the jetty lying about their catches. I think you'll beat them both.\""],["Morfars stuga ligger vid Storsjöns sydvästra strand. Där kan du laga mat, och senare starta en fiskodling.","Grandpa's cabin is on the southwest shore of Storsjön. You can cook there, and later start a fish farm."],["Nästa fisk vid Gillhov blir Gillhovsöringen, vid Storsjöflaket Storsjöodjuret och i grottan Kristalldraken","The next fish at Gillhov will be the Gillhov Trout, at Storsjöflaket the Storsjö Monster and in the cave the Crystal Dragon"],["Här fylls det i vilka arter du själv har hittat i varje område. Med ekolod ser du också hur djupt det är.","This shows which species you've found yourself in each area. With a sonar you can also see how deep it is."],["En urtida jättefisk med lysande kristaller längs ryggen. Den visar sig bara i grottans mörkaste vatten.","A prehistoric giant fish with glowing crystals along its back. It only shows itself in the darkest water of the cave."],["Spara koden i till exempel Anteckningar. Klistra in den på en annan enhet för att fortsätta där du var.","Keep the code somewhere, for example in Notes. Paste it on another device to continue where you left off."],["Du har hittat grottan? Då är du närmare än jag någonsin kom. Gå in och se vad farfar lämnade efter sig.","You've found the cave? Then you're closer than I ever got. Go in and see what grandfather left behind."],["Buorre beaivi. Jag heter Ánte. Mina renar betar här kring sjön på vintern, och jag fiskar när de vilar.","Buorre beaivi. My name is Ánte. My reindeer graze around this lake in winter, and I fish while they rest."],["Du har inga fiskar att hänga upp just nu. Fånga något fint och behåll det, eller sätt ett nytt rekord.","You have no fish to hang up right now. Catch something nice and keep it, or set a new record."],["Visar hur djupt det är vid varje fiskeplats i Storsjön. När du fiskar ser du på vilket djup betet går.","Shows how deep it is at every fishing spot in Storsjön. While fishing you can see what depth the bait is at."],["Åh, hej! Hedda Strand, fiskforskare. Jag har stationen här vid älven där jag räknar laxen som vandrar.","Oh, hi! Hedda Strand, fish researcher. I have my station here by the river where I count the salmon swimming upstream."],["Vintern är här! Sjöarna har frusit och skotern står redo. Mitt i vintern är laken som mest i rörelse.","Winter is here! The lakes have frozen and the snowmobile is ready. Burbot are most active in the middle of winter."],["\"En riktigt god jul! Ät lutfisk om du måste, men jag vet att du hellre tar lax. Lycka till på sjön!\"","\"A very merry Christmas! Eat lutfisk if you must, but I know you'd rather have salmon. Good luck on the lake!\""],["Byter vädret direkt. Regn, dimma och blåst håller i sig ett par minuter och sedan blir det sol igen.","Changes the weather right away. Rain, fog and wind last a couple of minutes and then it turns sunny again."],["Nästan osynlig i vattnet, så skygg fisk som öring, röding och harr nappar oftare. Tål ungefär 5 kg.","Almost invisible in the water, so shy fish like brown trout, Arctic char and grayling bite more often. Holds about 5 kg."],["\"God jul och gott nytt år! Kom ihåg att klä dig varmt på isen. Ingen fisk är värd blöta ullsockor.\"","\"Merry Christmas and a happy new year! Remember to dress warmly on the ice. No fish is worth wet wool socks.\""],["Trollingbåten hade låsts upp av ett fel i spelet och har tagits bort. Du kan köpa den på Varvet.","The trolling boat had been unlocked by a bug in the game and has been removed. You can buy it at the Boatyard."],["Tyst och smidig. Den enda båten som klarar strömmen i Indalsälven. Kan inte trolla. Lastrum 12.","Quiet and nimble. The only boat that can handle the current in the Indalsälven. Can't troll. Holds 12 fish."],["Ántes farmors pimpel av renhorn. Lockar bara röding, och sägs väcka något mer under norrskenet.","Ánte's grandmother's jig, carved from reindeer antler. It only attracts Arctic char, and is said to stir up something more under the northern lights."],["Det där ser inte ut som en sparkod. Kontrollera att hela koden kom med, från GLF1: till slutet.","That doesn't look like a save code. Check that you copied the whole code, from GLF1: to the end."],["Hur nappar det idag? Farfar sa att silverdraget fungerar allra bäst när det är lugnt och grått.","Are they biting today? Grandfather said the silver lure works best when it's calm and overcast."],["Det här kommer jag att berätta för mina barnbarn. Ta det här, det är det minsta jag kan ge dig.","I'll be telling my grandchildren about this. Take this, it's the least I can give you."],["Jaga storlek. Brons, silver och guld ger pengar första gången. Rekordfisk är en riktig jätte.","Go for size. Bronze, silver and gold pay out the first time. A record fish is a real giant."],["Hösten har kommit. Siken samlas för att leka, och laxen och storöringen vandrar upp i älven.","Autumn has arrived. The whitefish gather to spawn, and the salmon and big trout swim up the river."],["Långsam men tyst. Fisken samlas fortare runt dig när du fiskar. Kan inte trolla. Lastrum 8.","Slow but quiet. Fish gather around you faster while you fish. Can't troll. Holds 8 fish."],["Vintern är här! Sjöarna har frusit och skotern står redo. Laken nappar bäst mitt i vintern.","Winter is here! The lakes have frozen and the snowmobile is ready. Burbot bite best in the middle of winter."],["Ta min pimpel. Farmor skar den av renhorn. Om någon kan locka upp Kungen så är det med den.","Take my jig. Grandmother carved it from reindeer antler. If anything can lure the King up, it's this."],["Topplistan finns i webbversionen av spelet, där man loggar in och tävlar mot sina kompisar.","The leaderboard is in the web version of the game, where you log in and compete against your friends."],["Fisk som går att odla: regnbåge, röding, öring, sik, kanadaröding och lax. En kasse rymmer ","Fish that can be farmed: rainbow trout, Arctic char, brown trout, whitefish, lake trout and salmon. A pen holds "],["Snabbast och byggd för trolling: det hugger mycket oftare när du släpar betet. Lastrum 24.","The fastest, and built for trolling: fish strike much more often when you drag the lure. Holds 24 fish."],["Runstenen står på västra stranden, ungefär mitt på sjön. Du ser märket när du kommer nära.","The rune stone is on the west shore, about halfway up the lake. You'll see the mark when you get close."],["Hej! Är du också ute och fiskar? Jag heter Lina, min pappa är Fiskhandlaren nere i Hamnen.","Hi! Are you out fishing too? My name is Lina, my dad is the fishmonger down at the Harbour."],["Ni behöver vara uppkopplade mot internet. På vissa skol- och jobbnät kan det vara spärrat.","You need to be online. Some school and work networks block it."],["Levande småfisk från Hedda. Bara lax och gädda bryr sig, men det är de stora som tar den.","Live baitfish from Hedda. Only salmon and pike are interested, but it's the big ones that go for it."],["Öppet vatten där man trollar efter storöring. Du behöver färgekolod för att hitta fisken.","Open water where you troll for big brown trout. You need a colour sonar to find the fish."],["Det måste vara en stor gädda, minst tre kilo. De små kan inte svälja en ring. Lycka till!","It has to be a big pike, at least three kilos. The small ones can't swallow a ring. Good luck!"],["Hej igen! Pappa säger att du är den bästa fiskaren i stan nu. Han ger dig nog bra betalt.","Hi again! Dad says you're the best angler in town now. He'll probably pay you well."],["Under granen ligger ett kuvert med ett julkort från faster Birgitta, och det är pengar i.","Under the tree there's an envelope with a Christmas card from Aunt Birgitta, and there's money inside."],["Fiskhandlaren betalar 15 % mer för fisken. Görs av tre fiskar av minst två olika arter.","The fishmonger pays 15 % more for your fish. Made from three fish of at least two different species."],["Tryck på en art du fångat för att se dina anteckningar om var, när och hur den nappar.","Tap a species you've caught to see your notes on where, when and how it bites."],["Bättre spö ger bredare fångstzon, oavsett typ. Hur tung fisk du klarar beror på linan.","A better rod gives a wider catch zone, whatever the type. How heavy a fish you can handle depends on the line."],["Rödingkungen! Dess buk lyser orange som en solnedgång. Ánte kommer inte tro sina ögon.","The Char King! Its belly glows orange like a sunset. Ánte won't believe his eyes."],["Kristalldraken! Kristallerna på ryggen lyser upp hela båten. Ingen kommer att tro dig.","The Crystal Dragon! The crystals on its back light up the whole boat. Nobody will believe you."],["Någon har ristat ett tecken i stenen och under det några rader, nötta av vind och is.","Someone has carved a sign into the stone, and below it a few lines, worn down by wind and ice."],["Om du avbryter får du inga poäng och inga prispengar. Avgiften får du inte tillbaka.","If you quit you get no points and no prize money. The entry fee is not refunded."],["Tryck i vattnet för att kasta. Ju längre ner du trycker, desto djupare hamnar betet.","Tap the water to cast. The lower you tap, the deeper the bait ends up."],["Sveriges bästa sportfiskare kommer till Storsjön. Du måste fiska snabbt och smart.","Sweden's best sport anglers come to Storsjön. You have to fish fast and smart."],["En uråldrig fjällröding som bara visar sig när norrskenet dansar över Kallkällan.","An ancient mountain char that only shows itself when the northern lights dance over Kallkällan."],["Välj spö, bete och lina efter fisken du är ute efter. Fel spö ger en smalare zon.","Choose rod, bait and line for the fish you're after. The wrong rod gives a narrower zone."],["Kunde inte nå inloggningen just nu. Spelet sparar fortfarande på den här enheten.","Couldn't reach the login right now. The game still saves on this device."],["Snabbast på isen, men orkar bara dra en liten pulka. Rymmer 4 fiskar utan pulka.","Fastest on the ice, but can only pull a small sled. Holds 4 fish without a sled."],["Kallkällan ligger i nordvästra viken. Vänta på en klar natt när norrskenet syns.","Kallkällan is in the northwest bay. Wait for a clear night when the northern lights are out."],["Brasan tänds vid hamnen och hela bygden är ute. Fisken nappar oftare hela dagen.","The bonfire is lit by the harbour and the whole village is out. Fish bite more often all day long."],["Långsam men stark. Drar den största pulkan av alla. Rymmer 6 fiskar utan pulka.","Slow but strong. Pulls the biggest sled of all. Holds 6 fish without a sled."],["Den enda som klarar fjälleden upp till Fjällsjön. Rymmer 10 fiskar utan pulka.","The only one that can handle the mountain trail up to Fjällsjön. Holds 10 fish without a sled."],["De flesta tror att det är en saga. Men jag har sett ljuset i isen de nätterna.","Most people think it's a fairy tale. But I've seen the light in the ice on those nights."],["Smal fångstzon. Orkar fisk upp till ungefär 2 kg, tyngre fisk drar ner zonen.","Narrow catch zone. Handles fish up to about 2 kg, heavier fish pull the zone down."],["Arbetsbåten. Störst lastrum av alla, bra för långa dagar på sjön. Lastrum 36.","The workhorse. The biggest hold of all, good for long days on the lake. Holds 36 fish."],["Spön, bete, ekolod och ved. Båtar och skotrar finns på Varvet längre söderut.","Rods, bait, sonars and firewood. Boats and snowmobiles are at the Boatyard further south."],["Håll inne för att lyfta den gröna zonen och håll fisken i den. När det står ","Hold to raise the green zone and keep the fish inside it. When it says "],["Linan avgör hur tung fisk du klarar innan den går av. Byt lina i Fiskelådan.","The line decides how heavy a fish you can handle before it snaps. Change line in the Tackle box."],["Olof: \"Hm. Det har inte hänt sedan 1974. Ta pengarna innan jag ångrar mig.\"","Olof: \"Hm. That hasn't happened since 1974. Take the money before I change my mind.\""],["Den gamla storöringen från Gillhov. Farfar hade rätt, den finns på riktigt.","The old giant trout from Gillhov. Grandpa was right, it really exists."],["Kunde inte spara i molnet just nu. Det sparas på enheten och försöker igen.","Couldn't save to the cloud right now. It's saved on the device and will try again."],["Skuggorna färgas efter sällsynthet, så du ser vad som är värt att vänta på","The shadows are coloured by rarity, so you can see what's worth waiting for"],["Du lägger rödingen i Heddas vattenhink. Ta den till henne vid Indalsälven.","You put the char in Hedda's water bucket. Take it to her by the Indalsälven."],["Lite bredare fångstzon. Görs av tre småfiskar: mört, nors eller bergsimpa.","A slightly wider catch zone. Made from three small fish: roach, smelt or sculpin."],["Fisken kommer från lastrummet. En kasse kan bara ha en art. Det får plats ","The fish come from your hold. Each pen can only hold one species. There is room for "],["Det gick inte att starta ett spel just nu. Kolla internet och försök igen.","Couldn't start a game right now. Check your internet and try again."],["Djupkorten finns inte längre, ekolodet visar djupet nu. Du fick tillbaka ","The depth charts are gone, the sonar shows the depth now. You got back "],["Tre vedträn. Räcker till en vanlig rätt eller en av de starkare rätterna.","Three logs. Enough for one regular dish or one of the stronger dishes."],["Dimman lägger sig över sjön. Något stort rör sig ute på Storsjöflaket...","Fog settles over the lake. Something big is moving out on Storsjöflaket..."],["Det gick inte att ladda flerspelarläget. Kolla internet och försök igen.","Couldn't load multiplayer. Check your internet and try again."],["Våren är här! Isen har gått upp och gäddorna leker i de grunda vikarna.","Spring is here! The ice has broken up and the pike are spawning in the shallow bays."],["Olika spön passar olika fisk. Du väljer spö i Fiskelådan när du fiskar.","Different rods suit different fish. You pick a rod in the Tackle box when you fish."],["Ta dem till Laxhålan om du vill ha en storlax. Gäddan går också på dem.","Take them to Laxhålan if you want a big salmon. Pike go for them too."],["Gädd-Gurras lykta syns bara på natten. Ro norrut längs östra stranden.","Gädd-Gurra's lantern can only be seen at night. Row north along the east shore."],["Du har den! Titta på färgerna... jag hade rätt, den här är annorlunda.","You've got it! Look at the colours... I was right, this one is different."],["Snabbare och kan trolla, men motorn skrämmer en del fisk. Lastrum 16.","Faster and can troll, but the engine scares off some fish. Holds 16 fish."],["Lämna in fisk från lastrummet och få mer betalt än på torget. Du har ","Deliver fish from your hold and get paid more than at the market. You have "],["Något glimmar i gäddans mage... det är en guldring! Ta den till Lina.","Something glimmers in the pike's belly... it's a gold ring! Take it to Lina."],["Det finns redan ett konto med den e-postadressen. Logga in i stället.","There's already an account with that email address. Log in instead."],["En uråldrig storöring som sägs ha simmat i Näkten sedan farfars tid.","An ancient giant trout said to have lived in Näkten since the old days."],["Tryck på väggen för att sätta upp dina finaste fångster som troféer.","Tap the wall to put up your finest catches as trophies."],["Foderautomaten matar fiskarna av sig själv så länge det finns foder.","The automatic feeder feeds the fish for you as long as there is feed."],["Ungefär en fisk på 250 är gyllene. Den här får du berätta om länge.","About one fish in 250 is golden. You'll be telling people about this one for a long time."],["Varm i kroppen: fisken nappar mycket oftare på natten och på isen.","Warmed up: fish bite much more often at night and on the ice."],["Tolv vedträn, billigare per styck. Räcker till ungefär fem rätter.","Twelve logs, cheaper per log. Enough for about five dishes."],["Du har ingen småfisk i lastrummet. Mört, nors och bergsimpa duger.","You have no small fish in the hold. Roach, smelt and sculpin will do."],["Det gick inte att ansluta just nu. Kolla internet och försök igen.","Couldn't connect right now. Check your internet and try again."],["Största fångstzonen och snabbast indragning. Orkar ungefär 16 kg.","The biggest catch zone and fastest reeling. Handles about 16 kg."],["abborre, mört, lake, sik, nors, bergsimpa och gädda upp till 5 kg","perch, roach, burbot, whitefish, smelt, sculpin and pike up to 5 kg"],["Tryck på sjön så åker båten dit. Stanna där du vill och tryck på ","Tap the lake and the boat goes there. Stop where you like and tap "],["Den smala mätaren till vänster om zonen visar hur spänd linan är.","The thin meter to the left of the zone shows how tight the line is."],["Ett nytt dygn i fiskodlingen. Titta till fiskarna när du har tid.","A new day at the fish farm. Check on the fish when you have time."],["Uråldrig och lång. Sägs ha vaktat Gädd-Gurras kista i hundra år.","Ancient and long. Said to have guarded Gädd-Gurra's chest for a hundred years."],["Mycket bred fångstzon och snabb indragning. Orkar ungefär 11 kg.","Very wide catch zone and fast reeling. Handles about 11 kg."],["Väggarna är fulla. Ta ner en fisk först genom att trycka på den.","The walls are full. Take a fish down first by tapping it."],["Köpte ståltafs. Den sitter på nu, du kan ta av den i Fiskelådan.","Bought a steel leader. It's on now, you can take it off in the Tackle box."],[" vedträn för att tända spisen. Köp ved i Sport & Fiske i hamnen."," logs to light the stove. Buy firewood at Sport & Fiske in the harbour."],["Bredare fångstzon och drar in lite fortare. Orkar ungefär 4 kg.","Wider catch zone and reels in a bit faster. Handles about 4 kg."],["Ekolod visar fiskarna under båten. Djupa platser kräver ekolod.","A sonar shows the fish under the boat. Deep spots require a sonar."],["Måla om skrovet. Köpta färger kan du byta tillbaka till gratis.","Repaint the hull. You can switch back to colours you've already bought for free."],["På köksbordet ligger hans träspö och en lapp med sned handstil:","On the kitchen table you find his wooden rod and a note in his slanted handwriting:"],["Allround. Lockar abborre, mört, lake, sik, nors och bergsimpa.","All-round. Attracts perch, roac const TRC=new Map(),TR_OUT=new Set(),TR_MISS=new Set(),TR_L=/[A-Za-zÅÄÖåäöéÉÁá]/;

function trFrag(s){
  /* text som redan är engelsk (till exempel ett översatt julkort med en hälsning efter) rörs inte */
  if(!/[åäöÅÄÖ]/.test(s)&&/\b(the|you|your|and|of|with|it's|you're|I'm|I've)\b/.test(s))return s;
  const isL=c=>!!c&&TR_L.test(c);

        i=t.indexOf(sv,i+1);

  if(/[åäöÅÄÖ]|\b(och|att|det|är|för|med|som|inte|har|kan)\b/.test(parts.filter(p=>!p[1]).map(p=>p[0]).join(' ')))TR_MISS.add(s);

function migrateSave(){
  const ok=id=>!!FBY[id],fix=id=>id==='soring'?'oring':id;
  const log={};
  for(const id in S.log){const nid=fix(id);if(!ok(nid))continue;const e=S.log[id];
    if(log[nid]){log[nid].n+=e.n;if(e.best>log[nid].best){log[nid].best=e.best;log[nid].spot=e.spot}}else log[nid]=e}
  S.log=log;
  S.hold=S.hold.map(h=>Object.assign({},h,{id:fix(h.id)})).filter(h=>ok(h.id));
  S.top=S.top.map(h=>Object.assign({},h,{id:fix(h.id)})).filter(h=>ok(h.id));
  const seen={};for(const sid in S.seen){const arr=[];S.seen[sid].forEach(id=>{const n=fix(id);if(ok(n)&&arr.indexOf(n)<0)arr.push(n)});seen[sid]=arr}

  if(S.bait>=1)S.baits.fluga=1;if(S.bait>=2)S.baits.wobbler=1;if(S.bait>=3)S.baits.skedd=1;
  delete S.bait;
  const d=defaultS();['rods','baits','stats','medals','ach'].forEach(k=>{S[k]=Object.assign({},d[k],S[k])});
  if(!Array.isArray(S.orders))S.orders=[];
  S.orders=S.orders.filter(o=>FBY[o.fid]&&o.lvl!=null);
  /* båtnumret får vara upp till trålaren (5); förr klipptes det till 3 och gav då bort trollingbåten */
  if(!(S.boat>=0&&S.boat<=5))S.boat=0;if(S.rod>4)S.rod=4;
  /* Version 3: de köpta fiskekartorna är borttagna, pengarna betalas tillbaka en gång */
  if(S.maps&&(S.maps.stor||S.maps.nak)){const r=(S.maps.stor?1200:0)+(S.maps.nak?900:0);S.money+=r;S.mapRefundMsg=(S.mapRefundMsg||0)+r}
  S.maps={};
  /* Version 4: djupkorten är borttagna, ekolodet visar djupet. Pengarna betalas tillbaka en gång */
  if(S.depth&&(S.depth.stor||S.depth.nak)){const r=(S.depth.stor?500:0)+(S.depth.nak?400:0);S.money+=r;S.depthRefundMsg=(S.depthRefundMsg||0)+r}
  S.depth={};if(!S.know)S.know={};if(!S.expo)S.expo={};

}

/* Flagga på en stång. x,y = stångens fot, h = höjd, dir = åt vilket håll flaggan vajar */
function drawFlag(g,x,y,h,id,t,dir){
  if(!id||id==='none')return;
  const fw=h*.62,fh=h*.4,top=y-h,lw=Math.max(.35,h*.06);
  g.strokeStyle='#d8dcde';g.lineWidth=lw;g.beginPath();g.moveTo(x,y);g.lineTo(x,top-h*.05);g.stroke();
  const N=6,wv=k=>Math.sin(t*5-k*2.2)*fh*.12*k;
  const pt=(u,v)=>[x+dir*u*fw,top+v*fh+wv(u)];
  const quad=(u0,v0,u1,v1,col)=>{g.fillStyle=col;g.beginPath();const a=pt(u0,v0),b=pt(u1,v0),c=pt(u1,v1),d=pt(u0,v1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath();g.fill()};
  if(id==='vimpel'||id==='rodvimpel'){
    const c1=id==='vimpel'?'#2a6ab4':'#c8302a',c2=id==='vimpel'?'#f2c22e':'#f4f2ec';
    g.fillStyle=c1;g.beginPath();let a=pt(0,0);g.moveTo(a[0],a[1]);for(let k=1;k<=N;k++){const u=k/N*1.3;a=pt(u,u/1.3*.5);g.lineTo(a[0],a[1])}for(let k=N;k>=0;k--){const u=k/N*1.3;a=pt(u,1-u/1.3*.5);g.lineTo(a[0],a[1])}g.closePath();g.fill();
    g.fillStyle=c2;g.beginPath();a=pt(0,.38);g.moveTo(a[0],a[1]);a=pt(1.1,.5);g.lineTo(a[0],a[1]);a=pt(0,.62);g.lineTo(a[0],a[1]);g.closePath();g.fill();return;
  }
  for(let k=0;k<N;k++){const u0=k/N,u1=(k+1)/N;
    if(id==='jamt'){quad(u0,0,u1,.34,'#2f63b0');quad(u0,.33,u1,.67,'#f4f2ec');quad(u0,.66,u1,1,'#3a8a3e')}
    else if(id==='se'){quad(u0,0,u1,1,'#2a6ab4');quad(u0,.4,u1,.6,'#f2c22e');if(u0<.42&&u1>.3)quad(Math.max(u0,.3),0,Math.min(u1,.45),1,'#f2c22e')}
    else{for(let r=0;r<3;r++)quad(u0,r/3,u1,(r+1)/3,(k+r)%2?'#f4f2ec':'#1e2226')}}
}
function migrateV6(){
  if(!Array.isArray(S.boats))S.boats=[0,1,2,3].map(i=>i<=(S.boat|0)?1:0);
  while(S.boats.length<6)S.boats.push(0);
  S.boats[0]=1;S.boats[S.boat|0]=1;
  /* engångsfix: trollingbåten delades ut av misstag vid laddning, alla får köpa den på nytt */
  if(!S.hubMig){S.hubMig=1;if(S.played&&((S.catches|0)>0||(S.money|0)>0))S.hubSeen=1}
  if(!S.fixTroll){S.fixTroll=1;if(S.boats[3]){S.boats[3]=0;if(S.boat===3)S.boat=S.boats[2]?2:S.boats[1]?1:0;S.trollMsg=1}}
  if(!Array.isArray(S.sleds)){S.sleds=[1,S.boat>=1?1:0,S.boat>=3?1:0];S.sled=S.boat>=3?2:S.boat>=1?1:0}
  try{sledClamp()}catch(e){}
  S.sleds[0]=1;if(S.sled==null||!S.sleds[S.sled])S.sled=0;
  if(S.inCave){S.winter=!!S.caveWin;S.inCave=0}
  S.comp=S.comp||{best:{},wins:0,hardWin:0};if(!S.comp.won){S.comp.won={};if(S.comp.wins)S.comp.won[0]=1;if(S.comp.hardWin){S.comp.won[0]=S.comp.won[1]=S.comp.won[2]=1}}
  if(S.season==null)S.season=S.winter?3:2;S.winter=S.season===3;
  if(!Array.isArray(S.bc))S.bc=[];if(!Array.isArray(S.sc))S.sc=[];
  if(!S.pulkaMig){S.pulkaMig=1;S.sleds.forEach((o,i)=>{if(o&&!(S.sc[i]&&S.sc[i].up&&S.sc[i].up.pulka!=null)){S.sc[i]=S.sc[i]||{paint:'orig',stripe:'orig',flag:'none',name:''};S.sc[i].up=S.sc[i].up||{};S.sc[i].own=S.sc[i].own||{};S.sc[i].up.pulka=1;S.sc[i].own.pulka=1}})}
}

function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=AU.ctx=new C();
    const master=c.createGain();master.gain.value=0.9;master.connect(c.destination);
    AU.mus=c.createGain();AU.sfx=c.createGain();AU.amb=c.createGain();
    [AU.mus,AU.sfx,AU.amb].forEach(g=>g.connect(master));
    const len=Math.floor(c.sampleRate*1.8),buf=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
    const conv=c.createConvolver();conv.buffer=buf;const wet=c.createGain();wet.gain.value=0.25;conv.connect(wet);wet.connect(master);
    AU.mus.connect(conv);AU.rev=conv;
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    AU.noise=nb;
    const s=c.createBufferSource();s.buffer=nb;s.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=0.5;
    const g=c.createGain();g.gain.value=0.05;
    const l=c.createOscillator(),lg=c.createGain();l.frequency.value=0.17;lg.gain.value=0.03;l.connect(lg);lg.connect(g.gain);
    s.connect(f);f.connect(g);g.connect(AU.amb);s.start();l.start();
    const e=c.createOscillator(),ef=c.createBiquadFilter(),eg=c.createGain();
    e.type='sawtooth';e.frequency.value=46;ef.type='lowpass';ef.frequency.value=180;eg.gain.value=0;
    e.connect(ef);ef.connect(eg);eg.connect(AU.amb);e.start();AU.eng=eg;AU.engOsc=e;
    AU.nextT=c.currentTime+0.2;
    setInterval(auTick,50);

  }catch(err){AU.ctx=null}
}
function auApply(){

function setMood(m){

function auTick(){

  if(AU.mood==='reel'){while(AU.nextT<c.currentTime+0.35){playReelBar(AU.rbar,AU.nextT);AU.nextT+=8*RB;AU.rbar++}}
  else{while(AU.nextT<c.currentTime+0.35){
    /* Näkten har sitt eget spår, annars följer musiken årstiden. Sommaren är Storsjöns gamla vals. */
    const want=(typeof M!=='undefined'&&M&&M.id==='nak')?'nak':(['spring','stor','autumn','winter'][S.season|0]||'stor');
    if(want!==AU.track){const old=AU.track;AU.track=want;AU.trans=(want==='nak'||(want==='stor'&&old==='nak'))?2:1;AU.nbar=0;AU.bar=0}

function fiddle(m,t,d,vol){

  l.frequency.value=5.2;lg.gain.value=9;l.connect(lg);lg.connect(o.detune);

  o.connect(f);f.connect(g);g.connect(AU.mus);o.start(t);l.start(t);o.stop(e+0.4);l.stop(e+0.4);

function pluck(fr,t,d,vol){

function playBar(i,t0){

function boxBlur(src,w,h,r,passes){

      for(let x=0;x<w;x++){b[o+x]=s/(2*r+1);s+=a[o+Math.min(w-1,x+r+1)]-a[o+Math.max(0,x-r)]}}
    for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=b[clamp(y,0,h-1)*w+x];
      for(let y=0;y<h;y++){a[y*w+x]=s/(2*r+1);s+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]}}
  }

function trawlDraw(g,t,sq){
  if(S.winter||S.boat!==5||mode!=='sail'||ZN.sd<12)return;
  const ca=Math.cos(B.ang),sa=Math.sin(B.ang),mv=TRL.moving,len=mv?58:30;
  const nx=B.x-ca*(18+len),ny=B.y-sa*(18+len),pn=proj(nx,ny);if(!pn)return;
  [-1,1].forEach(side=>{const sx=B.x-ca*16+(-sa)*side*5,sy=B.y-sa*16+ca*side*5,p0=proj(sx,sy),p1=proj(nx+(-sa)*side*6,ny+ca*side*6);if(!p0||!p1)return;

  for(let i=-2;i<=2;i++){const fx=nx+(-sa)*i*3,fy=ny+ca*i*3,pf=proj(fx,fy);if(!pf)continue;g.fillStyle=i%2?'#e8b84a':'#e2702a';g.beginPath();g.arc(pf.x,pf.y+Math.sin(t*3+i)*.4*pf.s,.9*pf.s,0,7);g.fill()}

}
function trollDraw(g,t,sq){

    const sx=B.x-ca*8+(-sa)*side*3,sy=B.y-sa*8+ca*side*3,len=TRL.moving?34:18,spread=TRL.moving?7:4;

}

function sailUpdate(dt,t){
  const sp=vehSpd()*THR[S.thr==null?2:S.thr].k;
  let moved=false,vx=0,vy=0;
  if(B.tx!=null){
    const wp=B.path.length?B.path[0]:{x:B.tx,y:B.ty};
    const dx=wp.x-B.x,dy=wp.y-B.y,d=Math.hypot(dx,dy);
    if(d<2){if(B.path.length>1)B.path.shift();else{B.path=[];B.tx=null}}
    else{
      const st=Math.min(d,sp*dt);vx=dx/d*st;vy=dy/d*st;
      if(M.free(B.x+vx,B.y+vy)){B.x+=vx;B.y+=vy;moved=true}
      else if(M.free(B.x+vx,B.y)){B.x+=vx;vy=0;moved=true}
      else if(M.free(B.x,B.y+vy)){B.y+=vy;vx=0;moved=true}
      if(!moved){B.tx=null;B.path=[]}
      if(Math.abs(vx)>Math.abs(vy)*0.35&&Math.abs(vx)>0.01)B.dir=vx>0?1:-1;
      if(moved&&(Math.abs(vx)+Math.abs(vy))>0.001){
        const ta=Math.atan2(vy,vx);let da=ta-B.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
        B.ang+=da*Math.min(1,dt*7);
      }
      if(moved&&S.winter){B.trkT=(B.trkT||0)-dt;if(B.trkT<=0){B.trkT=.05;const ca=Math.cos(B.ang),sa=Math.sin(B.ang);
        [-2.2,2.2].forEach(o=>B.wake.push({x:B.x-ca*9-sa*o,y:B.y-sa*9+ca*o,vx:0,vy:0,l:1,trk:1}));
        if(Math.random()<.5)B.wake.push({x:B.x-ca*12,y:B.y-sa*12,vx:-ca*8+rnd(-4,4),vy:-sa*8+rnd(-4,4),l:.7,puff:1})}}
      else if(moved&&Math.random()<dt*30){const ca=Math.cos(B.ang),sa=Math.sin(B.ang),side=Math.random()<.5?-1:1;
        B.wake.push({x:B.x-ca*11+(-sa)*side*2.5,y:B.y-sa*11+ca*side*2.5,vx:-sa*side*6-ca*3,vy:ca*side*6-sa*3,l:1})}
    }
  }
  auMove(moved?Math.min(1.2,sp/80):0,S.winter?1:S.boat);
  if(moved&&(S.boat===0||S.boat===4)&&!S.winter){rowT-=dt;if(rowT<=0){rowT=0.9;SND.row()}}
  for(let i=B.wake.length-1;i>=0;i--){const w=B.wake[i];w.l-=dt*(w.trk?.12:.9);w.x+=w.vx*dt;w.y+=w.vy*dt;if(w.l<=0)B.wake.splice(i,1)}
  if(!inCaveMap()){treasureUpdate(dt,t);zooUpdate(dt,t)}
  zoneTick(dt);if(!inCaveMap())hotUpdate(dt);trollUpdate(dt,moved);trawlUpdate(dt,moved);
  if(M.def.river&&!moved){const ny2=B.y-6*dt,cx=(alvCx(B.y/T)*MS*T),nx2=B.x+(cx-B.x)*.25*dt;if(M.free(nx2,ny2)&&Math.hypot(M.dock.x-B.x,M.dock.y-B.y)>36){B.x=nx2;B.y=ny2}}
  const nd=Math.hypot(M.dock.x-B.x,M.dock.y-B.y)<28;
  const nr=!!M.ramp&&Math.hypot(M.ramp.x-B.x,M.ramp.y-B.y)<28;
  const nc=!!M.comp&&Math.hypot(M.comp.x-B.x,M.comp.y-B.y)<30;
  const nb=!!M.cabin&&Math.hypot(M.cabin.x-B.x,M.cabin.y-B.y)<28;
  const ny=!!M.yard&&Math.hypot(M.yard.x-B.x,M.yard.y-B.y)<28;
  const npo=(M.portals||[]).find(p=>Math.hypot(p.x-B.x,p.y-B.y)<28)||null;if(npo!==nearPortal){nearPortal=npo;updateAction();setWhere()}
  const ns=(B.tx==null&&!nd&&!nr&&!nc&&!nb&&!ny&&!npo)?ZN.cur:null;
  const nl=ns?spotLocked(ns):false;if(ns!==nearSpot||nl!==ZN.lock||nd!==nearDock||nr!==nearRamp||nc!==nearComp||nb!==nearCabin||ny!==nearYard){ZN.lock=nl;nearSpot=ns;nearDock=nd;nearRamp=nr;nearComp=nc;nearCabin=nb;nearYard=ny;updateAction();setWhere()}
  qTick();

const HZ=-80,BYS=200,D0=170,DMAX=2600,DBILL=700;
const V={camX:0,camY:0,fx:0,fy:0,f:1,h:1,s0:1,init:false,lt:0};
function camUpdate(t){
  const s0=1.32*cam.z,D=D0*1.3/cam.z;V.D=D;V.s0=s0;V.f=s0*D;V.h=(BYS-HZ)/s0;
  const dt=Math.min(.1,Math.max(0,t-V.lt));V.lt=t;
  const mv=B.tx!=null,ca=Math.cos(B.ang),sa=Math.sin(B.ang);
  const tx=B.x+(mv?ca*26:0),ty=B.y+(mv?(sa>0?sa*62:sa*18):0);
  if(!V.init){V.fx=B.x;V.fy=B.y;V.init=true}
  const k=1-Math.exp(-dt*2.2);V.fx+=(tx-V.fx)*k;V.fy+=(ty-V.fy)*k;
  const dB=D*(BYS-HZ)/(H-HZ);
  V.fy=Math.min(V.fy,M.WH+PAD-(D-dB)-2);V.fx=clamp(V.fx,-PAD+70,M.WW+PAD-70);
  V.camX=V.fx;V.camY=V.fy+D;
  /* Liten planet: marken kröker sig neråt bort från kameran och ut mot sidorna */
  V.R=CURVE.R/cam.z;V.KX=CURVE.KX;V.dF=D;V.dH=Math.sqrt(2*V.R*V.h+D*D);V.yH=curY(V.dH);
}
const CURVE={R:2600,KX:.0007};
function curY(d){const q=d-V.dF;return HZ+V.f*(V.h+q*q/(2*V.R))/d}
function dAtY(y){const Y=Math.max(y,V.yH+.01)-HZ,a=V.f/(2*V.R),b=-(V.f*V.dF/V.R+Y),c=V.f*(V.h+V.dF*V.dF/(2*V.R)),disc=Math.max(0,b*b-4*a*c);return (-b-Math.sqrt(disc))/(2*a)}
const warpX=x=>V.KX*(x-W/2)*(x-W/2);
let GCV=null;
function groundCanvas(){if(!GCV||GCV.width!==buf.width||GCV.height!==buf.height){GCV=document.createElement('canvas');GCV.width=buf.width;GCV.height=buf.height}return GCV}
function proj(wx,wy){const d=V.camY-wy;if(d<6||d>V.dH)return null;const s=V.f/d,x=W/2+(wx-V.camX)*s;return {x:x,y:curY(d)+warpX(x),s:s,d:d}}

const SKYK=[[0,['#f4b48c','#f8dcc0']],[.1,['#6fb2df','#cfe8f2']],[.42,['#6fb2df','#cfe8f2']],[.5,['#7a6ea6','#f5a77a']],[.6,['#0f1d3e','#2a3e66']],[.86,['#0f1d3e','#2a3e66']],[1,['#f4b48c','#f8dcc0']]];
function hexMix(a,b,k){const A=parseInt(a.slice(1),16),Bn=parseInt(b.slice(1),16);

const ZOO={map:null,win:null,a:[],jumps:[],jt:2};
function zooWater(x,y,r){return x>8&&y>8&&x<M.WW-8&&y<M.WH-8&&!M.isLand(x,y)&&!M.isLand(x-r,y)&&!M.isLand(x+r,y)&&!M.isLand(x,y-r)&&!M.isLand(x,y+r)}
function zooNearShore(x,y,maxd){for(const d of [[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]])for(let n=6;n<=maxd;n+=4)if(M.isLand(x+d[0]*n,y+d[1]*n))return true;return false}
function zooLandOk(x,y){
  if(x<6||y<6||x>M.WW-6||y>M.WH-6)return false;
  if(!M.isLand(x,y)||!M.isLand(x-3,y)||!M.isLand(x+3,y)||!M.isLand(x,y-2)||!M.isLand(x,y+2))return false;
  for(const o of [M.dock,M.ramp,M.comp,M.cabin,M.yard].concat(M.portals||[]))if(o&&Math.hypot(o.x-x,o.y-y)<60)return false;
  for(let r=Math.floor((y-14+PAD)/2);r<=Math.floor((y+14+PAD)/2);r++){const row=M.rows[r];if(!row)continue;
    for(const o of row)if((o.k==='house'||o.k==='church'||o.k==='shed'||o.k==='cabin'||o.k==='yard')&&Math.abs(o.x-x)<16&&Math.abs(o.y-y)<14)return false}

}

function zooWander(o,dt,water){

    g.fillStyle='rgba(18,52,72,.95)';rr(g,BAR_X-10,BAR_T,5,BAR_H,2.5);g.fill();
    const th=BAR_H*clamp(r.tn,0,1);
    if(st==='snap'){const on=Math.sin(clock*22)>0;g.save();g.shadowColor='rgba(255,70,40,.95)';g.shadowBlur=8*K;g.fillStyle=on?'#ff3a24':'#ffd0c0';rr(g,BAR_X-11.5,BAR_T-1.5,8,BAR_H+3,4);g.fill();g.restore();}

  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.drawImage(src,0,0);
  const w=c.width,h=c.height,im=g.getImageData(0,0,w,h),d=im.data;
  const A=(x,y)=>x<0||y<0||x>=w||y>=h?0:d[(y*w+x)*4+3];
  const snow=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;if(!d[i+3])continue;
    if(!A(x,y-1)||(!A(x,y-2)&&ihash(x,y)<.7))snow[y*w+x]=1;
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;if(!d[i+3])continue;
    if(snow[y*w+x]){const k=snow[(y-1)*w+x]?1:0;d[i]=k?232:246;d[i+1]=k?238:249;d[i+2]=k?246:253}
    else{const l=(d[i]+d[i+1]+d[i+2])/3;d[i]=lerp(d[i],l,.35)*.9+10;d[i+1]=lerp(d[i+1],l,.35)*.92+14;d[i+2]=lerp(d[i+2],l,.35)*.95+30}
  }
  g.putImageData(im,0,0);return c;
}

/* --- Kikpimpling: välj djup och pimpla i takt --- */
const ICE_DEPTH={kung:.88,lax:.5,legend:.55,harr:.22,abborre:.42,gadda:.35,oring:.5,mort:.3,lake:.86,sik:.66,kanada:.76,nors:.46,regnbage:.38,roding:.8,bergsimpa:.92,odjur:.9};

const spotDepthM=()=>F.spot&&F.spot.depthM>0?Math.max(2,Math.round(F.spot.depthM)):(F.spot.under==='deep'?20:F.spot.under==='rocks'?14:F.spot.under==='weeds'||F.spot.under==='mud'?7:10);
function ensureIce(){if(F.jd==null){F.jd=S.iceDepth!=null?S.iceDepth:.5;F.jigT=9;F.jigA=0;F.msg=null;F.boost=0;F.drag=false}}

function jig(){
  const dtj=F.jigT;F.jigT=0;F.jigA=1;tone(520+Math.random()*80,.06,'triangle',.06);
  let q;
  if(dtj<.35){q=-1;F.msg={s:'För snabbt, fisken skräms',c:'#ffb070',t:.9}}
  else if(dtj<=1.7){q=1;F.boost=1.2;F.msg={s:'Bra rytm!',c:'#9df5b0',t:.7}}
  else{q=.4;F.msg={s:'Pimpla i jämn takt',c:'#e8f4f8',t:.8}}
  for(const s of F.school){
    const dd=Math.abs(s.d-F.jd),dist=Math.hypot(s.x-BX,s.y-HOOK_Y);
    if(dd<.16&&dist<70){
      /* för snabbt: fisken skräms och simmar iväg. Bra takt: den som tittar blir mer intresserad */
      if(q<0){s.int=Math.max(0,s.int-.4);if(dist<34){s.hd=Math.atan2(s.y-HOOK_Y,s.x-BX);s.cur=Math.max(s.cur||0,20);s.flee=1.2}}
      else if(s.look)s.int+=.28*q*shyMul(s.p.f.id)*buffBite();
    }
  }
}
/* Under isen: samma lynnen som i sjön, fast sett uppifrån. Fiskarna simmar runt i alla riktningar på sitt djup.
   En nyfiken fisk på pimpelns djup smyger fram mot hålet i små ryck och cirklar runt det.
   Pimplar man i jämn takt blir den mer intresserad, pimplar man för fort skräms den. Till sist rusar den in och hugger. */
function swimIce(s,dt,near){
  const T=temperOf(s.p.f);
  if(s.hd==null){s.hd=s.vx<0?Math.PI:0;s.spd=Math.max(7,Math.abs(s.vx));s.age=0;s.mt=rnd(1.5,4);s.mode='cruise';s.ct=0;s.go=0;s.gt=0;
    s.bold=clamp(T.bold+rnd(-.2,.2),.05,1);s.cmax=rnd(4,8)*(.6+s.bold)*Math.sqrt(buffBite());
    const bb=buffBite(),r=Math.random();s.kind=r<.2/bb?'pass':r<.4/bb?'roam':'curious';s.life=s.kind==='pass'?0:rnd(10,18);s.sp2=1;
    if(s.p.f.legend||s.p.f.beast){s.kind='curious';s.life=999;s.bold=.95;s.cmax=999}}
  s.age+=dt;s.mt-=dt;const leaving=s.age>s.life;
  if(s.mt<=0&&!leaving){const r=Math.random();if(r<.3){s.mode='hover';s.mt=rnd(1,3)}else{s.mode='cruise';s.mt=rnd(1.5,4);s.turn=rnd(-1.2,1.2);s.sp2=rnd(.5,1.05)}}
  /* håll dig under isen så länge du inte är på väg därifrån */
  const cx=s.x-ICE.x,cy=s.y-ICE.y,cr=Math.hypot(cx,cy);
  if(!leaving&&cr>ICE.rx-14){const a=Math.atan2(-cy,-cx);let dA=((a-s.hd+Math.PI*3)%(Math.PI*2))-Math.PI;s.hd+=clamp(dA,-2.5*dt,2.5*dt)}
  let sp;s.look=false;
  if(near&&s.kind==='curious'&&!leaving&&s.ct<s.cmax&&!(s.flee>0)){
    s.ct+=dt;s.look=true;const dx=BX-s.x,dy=HOOK_Y-s.y,dist=Math.hypot(dx,dy),keep=9+(1-s.bold)*12,a=Math.atan2(dy,dx);
    let dA=((a-s.hd+Math.PI*3)%(Math.PI*2))-Math.PI;s.hd+=clamp(dA,-3*dt,3*dt);
    s.gt-=dt;if(s.gt<=0){s.go=s.go>0?0:(Math.random()<.15*(1-s.bold)?-1:1);s.gt=s.go?rnd(.5,1):rnd(.25,.7)*(1.3-s.bold)}
    sp=T.amb?(dist>T.reach*.8?.35:0):dist<keep?-.15:s.go>0?(.9+.5*s.bold)*(F.boost>0?1.3:1)*(dist>50?1.4:1):s.go<0?-.3:0;
    /* sjunk eller stig långsamt mot pimpelns djup */
    s.d+=Math.sign(F.jd-s.d)*Math.min(Math.abs(F.jd-s.d),(s.cmax>500?.25:.11)*dt);
  }else{
    if(s.ct>=s.cmax&&s.kind==='curious'){s.kind='roam';s.hd+=Math.PI;s.life=Math.min(s.life,s.age+rnd(1,3))}
    if(s.mode==='cruise'&&!leaving)s.hd+=(s.turn||0)*dt*.6;
    sp=leaving?1:s.mode==='hover'?0:s.sp2*.8;
    if(s.flee>0)sp=1.8;
  }
  s.cur=(s.cur||0)+(sp*Math.max(7,s.spd)-(s.cur||0))*Math.min(1,dt*(s.look?5:1.6));
  s.x+=Math.cos(s.hd)*s.cur*dt;s.y+=Math.sin(s.hd)*s.cur*dt+Math.sin(clock*1.3+s.ph)*1.2*dt;
  s.vx=Math.cos(s.hd)*Math.max(1,s.cur);s.face=Math.cos(s.hd)>=0?1:-1;s.att=s.look?1:0;
}
function updateSchoolWinter(dt){
  ensureIce();
  F.sp-=dt;
  const nb=newbie();
  if(F.sp<=0&&F.school.length<(nb>.5?4:3)){spawnFish(false);F.sp=(10+(1-activity(F.spot,clock))*16)*rnd(0.7,1.3)*(1-.6*nb)*.6/buffBite()}
  const hunting=F.state==='waiting',bait=BAITBY[S.baitSel];
  let biter=null;
  for(const s of F.school){
    const fav=nb>=1||bait.fav.indexOf(s.p.f.id)>=0||s.p.f.beast||s.p.f.legend;
    const dd=Math.abs(s.d-F.jd),dist=Math.hypot(s.x-BX,s.y-HOOK_Y);
    if(s.flee>0)s.flee-=dt;
    if(nb>0&&hunting&&dist<95)s.d+=Math.sign(F.jd-s.d)*Math.min(Math.abs(F.jd-s.d),.12*nb*dt);
    const interested=fav||(s.lk==null?(s.lk=Math.random()<.25):s.lk);
    const leg=s.p.f.legend||s.p.f.beast;
    swimIce(s,dt,hunting&&interested&&(leg||dd<.26+.17*nb&&dist<95+23*nb));
    if(!hunting)continue;
    /* intresset växer när fisken tittar på pimpeln, mest när man pimplar i bra takt */
    const T=temperOf(s.p.f),inReach=(s.look||nb>0)&&dd<.12+.09*nb&&dist<T.reach+10;
    if(inReach)s.int+=dt*(fav?.9:.3)*(F.boost>0?1.8:.45)*(1+nb*2)*shyMul(s.p.f.id)*buffBite();
    else s.int=Math.max(0,s.int-dt*.35);
    if(!biter&&s.int>=1.55&&inReach)biter=s;
  }
  F.school=F.school.filter(s=>s!==biter&&Math.hypot(s.x-ICE.x,s.y-ICE.y)<ICE.rx+40);
  if(biter){const T=temperOf(biter.p.f),dist=Math.hypot(BX-biter.x,HOOK_Y-biter.y);F.pick=biter.p;F.bfish=biter;
    F.strike={x0:biter.x,y0:biter.y,face:BX>=biter.x?1:-1,wind:T.amb?.06:.08+.12*(1-(biter.bold||.5)),dur:clamp(dist/T.dash,.06,.3)};F.state='strike';F.t=0}
}
function drawDepthMeter(g,t){

  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#6fb6cc');gr.addColorStop(1,'#0b2a3c');g.fillStyle=gr;rr(g,x,y,MET_W,h,3);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';for(let i=1;i<4;i++)g.fillRect(x,y+h*i/4,4,.6);
  if(S.sonar>=1){for(const s of F.school){const f=s.p.f,col=S.sonar>=2?(f.r>=4?'#b98aee':f.r===3?'#f06a42':f.r===2?'#7fd46a':'#d8f0f6'):'#d8f0f6';
    /* ekolodet ser rakt ner under hålet: fisk i hålet syns tydligt, fisk strax utanför svagt, längre bort inte alls */
    const hr=Math.hypot((s.x-ICE.x)/ICE.rx,(s.y-ICE.y)/ICE.ry);if(hr>1.45)continue;g.globalAlpha=hr<1?1:.3;
    g.fillStyle=col;g.beginPath();g.ellipse(x+MET_W/2+2,y+s.d*h,2.6,1.3,0,0,7);g.fill();g.beginPath();g.moveTo(x+MET_W/2-.6,y+s.d*h);g.lineTo(x+MET_W/2-2.2,y+s.d*h-1.4);g.lineTo(x+MET_W/2-2.2,y+s.d*h+1.4);g.fill()}g.globalAlpha=1}
  const jy=y+F.jd*h;
  g.fillStyle='rgba(255,220,120,.18)';g.fillRect(x,jy-h*.14,MET_W,h*.28);
  g.fillStyle='#f2c75c';g.beginPath();g.moveTo(x+MET_W+5,jy);g.lineTo(x+MET_W+1,jy-3);g.lineTo(x+MET_W+1,jy+3);g.fill();
  g.fillStyle='#ffe08a';g.fillRect(x-1,jy-.7,MET_W+2,1.4);
}

function startComp(i){
  const L=COMP_LVL[i];if(S.money<L.fee)return;
  S.money-=L.fee;save();updateHUD();closeSheet();
  const names=COMP_NAMES.slice().sort(()=>Math.random()-.5).slice(0,3);
  COMP={lvl:i,t:COMP_TIME,score:0,count:0,best:null,last:null,ended:false,
    opp:(L.boss?['Olof']:names).map((nm,k)=>({name:nm,score:0,count:0,next:rnd(L.every[0],L.every[1])*rnd(.5,1),sk:L.k*(L.boss?1:rnd(.85,1.2)),boss:!!L.boss}))};

  toast(L.boss?'Olof: "Tre minuter. Försök hänga med."':'Tävlingen har börjat! Åk ut och fiska, du har 3 minuter.');
}
function compRanking(){
  const all=COMP.opp.map(o=>({name:o.name,score:o.score,count:o.count,me:false}));
  all.push({name:'Du',score:COMP.score,count:COMP.count,me:true});
  all.sort((a,b)=>b.score-a.score||(a.me?-1:1));
  return all;
}
function compTick(dt){
  if(!COMP||COMP.ended||mode==='menu')return;
  COMP.t-=dt;if(COMP.last)COMP.last.t-=dt;
  const L=COMP_LVL[COMP.lvl];
  COMP.opp.forEach(o=>{o.next-=dt;if(o.next<=0){o.next=rnd(L.every[0],L.every[1]);const fr=Math.pow(Math.random(),o.sk);o.score+=Math.round(10+40*fr)*(o.boss&&Math.random()<.04?3:1);o.count++;if(o.boss&&o.count%4===0&&!sheetOpen)toast(OLOF_LINES[Math.floor(Math.random()*OLOF_LINES.length)])}});
  if(COMP.t<=0){COMP.t=0;if(mode!=='fish'||(F.state!=='reel'&&F.state!=='bite'))endComp()}
}
function compCatch(c){
  const info=record(c),p=compPoints(c);if(info.ins&&info.ins.length)setTimeout(()=>toast('Ny insikt! '+info.ins[0]),2600);
  COMP.score+=p;COMP.count++;
  if(!COMP.best||c.kg/c.f.kg[1]>COMP.best.kg/COMP.best.f.kg[1])COMP.best=c;
  COMP.last={txt:'+'+p+' p · '+gname(c.f,c.gold)+' '+kgTxt(c.kg),t:2.4,gold:c.gold};
  SND.catch();if(c.gold||info.isNew)SND.record();
  F.state='idle';
  if(info.ach.length)setTimeout(()=>achToast(info.ach),900);
  if(COMP.t<=0)endComp();

function endComp(){

  const L=COMP_LVL[COMP.lvl],rk=compRanking(),pos=rk.findIndex(r=>r.me);
  const prize=pos<3?L.prize[pos]:0;
  S.comp=S.comp||{best:{},wins:0,hardWin:0};S.comp.best=S.comp.best||{};
  const newBest=COMP.score>(S.comp.best[COMP.lvl]||0);if(newBest)S.comp.best[COMP.lvl]=COMP.score;
  if(pos===0){S.comp.won=S.comp.won||{};S.comp.won[COMP.lvl]=1;S.comp.wins=(S.comp.wins||0)+1;if(COMP.lvl===2)S.comp.hardWin=(S.comp.hardWin||0)+1;if(L.boss)S.comp.olofWin=(S.comp.olofWin||0)+1}
  S.money+=prize;S.stats.earned+=prize;

/* Tävlingsbryggan på kartan: förtöjda båtar och flaggor */
function compDyn(dyn,g,t,WIN,sq){
  const c=M.comp,pd=c.pier.d;
  const boats=[[-14,4,0],[14,5,1]].filter(b=>M.free(c.x+b[0],c.y+b[1]));
  boats.forEach(b=>{const bx=c.x+b[0],by=c.y+b[1];dyn.push({y:by,fn:()=>{const p=proj(bx,by);if(!p)return;
    if(WIN)drawSledMap(g,p.x,p.y,p.s*.9,-Math.PI/2+.2*b[2],sq(p),t,Math.min(2,b[2]),'def');else drawBoatMap(g,p.x,p.y+Math.sin(t*2+b[2])*.3*p.s,p.s*.9,-Math.PI/2+.15*(b[2]-1),b[2],sq(p),t,0)}})});
  [[-6,-22],[6,-22]].forEach((f,i)=>{const fx=c.x+f[0],fy=c.y+f[1];dyn.push({y:fy,fn:()=>{const p=proj(fx,fy);if(!p)return;const u=p.s*.9;
    g.strokeStyle='#4a3a2a';g.lineWidth=Math.max(.3,u*.3);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x,p.y-u*11);g.stroke();
    g.fillStyle=i?'#2f6fae':'#e2453a';g.beginPath();g.moveTo(p.x,p.y-u*11);g.lineTo(p.x+u*5+Math.sin(t*3+i)*u*.5,p.y-u*9.6);g.lineTo(p.x,p.y-u*8.2);g.closePath();g.fill();
    g.fillStyle='#f2c75c';g.beginPath();g.moveTo(p.x,p.y-u*9.2);g.lineTo(p.x+u*3,p.y-u*8.6);g.lineTo(p.x,p.y-u*8);g.fill()}})});
}

const trophyKey=t=>t.id+'|'+t.kg+'|'+t.spot;
function mountCandidates(){
  const hung=new Set((S.trophies||[]).map(trophyKey)),out=[];
  S.hold.forEach((h,i)=>{if(!hung.has(trophyKey(h)))out.push({src:'hold',i:i,id:h.id,kg:h.kg,spot:h.spot,gold:!!h.gold})});
  S.top.forEach(t=>{if(!hung.has(trophyKey(t))&&!out.some(o=>trophyKey(o)===trophyKey(t)))out.push({src:'top',id:t.id,kg:t.kg,spot:t.spot,gold:!!t.gold})});
  return out;
}
function showMountPicker(){
  const n=el('div');n.appendChild(el('h2',null,'Häng upp en fisk'));
  if((S.trophies||[]).length>=MAX_TROPHIES){n.appendChild(el('p','sub','Väggarna är fulla. Ta ner en fisk först genom att trycka på den.'));openSheet(n);return}
  const c=mountCandidates();
  n.appendChild(el('p','sub','Välj en fisk från lastrummet eller bland dina finaste fångster. Sedan trycker du på väggen där den ska hänga.'));
  if(!c.length){n.appendChild(el('p','sub','Du har inga fiskar att hänga upp just nu. Fånga något fint och behåll det, eller sätt ett nytt rekord.'));openSheet(n);return}

  c.forEach(o=>{const f=FBY[o.id],card=el('button','card');card.type='button';card.style.cursor='pointer';card.style.font='inherit';card.style.color='inherit';card.style.textAlign='left';
    card.appendChild(bigFish(f,f.beast?84:70,false,o.gold));
    card.appendChild(el('strong',null,o.gold?'<span class="goldtxt">'+gname(f,true)+'</span>':f.name));
    card.appendChild(el('small',null,kgTxt(o.kg)+' · '+o.spot+'<br>'+(o.src==='hold'?'Från lastrummet':'Finaste fångster')));
    card.addEventListener('click',()=>{CAB.place=o;closeSheet();toast('Tryck på väggen där fisken ska hänga')});
    grid.appendChild(card)});
  n.appendChild(grid);openSheet(n);
}
function placeTrophy(p){
  const o=CAB.place;CAB.place=null;
  if(o.src==='hold'){const k=S.hold.findIndex(h=>trophyKey(h)===trophyKey(o));if(k>=0){S.hold.splice(k,1);updateHUD()}}
  S.trophies=S.trophies||[];
  S.trophies.push({id:o.id,kg:o.kg,spot:o.spot,gold:o.gold,date:Date.now(),x:clamp(p.x,WALL.x0+14,WALL.x1-14),y:clamp(p.y,WALL.y0+10,WALL.y1-10)});
  save();SND.buy();toast('Uppsatt! Dra i fisken för att flytta den.');
}
function trophyAt(p){const T2=S.trophies||[];for(let i=T2.length-1;i>=0;i--){const t=T2[i],w=plaqueW(t);if(Math.abs(p.x-t.x)<w/2+2&&Math.abs(p.y-t.y)<plaqueH(t)/2+2)return i}return -1}
function cabinPress(p){
  if(!CAB.place&&stovePress(p))return;
  if(!CAB.place&&calHit(p)){showCalendar();return}
  if(!CAB.place&&treeHit(p)){treePress();return}

let CAB_BG=null;
/* tavlans storlek följer fiskens verkliga vikt (logaritmiskt så att en nors syns och en gädda ändå får plats på väggen) */
const plaqueW=t=>{const f=FBY[t.id];if(f.beast)return 88;if(f.legend)return Math.round(clamp(60+6*Math.log2(t.kg/4),72,84));
  return Math.round(clamp(16+5.2*Math.log2(Math.max(t.kg,.01)/.01),18,68)*(f.wide?1.04:1))};
const plaqueH=t=>Math.round(plaqueW(t)*.42)+6;
const CEIL=56,FLOOR=200,RW=150;
function cabinBG(){
  if(CAB_BG)return CAB_BG;
  CAB_BG=layerCanvas(H,(g)=>{
    /* bakre timmervägg */
    for(let y=CEIL;y<FLOOR;y+=9){const k=(y/9)|0;const gr=g.createLinearGradient(0,y,0,y+9);gr.addColorStop(0,k%2?'#9a6232':'#a66b37');gr.addColorStop(.6,k%2?'#86532a':'#91592d');gr.addColorStop(1,'#5a3418');
      g.fillStyle=gr;g.fillRect(0,y,RW,9);g.fillStyle='rgba(255,220,170,.12)';g.fillRect(0,y+1,RW,1);
      g.strokeStyle='rgba(60,30,10,.35)';g.lineWidth=.4;for(let i=0;i<2;i++){const x=hash2(k,i)*RW;g.beginPath();g.ellipse(x,y+4.5,3+hash2(i,k)*4,1.2,0,0,7);g.stroke()}}
    for(let y=CEIL;y<FLOOR;y+=9){g.fillStyle='#c48a52';g.beginPath();g.ellipse(2,y+4.5,4,4.2,0,0,7);g.fill();g.fillStyle='rgba(90,50,20,.5)';g.beginPath();g.arc(2,y+4.5,1.5,0,7);g.fill()}
    /* höger vägg i perspektiv */
    const rwTop=y=>CEIL-(y-RW)*0.9,rwBot=x=>FLOOR+(x-RW)*1.5;

const TQ={q:[],cur:null,t0:0,min:0};
function toast(msg){
  msg=String(msg||'');if(!msg)return;
  if(TQ.cur===msg||TQ.q.indexOf(msg)>=0)return;
  TQ.q.push(msg);if(TQ.q.length>4)TQ.q.splice(0,TQ.q.length-4);
  if(!TQ.cur)toastNext();else{const left=TQ.min-(performance.now()-TQ.t0);clearTimeout(toastTimer);toastTimer=setTimeout(toastNext,Math.max(0,left))}
}
function toastNext(){
  const e=$('toast');clearTimeout(toastTimer);
  const msg=TQ.q.shift();if(!msg){TQ.cur=null;e.hidden=true;return}
  TQ.cur=msg;TQ.t0=performance.now();const n=msg.length;TQ.min=1200+n*45;
  e.textContent=tr(msg);e.hidden=false;
  toastTimer=setTimeout(toastNext,TQ.q.length?TQ.min:Math.min(9000,2200+n*60));
}

const ORDLVL=['Lätt','Medel','Svår'];
/* Svårighet = hur många fångster det väntas ta (E). Lätt ~7, medel ~22, svår ~55,
   räknat på fiskplatser du redan kan nå. */
function orderShares(){
  const spots=[];
  (S.nakten?['stor','nak']:['stor']).forEach(m=>MAPS[m].spots.forEach(s=>{if(!spotLocked(s))spots.push(s)}));
  const share={};
  spots.forEach(s=>{
    const tot=Object.keys(s.pool).reduce((a,i)=>a+s.pool[i],0);
    for(const i in s.pool)if(!FBY[i].beast&&!FBY[i].legend)share[i]=(share[i]||0)+s.pool[i]/tot/spots.length;
  });
  return share;
}
function newOrder(lvl){
  const share=orderShares(),ids=Object.keys(share),have=S.orders.map(o=>o.fid);
  const tgt=[7,22,55][lvl]*rnd(0.8,1.2);
  const opts=[];
  ids.forEach(id=>{
    [1,2].forEach(n=>{
      if(lvl===0&&n===2&&Math.random()<0.5)return;
      const p=n/(share[id]*tgt);
      if(p<0.05||p>0.95)return;
      opts.push({id:id,n:n,p:p,dup:have.indexOf(id)>=0});
    });
  });
  let pool=opts.filter(o=>!o.dup);if(!pool.length)pool=opts;
  if(!pool.length){const id=ids[0];pool=[{id:id,n:1,p:0.5}]}
  const o=pool[Math.floor(Math.random()*pool.length)],f=FBY[o.id];
  const q=Math.pow(1-o.p,2);
  const minKg=Math.max(f.kg[0],Math.round((f.kg[0]+(f.kg[1]-f.kg[0])*q)*20)/20);
  const reward=Math.round((o.n*priceFor(f,minKg)*[1.3,1.6,2][lvl]+[20,120,400][lvl]*(o.n>1?1.3:1))/5)*5;
  const from=ORDERERS[Math.floor(Math.random()*ORDERERS.length)];
  return {id:Date.now()+Math.random(),fid:f.id,n:o.n,minKg:minKg,reward:reward,from:from,lvl:lvl};
}
function ensureOrders(){
  for(let l=0;l<3;l++)if(!S.orders.some(o=>o.lvl===l))S.orders.push(newOrder(l));
  S.orders.sort((a,b)=>a.lvl-b.lvl);
}
function orderMatches(o){
  const m=[];S.hold.forEach((h,i)=>{if(h.id===o.fid&&h.kg>=o.minKg)m.push(i)});

  LINES.forEach(l=>{const right=S.lines[l.id]?el('span','max','Äger'):buyBtn(l.p,()=>buyLine(l.id));n.appendChild(shopRow(l.name,l.d,right,1))});
  n.appendChild(el('h3',null,'Tillbehör'));
  n.appendChild(shopRow('Ståltafs',TAFS.d,S.tafs?el('span','max','Äger'):buyBtn(TAFS.p,buyTafs),1));
}
function buyLine(id){const l=LINEBY[id];if(S.lines[id]||S.money<l.p)return;S.money-=l.p;S.lines[id]=1;S.lineSel=id;save();updateHUD();SND.buy();showHarbor();toast('Köpte '+l.name)}
function buyTafs(){if(S.tafs||S.money<TAFS.p)return;S.money-=TAFS.p;S.tafs=1;S.tafsOn=1;save();updateHUD();SND.buy();showHarbor();toast('Köpte ståltafs. Den sitter på nu, du kan ta av den i Fiskelådan.')}
function harborVed(n){
  n.appendChild(el('p','sub','Ved till vedspisen i stugan. Du har <b>'+(S.ved|0)+'</b> av '+VED_MAX+' vedträn i korgen.'));
  VED_PACKS.forEach(v=>{const full=(S.ved|0)+v.c>VED_MAX,b=buyBtn(v.p,()=>{if(S.money<v.p||(S.ved|0)+v.c>VED_MAX)return;S.money-=v.p;S.ved=(S.ved|0)+v.c;save();updateHUD();SND.buy();showHarbor();toast('Köpte '+v.n.toLowerCase()+'. Veden ligger i korgen i stugan.')});
    if(full){b.disabled=true;b.textContent='Korgen är full'}n.appendChild(shopRow(v.n+' · '+v.c+' st',v.d,b,1))});
}
function harborNak(n){
  if(S.nakten){
    const right=M.id==='nak'?btn('Till Storsjön','small gold',()=>{closeSheet();SND.ramp();switchMap('stor','ramp');updateAction();setWhere();toast('Tillbaka på Storsjön')}):null;
    n.appendChild(shopRow('Båtsläp: köpt',M.id==='stor'?'Åk till båtrampen för att ta båten till Näkten.':'Du är på Näkten. Åk tillbaka till Storsjön när du vill.',right));
  }else{
    const ok=S.money>=NAK_PRICE;
    const b=btn('Köp '+kr(NAK_PRICE),'small'+(ok?' gold':''),buyNakten);b.disabled=!ok;
    n.appendChild(shopRow('Båtsläp till Näkten','Näkten är en 40 km lång sjö nära Hackås.',b));
  }
}

let shopArt=null;
function shopArtCopy(kind){
  if(!shopArt)shopArt={sport:makeShopArt('sport'),fish:makeShopArt('fish')};
  const src=shopArt[kind],c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);return c;
}
function showHarborHub(){
  if(!S.hubSeen){S.hubSeen=1;save()}
  const n=el('div','hub');
  n.appendChild(el('h2',null,M.dock.name));
  n.appendChild(el('p','sub','Välj butik · Pengar: <b>'+kr(S.money)+'</b>'));
  const grid=el('div','hub-grid');
  [['sport','Sport & Fiske','Spön, bete och ekolod'],['fish','Fiskhandlaren',S.hold.length?S.hold.length+(S.hold.length===1?' fisk':' fiskar')+' att sälja':'Sälj fångst och beställningar']].forEach(d=>{
    const b=el('button','hubcard '+d[0]);b.type='button';
    const art=shopArtCopy(d[0]);art.className='hub-art';b.appendChild(art);
    b.appendChild(el('span','plate',d[1]));
    b.appendChild(el('span','hub-sub',d[2]));
    b.addEventListener('click',()=>{SND.click();showHarbor(lastTab[d[0]])});
    grid.appendChild(b);
  });
  n.appendChild(grid);
  openSheet(n);
}
function showHarbor(tab){
  if(typeof tab==='string')harborTab=tab;
  const shop=shopOf(harborTab);lastTab[shop]=harborTab;
  const d=SHOPS[shop];
  const n=el('div');
  const back=btn('‹ Hamnen','small quiet back',showHarborHub);n.appendChild(back);
  const ban=el('div','shop-banner '+shop);const art=shopArtCopy(shop);art.className='hub-art';ban.appendChild(art);
  ban.appendChild(el('span','plate',d.name));n.appendChild(ban);
  {const rm=shop==='fish'?rumorToday():null;n.appendChild(el('p','greet'+(rm?' rumor':''),rm||d.greet))}
  n.appendChild(el('p','sub','Pengar: <b>'+kr(S.money)+'</b>'));
  const tabs=el('div','tabs');
  d.tabs.forEach(t=>{
    let label=t[1];
    if(t[0]==='sell'&&S.hold.length)label+=' ('+S.hold.length+')';
    const b=el('button','tab'+(harborTab===t[0]?' on':''),label);b.type='button';b.addEventListener('click',()=>showHarbor(t[0]));tabs.appendChild(b);
  });
  n.appendChild(tabs);
  const k=harborTab;
  if(k==='sell')harborSell(n);
  else if(k==='orders')harborOrders(n);
  else if(k==='rods')harborRods(n);
  else if(k==='bait')harborBait(n);
  else if(k==='line')harborLine(n);
  else if(k==='ved')harborVed(n);
  else if(k==='boat')tierLadder(n,'boat','Snabbare båt och större lastrum.');
  else if(k==='sonar')tierLadder(n,'sonar','Ekolod visar fiskarna under båten. Djupa platser kräver ekolod.');
  else if(k==='maps')harborDepth(n);
  else harborNak(n);
  openSheet(n);
}

function record(c){

  if(!e)S.log[c.f.id]={n:1,best:c.kg,spot:c.spot};

function qPos(){

  const row=(fy,side)=>{const y=Math.round(M.WH*fy);let a=-1,b=-1;for(let x=4;x<M.WW-4;x+=2){if(!M.isLand(x,y)){if(a<0)a=x;b=x}}
    const sx=side>0?b:a;let lx=sx;while(!M.isLand(lx,y)&&Math.abs(lx-sx)<30)lx+=side;
    return {x:sx-side*10,y:y,lx:lx+side*7,ly:y}};
  const qp={nils:row(.74,1),stone:row(.43,-1),cave:row(.15,1)};

  if(M.rows)M.rows.forEach((r,i)=>{if(r)M.rows[i]=r.filter(o=>!['nils','stone','cave'].some(k=>Math.hypot(o.x-qp[k].lx,o.y-qp[k].ly)<(k==='cave'?20:13)))});

  {const np=npcNear();if(np)return 'npc:'+np}

function caveWater(x,y){

function boardPos(){
  if(M.id!=='stor')return null;if(M.bp)return M.bp;
  const cx=313;let y=142;while(y<M.WH-10&&M.isLand(cx,y))y++;
  const bp={lx:cx,ly:y-7,x:cx,y:y+14};
  if(M.rows)M.rows.forEach((r,i)=>{if(r)M.rows[i]=r.filter(o=>Math.hypot(o.x-bp.lx,o.y-bp.ly)>14)});
  return M.bp=bp;
}
function boardNear(){const bp=boardPos();return bp&&B.tx==null&&Math.hypot(bp.x-B.x,bp.y-B.y)<30}
function boardDyn(dyn,g,t,WIN){
  const bp=boardPos();if(!bp)return;
  dyn.push({y:bp.ly,fn:()=>{const p=proj(bp.lx,bp.ly);if(p)drawBoard(g,p.x,p.y,p.s,t,WIN)}});
}
function drawBoard(g,x,y,s,t,WIN){
  const u=s*1.15;
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x+u,y,u*5,u*1.1,0,0,7);g.fill();
  /* stolpar */
  g.fillStyle='#5a3a1e';g.fillRect(x-u*4.2,y-u*9,u*.9,u*9);g.fillRect(x+u*3.3,y-u*9,u*.9,u*9);
  /* tavlan */
  g.fillStyle='#7a5230';g.fillRect(x-u*4.8,y-u*11.5,u*9.6,u*6.2);
  g.fillStyle=WIN?'#e8eef2':'#c99a5e';g.fillRect(x-u*4.3,y-u*11,u*8.6,u*5.2);
  /* rader */
  g.fillStyle='rgba(60,36,16,.55)';for(let i=0;i<3;i++){g.fillRect(x-u*1.6,y-u*(10.1-i*1.5),u*5,u*.45)}
  ['#e8b84a','#c9ced3','#c07a3e'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(x-u*2.6,y-u*(9.9-i*1.5),u*.55,0,7);g.fill()});
  /* tak */
  g.fillStyle=WIN?'#f4f7fa':'#8a2a22';g.beginPath();g.moveTo(x-u*5.6,y-u*11.4);g.lineTo(x,y-u*14);g.lineTo(x+u*5.6,y-u*11.4);g.closePath();g.fill();
  /* pokal på toppen */
  const by=y-u*15.6+Math.sin(t*2)*u*.2;
  g.fillStyle='#e8b84a';g.beginPath();g.moveTo(x-u*1.2,by-u*1);g.lineTo(x+u*1.2,by-u*1);g.lineTo(x+u*.7,by+u*.6);g.lineTo(x-u*.7,by+u*.6);g.closePath();g.fill();
  g.fillRect(x-u*.25,by+u*.6,u*.5,u*.8);g.fillRect(x-u*.8,by+u*1.3,u*1.6,u*.4);
  g.fillStyle='rgba(255,250,220,.8)';g.fillRect(x-u*.7,by-u*.8,u*.35,u*.9);
  const na=nightAmt(dayU(t));
  if(na>.2)LAMPQ.push(()=>{g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,by,0,x,by,u*5);gr.addColorStop(0,'rgba(255,210,110,'+(.3*na).toFixed(2)+')');gr.addColorStop(1,'rgba(255,210,110,0)');g.fillStyle=gr;g.beginPath();g.arc(x,by,u*5,0,7);g.fill();g.restore()});
}

function farmSpots(){
  if(M.id!=='stor'||!M.cabin)return null;if(M.fsp)return M.fsp;
  const c=M.cabin,hx=c.hx||c.x,hy=c.hy||c.y,dx=c.x-hx,dy=c.y-hy,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,ex=c.x+ux*90,ey=c.y+uy*90;

/* ett dygn i odlingen: fiskarna äter, växer och förökar sig */
function farmDay(){

/* pynt vid hamnen på högtiden */
function holSpot(){
  if(M.id!=='stor'||!M.dock)return null;if(M.hsp!==undefined)return M.hsp;
  const d=M.dock;let best=null;
  /* helst lite närmare kameran än hamnens bodar, så pyntet syns */
  for(let r=30;r<=46&&!best;r+=2)for(const a of [.35,.15,.55,0,.75,-.2,.95,1.2]){const x=d.x+Math.cos(a)*r,y=d.y+Math.sin(a)*r;if(M.isLand(x,y)&&M.isLand(x+5,y)&&M.isLand(x-5,y)&&M.isLand(x,y-5)){best={x:x,y:y};break}}
  /* glesa ut träden där pyntet står så det syns */
  if(best&&M.rows)M.rows.forEach((r,i)=>{if(r)M.rows[i]=r.filter(o=>!((o.k==='spruce'||o.k==='birch')&&Math.hypot(o.x-best.x,o.y-best.y)<13))});
  return M.hsp=best;
}

      g.fillStyle='#3a2410';[-1,1].forEach(k=>{g.save();g.translate(x,y);g.rotate(k*.5);g.fillRect(-u*4,-u*.6,u*8,u*1.2);g.restore()});
      g.fillStyle='#4a2a14';g.beginPath();g.moveTo(x-u*4,y);g.lineTo(x,y-u*6);g.lineTo(x+u*4,y);g.closePath();g.fill();
      [[0,'#ff7a1a',1],[-1.4,'#ffb43a',.75],[1.4,'#ffb43a',.7],[0,'#ffe68a',.5]].forEach((q,k)=>{const fl=1+.18*Math.sin(t*9+k*2.3),fw=u*2.6*q[2],fh=u*9*q[2]*fl,fx=x+q[0]*u+Math.sin(t*6+k)*u*.3,fy=y-u*1.5;
        g.fillStyle=q[1];g.beginPath();g.moveTo(fx-fw,fy);g.quadraticCurveTo(fx-fw,fy-fh*.55,fx,fy-fh);g.quadraticCurveTo(fx+fw,fy-fh*.55,fx+fw,fy);g.quadraticCurveTo(fx,fy+fw*.6,fx-fw,fy);g.fill()});
      g.save();g.globalCompositeOperation='lighter';const gl=g.createRadialGradient(x,y-u*3,1,x,y-u*3,u*16);gl.addColorStop(0,'rgba(255,150,60,.35)');gl.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=gl;g.fillRect(x-u*16,y-u*19,u*32,u*32);g.restore()}

      g.strokeStyle='#6cc04a';g.lineWidth=Math.max(.6,u*1.1);g.beginPath();g.moveTo(x,y-u*16);g.lineTo(x,y-u*3);g.stroke();

function sunPos(u){if(u<.02||u>=.55)return null;const p=(u-.02)/.53;return {p:p,x:14+p*152,y:64-Math.sin(p*Math.PI)*48,lo:1-Math.sin(p*Math.PI)}}
function sunRays(g,t,u,na){
  const sun=sunPos(u);if(!sun||na>.9||mode==='cabin'||mode==='cave'||inCaveMap())return;
  const wa=typeof wxA==='function'?(1-wxA('rain')*.9)*(1-wxA('fog')*.5):1,base=(1-na)*wa;if(base<.02)return;
  g.globalCompositeOperation='screen';

    /* strålar som står på bestämda platser i landskapet; lutningen följer solen */
    const slant=lerp(-.55,.55,sun.p),warm=sun.lo>.6?'255,190,120':'255,222,160';
    const SX=150,SY=170,d=V.D||D0;
    const y0=Math.floor((V.camY-d*1.7)/SY),y1=Math.floor((V.camY-d*.05)/SY);
    for(let j=y1;j>=y0;j--)for(let i=Math.floor((V.camX-260)/SX);i<=Math.floor((V.camX+260)/SX);i++){
      if(hash2(i*3.1,j*7.7)<.35)continue;

      g.fillStyle=lg;g.beginPath();g.moveTo(tx-bw*.7,ty);g.lineTo(tx+bw*.7,ty);g.lineTo(p.x+bw,p.y);g.lineTo(p.x-bw,p.y);g.closePath();g.fill();
      const pr=bw*1.3,pg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,pr);pg.addColorStop(0,'rgba('+warm+','+(a*1.2).toFixed(3)+')');pg.addColorStop(1,'rgba('+warm+',0)');
      g.fillStyle=pg;g.save();g.translate(p.x,p.y);g.scale(1,.42);g.translate(-p.x,-p.y);g.fillRect(p.x-pr,p.y-pr,pr*2,pr*2);g.restore();
    }

    }

  }

const PART={list:[],lt:0};
function partSpawn(night,fishView,init){

    life:night?rnd(7,13):rnd(5,10),night:night,blink:rnd(1.6,3.4),world:!fishView};
  if(fishView)return Object.assign(base,{x:Math.random()*W,y:6+Math.random()*88});
  /* På sjön hör partiklarna till världen: en plats på kartan och en höjd över marken */
  const d=V.D||D0,wy=V.camY-rnd(d*.12,d*1.5),w=W/(V.f/(V.camY-wy))*1.1;
  return Object.assign(base,{x:V.camX+rnd(-w/2,w/2),y:wy,h:night?rnd(2,9):rnd(4,26)});
}
