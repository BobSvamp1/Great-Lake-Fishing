<style>
/* Layout: one-screen portrait game. Glass HUD on top, rounded HD stage, action buttons below, sheets slide up over everything. */

*{box-sizing:border-box}

}

#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);width:max-content;max-width:92%;background:rgba(9,27,37,.94);color:var(--mist);border:1px solid rgba(242,199,92,.7);border-radius:14px;padding:10px 15px;text-align:center;font-size:15px;font-weight:700;pointer-events:none;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}

.btn{font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--mist);
  background:linear-gradient(#3a7d61,#2a5e48);border:0;border-radius:14px;padding:12px 8px;min-height:52px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}

.sheet-in{position:relative;width:min(560px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(#163a4c,#10303f 120px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));-webkit-user-select:text;user-select:text;box-shadow:0 -10px 40px rgba(0,0,0,.4)}

.sheet-in ul,.sheet-in ol{margin:6px 0;padding-left:22px}

.sub{color:var(--soft);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.card{background:linear-gradient(#123547,#0d2735);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}

.card strong{font-weight:700;font-size:16px}
.card small{color:var(--soft);font-size:14px;line-height:1.35}
.card.locked strong{color:#7f9fab}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gear{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.gear .name{font-weight:700}
.gear .ib{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:4px;padding:0;border-radius:50%;border:1.5px solid currentColor;background:none;color:inherit;font:700 italic 13px Georgia,serif;opacity:.7;vertical-align:1px;cursor:pointer}
.gear .ib.on{opacity:1;background:#e8b84a;border-color:#e8b84a;color:#2a1a0e}
.gear .bubble{position:relative;margin-top:9px;padding:9px 11px;border-radius:10px;background:#fff4dc;color:#3a2414;font-size:14px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.gear .bubble::before{content:'';position:absolute;top:-6px;left:18px;border:6px solid transparent;border-top:0;border-bottom-color:#fff4dc}
.gear .bubble[hidden]{display:none}

.goldtxt{color:#ffd45a;font-weight:700}

.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--rowan);color:#fff;padding:4px 9px;margin:2px;border-radius:999px}

.plate{align-self:center;margin-top:-16px;position:relative;padding:6px 12px;border-radius:999px;background:linear-gradient(#2a6f9a,#1b4d70);border:2px solid #f2c75c;

.hubcard.fish .plate{border-color:#5fd6d0}
.hub-sub{display:block;text-align:center;margin-top:7px;font-size:13px;color:var(--soft);line-height:1.3}
.savecode{width:100%;min-height:92px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:#0b2532;color:var(--mist);font:13px/1.35 ui-monospace,Menlo,monospace;padding:10px;word-break:break-all;-webkit-user-select:text;user-select:text}

.err{color:#ff9a7a;font-weight:700}
.btn.back{min-height:38px;padding:6px 14px;margin-bottom:10px}

</style>

/* --- Startmenyn: titeln på en hängande skylt --- */
#menu{background:linear-gradient(to bottom,rgba(6,20,30,.35),rgba(6,20,30,0) 30%,rgba(6,20,30,0) 50%,rgba(6,20,30,.85) 80%)}
.menu-top{padding-top:2%}
.kicker{display:inline-block;color:#fff4d8;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:11.5px}
#menu h1{position:relative;display:inline-block;margin:20px 0 4px;padding:9px 16px 11px;color:var(--cream);font-size:clamp(23px,7vmin,34px);line-height:1;
  background:var(--nails),var(--grain) 0 0/1600px 160px,linear-gradient(#8f6238,#6a4426 60%,#55361d);background-size:auto,800px 80px,auto;
  border:3px solid var(--wood-lo);border-radius:12px;text-shadow:0 2px 0 #2a170a,0 4px 10px rgba(0,0,0,.35);
  box-shadow:0 6px 0 #1c1009,0 12px 24px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,220,170,.3);transform:rotate(-1.2deg);
  animation:sway 6s ease-in-out infinite;transform-origin:50% -24px}
#menu h1::before,#menu h1::after{content:"";position:absolute;top:-27px;width:3px;height:26px;background:repeating-linear-gradient(#c9a66b 0 3px,#8a6a3a 3px 5px);border-radius:2px}
#menu h1::before{left:22%}#menu h1::after{right:22%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1deg)}}
.menu-btns{gap:12px}
.menu-btns .btn{min-height:50px;font-size:18px}

/* --- Ark som glider upp: ett mörkt timmerbord med näverkant --- */

.sheet-in h3::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,rgba(233,200,138,.45),transparent)}
.sheet-in p,.sheet-in li{color:#f6ead2}

.x{background:radial-gradient(circle at 35% 30%,#d0583f,#a8382a 60%,#7d2419);color:#fff;border:2px solid #3d120b;box-shadow:0 3px 0 #3d120b;font-family:var(--font-display);font-size:17px}

.rank{background:var(--grain) 0 0/1600px 160px,linear-gradient(#5e3c22,#4a2f1b);border:2px solid #1f130a}

.lvlcard{background:var(--grain) 0 0/1600px 160px,linear-gradient(#5e3c22,#4a2f1b);border:2px solid #1f130a;box-shadow:0 3px 0 #1a0f07}

.tabs{gap:6px}
.tab{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--grain) 0 0/1600px 160px,linear-gradient(#6a4628,#523519);color:#f2e3bd;border:2px solid #1f130a;border-radius:10px;box-shadow:0 3px 0 #1a0f07}

.greet{background:linear-gradient(#f4e6c4,#e6d2a6);color:#3a2614;border-left:0;border-radius:4px 12px 12px 4px;box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(-.6deg);font-style:italic}
.hubcard,.shop-banner{background:var(--grain) 0 0/1600px 160px,linear-gradient(#4a2f1b,#38230f)}
.hubcard{box-shadow:0 4px 0 #1a0f07!important}
.plate{background:var(--grain) 0 0/1600px 160px,linear-gradient(#8f6238,#6a4426);border-color:#f2c75c;border-radius:8px;text-shadow:0 1px 0 #1d1008}
.savecode{background:#1f140b;border:2px solid #3a2414;color:#f2e3bd}
.tip{color:#f0dfb4}

.card.tap{cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .1s}
.card.tap:active{transform:scale(.97)}
.kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;background:#2a1a0e;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}

.notes{display:grid;gap:6px;margin:8px 0;text-align:left}
.note{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid var(--line)}

.catch .greet{text-align:left}
#thr{position:absolute;left:8px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--cream);
  padding:7px 12px 7px 9px;border-radius:999px;border:2px solid var(--wood-lo);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.5);
  background:var(--grain) 0 0/1600px 160px,linear-gradient(#8a5d34,#6a4426 55%,#55361d);box-shadow:0 3px 0 #1c1009,0 5px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.25)}

#thr.troll{background:var(--grain) 0 0/1600px 160px,linear-gradient(#3f7a94,#2f6a86 55%,#24546b)}
.htrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;margin:10px -2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.htrack::-webkit-scrollbar{display:none}
.hcard{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;padding:0 2px;text-align:center}
.hframe{position:relative}
.hcard .hart{display:block;width:100%;height:auto;aspect-ratio:6/5;object-fit:cover;border-radius:14px;border:3px solid #1f130a;box-shadow:0 4px 0 #1a0f07,inset 0 0 0 1px rgba(255,220,170,.2);background:#10303f}
.hcard .hnum{position:absolute;left:10px;top:10px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b5,#e8b84a);color:#2a1a06;font:700 15px var(--font-display);box-shadow:0 2px 0 #5a3d10,0 3px 8px rgba(0,0,0,.45)}

html[lang=en] .htip::before{content:'Tip: '}
.hcard{min-height:0}
.hdots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}
.hdot{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:#2a1a0e;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);cursor:pointer}
.hdot.on{background:radial-gradient(circle at 35% 30%,#fff3b5,#e8b84a);box-shadow:0 0 5px rgba(255,214,90,.6)}
/* --- Toast: en liten skylt --- */
#toast{background:var(--grain) 0 0/1600px 160px,linear-gradient(#8a5d34,#6a4426);border:2px solid #1c1009;color:var(--cream);font-family:var(--font-display);font-weight:600;font-size:16px;
  border-radius:12px;box-shadow:0 4px 0 #1c1009,0 10px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,220,170,.28);text-shadow:0 1px 0 rgba(0,0,0,.5);animation:pop .25s ease-out}

/* --- Startmenyn: titeln i himlen och ett fiskekort --- */
#menu{background:linear-gradient(to bottom,rgba(6,20,30,.25),rgba(6,20,30,0) 30%,rgba(6,20,30,0) 45%,rgba(6,20,30,.7) 85%)}
#menu h1{background:none;border:0;box-shadow:none;animation:none;transform:none;padding:0;margin:26px 0 0;font-size:clamp(34px,11vmin,52px);line-height:.92;color:#fff4d8;

.fcard{margin:0 6% 7%;padding:16px 16px 14px;border-radius:6px;position:relative;color:#3a2414;
  background:repeating-linear-gradient(0deg,rgba(120,80,40,.05) 0 2px,transparent 2px 4px),linear-gradient(#f6ead0,#ead8b0);
  box-shadow:0 0 0 2px #c9a66b inset,0 0 0 5px #f6ead0 inset,0 0 0 6px #c9a66b inset,0 12px 30px rgba(0,0,0,.5);transform:rotate(-1.2deg)}

.lb-tabs{display:flex;gap:6px;margin:4px 0 10px}.lb-tabs .btn{flex:1;min-height:44px;padding:6px 4px;font-size:14px}

#wxIc{display:inline-block;width:18px;height:18px;margin-right:6px;vertical-align:-4px}

<script>
(function(){
'use strict';
const W=180,H=320,T=8;
const $=id=>document.getElementById(id);
const cv=$('cv'),mctx=cv.getContext('2d');
/* Scenen ritas i en lågupplöst pixelbuffert, sedan skalas den upp och får tilt-shift, glöd och färgton. */
/* Grafik: Normal ritar 1,5 gånger skarpare än Låg. Valet läses direkt från sparfilen, eftersom bilderna byggs när spelet startar. */
const PB=(()=>{try{const o=JSON.parse(localStorage.getItem('glf-hd-v1')||'{}');return o&&o.gfx==='low'?1.6:2.4}catch(e){return 2.4}})();
const buf=document.createElement('canvas');buf.width=Math.round(W*PB);buf.height=Math.round(H*PB);
const ctx=buf.getContext('2d');
let K=1,KY=1;
function pixelize(c,step){
  const g=c.getContext('2d'),im=g.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<110){d[i+3]=0;continue}
    d[i+3]=255;if(step){d[i]=Math.round(d[i]/step)*step;d[i+1]=Math.round(d[i+1]/step)*step;d[i+2]=Math.round(d[i+2]/step)*step}
  }
  g.putImageData(im,0,0);return c;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,k)=>a+(b-a)*k;
const kgTxt=k=>(k>=100?String(Math.round(k)):k>=1?k.toFixed(1):k.toFixed(2)).replace('.',',')+' kg';
const kr=n=>Math.round(n).toLocaleString('sv-SE')+' kr';

/* ---------- Spara (egen sparfil för HD-versionen) ---------- */
const SAVE='glf-hd-v1';
const defaultS=()=>({money:0,rod:0,boat:0,sonar:0,hold:[],log:{},top:[],catches:0,seen:{},nakten:0,music:true,sfx:true,played:0,
  rods:{spinn:1,fly:0,troll:0},rodSel:'spinn',lines:{nylon:1},lineSel:'nylon',tafs:0,tafsOn:0,baits:{mask:1,fluga:0,wobbler:0,skedd:0},baitSel:'mask',
  orders:[],ordersDone:0,medals:{},ach:{},stats:{earned:0,night:0},golden:{},treasures:0,maps:{},cabin:1,trophies:[],comp:{best:{},wins:0,hardWin:0},boats:[1,0,0,0,0],sleds:[1,0,0],sled:0,bc:[],sc:[]});
let S=defaultS();
/* Sparfilen ligger kvar i webbläsaren när spelet uppdateras. Nyckeln får aldrig bytas.
   Nya fält får standardvärden vid inläsning, och en trasig sparfil skrivs aldrig över. */
let SAVE_OK=true;
try{const raw=localStorage.getItem(SAVE);
  if(raw){try{const o=JSON.parse(raw);if(o&&typeof o==='object')S=Object.assign(S,o);else throw 0}
    catch(e){SAVE_OK=false;try{localStorage.setItem(SAVE+'-trasig-'+Date.now(),raw)}catch(_){}SAVE_OK=true}}
}catch(e){}
var CLOUD=null;
var MP={role:null,sheet:false};
/* som gäst i en kompis spel lånar man hostens tid och årstid; i sparfilen ligger alltid ens egna */
function saveJSON(){
  if(MP.role!=='guest'||!MP.own)return JSON.stringify(S);
  const cur={};['season','sday','seasonT','winter','year','tt','calDI','dayTot'].forEach(k=>{cur[k]=S[k];if(k in MP.own)S[k]=MP.own[k]});
  try{return JSON.stringify(S)}finally{for(const k in cur)S[k]=cur[k]}
}
function save(){try{S.tt=tt%(DAY*100)}catch(e){}try{S.savedAt=Date.now();localStorage.setItem(SAVE,saveJSON())}catch(e){}if(CLOUD&&CLOUD.user)cloudPush()}
const SAVE_PREFIX='GLF1:';
function exportSave(){try{return SAVE_PREFIX+btoa(unescape(encodeURIComponent(saveJSON())))}catch(e){return ''}}
function parseSave(code){
  code=(code||'').trim().replace(/\s+/g,'');if(code.indexOf(SAVE_PREFIX)!==0)return null;

ish from your hold and get paid more than at the market. You have","Lämna in":"Deliver","· Du har":"· You have","Spöstyper":"Rod types","Olika spön passar olika fisk. Du väljer spö i Fiskelådan när du fiskar.":"Different rods suit different fish. You pick a rod in the Tackle box when you fish.","Bättre spö ger bredare fångstzon, oavsett typ. Hur tung fisk du klarar beror på linan.":"A better rod gives a wider catch zone, whatever the type. How heavy a fish you can handle depends on the line.","Rätt bete lockar rätt fisk. Byt bete före kastet.":"The right bait attracts the right fish. Change bait before casting.","Linan avgör hur tung fisk du klarar innan den går av. Byt lina i Fiskelådan.":"The line decides how heavy a fish you can handle before it snaps. Change line in the Tackle box.","Tillbehör":"Accessories","Ståltafs":"Steel leader","Köpte ståltafs. Den sitter på nu, du kan ta av den i Fiskelådan.":"Bought a steel leader. It's on now, you can take it off in the Tackle box.","Ved till vedspisen i stugan. Du har":"Firewood for the wood stove in the cabin. You have","vedträn i korgen.":"logs in the basket.","Korgen är full":"The basket is full","Tillbaka på Storsjön":"Back on Storsjön","Båtsläp: köpt":"Boat trailer: bought","Åk till båtrampen för att ta båten till Näkten.":"Go to the boat ramp to take the boat to Näkten.","Du är på Näkten. Åk tillbaka till Storsjön när du vill.":"You're on Näkten. Head back to Storsjön whenever you like.","Båtsläp till Näkten":"Boat trailer to Näkten","Näkten är en 40 km lång sjö nära Hackås.":"Näkten is a 40 km long lake near Hackås.","Sälj din fångst":"Sell your catch","Färsk fisk köpes! Stora fiskar och beställningar betalar bäst.":"Fresh fish wanted! Big fish and orders pay the most.","Sälj fångst":"Sell your catch","Spön, bete, ekolod och ved. Båtar och skotrar finns på Varvet längre söderut.":"Rods, bait, sonars and firewood. Boats and snowmobiles are at the Boatyard further south.","Båtsläp":"Boat trailer","Välj butik · Pengar:":"Choose a shop · Money:","Spön, bete och ekolod":"Rods, bait and sonar","fisk":"fish","att sälja":"to sell","Sälj fångst och beställningar":"Sell your catch and fill orders","Snabbare båt och större lastrum.":"A faster boat and a bigger hold.","Ekolod visar fiskarna under båten. Djupa platser kräver ekolod.":"A sonar shows the fish under the boat. Deep spots require a sonar.","En gyllene fisk!":"A golden fish!","Fångst!":"Catch!","Gyllene · 5x värde":"Golden · 5x value","Bjässe":"Giant","Passar en beställning":"Matches an order","Ungefär en fisk på 250 är gyllene. Den här får du berätta om länge.":"About one fish in 250 is golden. You'll be telling people about this one for a long time.","· värd":"· worth","Ingen i Jämtland kommer att tro dig, men det står i loggboken.":"Nobody in Jämtland will believe you, but it's in the logbook.","Rödingkungen! Dess buk lyser orange som en solnedgång. Ánte kommer inte tro sina ögon.":"The Char King! Its belly glows orange like a sunset. Ánte won't believe his eyes.","Kristalldraken! Kristallerna på ryggen lyser upp hela båten. Ingen kommer att tro dig.":"The Crystal Dragon! The crystals on its back light up the whole boat. Nobody will believe you.","Den gamla storöringen från Gillhov. Farfar hade rätt, den finns på riktigt.":"The old giant trout from Gillhov. Grandpa was right, it really exists.","Behåll":"Keep","Släpp tillbaka":"Release","Lastrummet är fullt. Släpp tillbaka eller sälj i hamnen först.":"The hold is full. Release it, or sell your catch at the harbour first.",", inte köpt":", not bought","Dra in linan först för att byta bete.":"Reel in the line first to change bait.","Dra in linan först för att byta lina.":"Reel in the line first to change line.","Tafs: på":"Leader: on","Dra in linan först för att ändra tafsen.":"Reel in the line first to change the leader.","med ståltafs":"with steel leader","Tryck på ett spö, bete eller en lina för att byta.":"Tap a rod, bait or line to change it.","kan du köpa i Sport &amp; Fiske.":"can be bought at Sport &amp; Fiske.","Ståltafs (":"Steel leader (","på":"on","Tomt fack":"Empty slot","Ståltafs kan du köpa i Sport &amp; Fiske.":"A steel leader can be bought at Sport &amp; Fiske.","Kastet är ute, så betet kan inte bytas just nu.":"The line is out, so the bait can't be changed right now.","Stäng lådan":"Close the box","Färg":"Colour","Varvet":"Boatyard","X":"X","Lämna varvet":"Leave the boatyard","Båtar":"Boats","Skotrar":"Snowmobiles","‹":"‹","›":"›","Föregående":"Previous","Nästa":"Next","Du kör ut med":"You head out with","Välkommen tillbaka till varvet!":"Welcome back to the boatyard!","Du har inte råd än.":"You can't afford it yet.","???":"???","Låst":"Locked","Används nu":"In use","Köp för":"Buy for","är din!":"is yours!","Den här båten används":"This boat is in use","Den här skotern används":"This snowmobile is in use","Använd den här båten":"Use this boat","Använd den här skotern":"Use this snowmobile","är vald.":"is selected.","Välj ett alternativ":"Pick an option","Använd":"Use","Måla om skrovet. Köpta färger kan du byta tillbaka till gratis.":"Repaint the hull. You can switch back to colours you've already bought for free.","En rand längs sidan.":"A stripe along the side.","En flagga i aktern som vajar i vinden.":"A flag at the stern that flutters in the wind.","Till exempel Snöstorm":"For example Blizzard","båten":"the boat","ett namn. Det är gratis.":"a name. It's free.","Det du har köpt kan du ta av och sätta på igen gratis.":"Anything you've bought can be taken off and put back on for free.","Köpt":"Bought","Används":"In use","Köp steg":"Buy step","först":"first","Något stort har lagt till vid Varvet...":"Something big has docked at the Boatyard...","Fortsätt":"Continue","Kliv tillbaka i båten":"Get back in the boat","Hej då,":"Bye,","Hallå där! Du där i båten! Kom hit en stund, jag biter inte.":"Hey there! You in the boat! Come over here a minute, I don't bite.","Jag heter Nils. Min farfar Gustav fiskade här på Näkten i femtio år. Alla kallade honom Gädd-Gurra, för han drog upp gäddor som andra drog upp mört. På äldre dar sa han att han hittat något inne i berget, något han aldrig vågade ta med sig hem.":"My name is Nils. My grandfather Gustav fished here on Näkten for fifty years. Everyone called him Gädd-Gurra, because he pulled up pike the way others pulled up roach. In his old age he said he'd found something inside the mountain, something he never dared bring home.","Det enda han lämnade efter sig var ett tecken: en runsten på västra stranden, ungefär mitt på sjön, mittemot Monäset.":"All he left behind was a clue: a rune stone on the west shore, about halfway up the lake, across from Monäset.","Jag är för gammal för att ro dit själv. Men du har ju båt. Leta upp stenen med märket. Den visar vägen vidare.":"I'm too old to row there myself. But you've got a boat. Find the stone with the mark. It will show you the way.","Leta efter runstenen på västra stranden.":"Look for the rune stone on the west shore.","Runstenen står på västra stranden, ungefär mitt på sjön. Du ser märket när du kommer nära.":"The rune stone is on the west shore, about halfway up the lake. You'll see the mark when you get close.","Gädd-Gurras lykta... Han sa alltid att man bara ser den när det är mörkt. Ro norrut när natten kommer, och håll utkik längs östra stranden.":"Gädd-Gurra's lantern... He always said you can only see it in the dark. Row north when night falls, and keep watch along the east shore.","Du har hittat grottan? Då är du närmare än jag någonsin kom. Gå in och se vad farfar lämnade efter sig.":"You've found the cave? Then you're closer than I ever got. Go in and see what grandfather left behind.","Är det... farfars silverdrag? Det är det! Han gjorde det själv av en gammal sked, det har jag hört tusen gånger.":"Is that... grandfather's silver lure? It is! He made it himself out of an old spoon, I've heard that a thousand times.","Behåll det. Han ville att det skulle användas, inte ligga i en kista. Tack för att du lät honom bli klar med sin historia.":"Keep it. He wanted it to be used, not sit in a chest. Thank you for letting him finish his story.","Nils ger dig 200 kr för besväret.":"Nils gives you 200 kr for your trouble.","Hur nappar det idag? Farfar sa att silverdraget fungerar allra bäst när det är lugnt och grått.":"Are they biting today? Grandfather said the silver lure works best when it's calm and overcast.","Någon har ristat ett tecken i stenen och under det några rader, nötta av vind och is.":"Someone has carved a sign into the stone, and below it a few lines, worn down by wind and ice.","\"När solen gått ner och sjön ligger svart, tänds Gädd-Gurras lykta där berget lutar över vattnet. Norrut, på östra stranden.\"":"\"When the sun has set and the lake lies black, Gädd-Gurra's lantern is lit where the mountain leans over the water. To the north, on the east shore.\"","Gädd-Gurras lykta syns bara på natten. Ro norrut längs östra stranden.":"Gädd-Gurra's lantern can only be seen at night. Row north along the east shore.","En kista står på en klipphylla. Tryck på den.":"There's a chest on a rock ledge. Tap it.","I kistan ligger ett handgjort silverdrag inlindat i en oljad trasa, en plåtask med gamla mynt och en lapp.":"Inside the chest is a handmade silver lure wrapped in an oiled rag, a tin of old coins and a note.","\"Till den som hittar hit: lyktan har väntat länge. Ta väl hand om draget, det har aldrig svikit mig. /Gädd-Gurra\"":"\"To whoever finds their way here: the lantern has waited a long time. Take good care of the lure, it has never let me down. /Gädd-Gurra\"","Silverdraget":"The silver lure","finns nu i din fiskelåda. Det biter inte ute i sjön, men här i grottan lockar det kristallröding och mörkerål. Plåtasken innehöll":"is now in your tackle box. It's no use out on the lake, but here in the cave it attracts crystal char and dark eels. The tin held","600 kr":"600 kr","Kanske vill Nils veta vad du hittade?":"Maybe Nils would like to know what you found?","Tryck på kistan":"Tap the chest","Det droppar från taket. Långt in i grottan glimmar något.":"It's dripping from the ceiling. Far inside the cave, something glimmers.","Hej! Är du också ute och fiskar? Jag heter Lina, min pappa är Fiskhandlaren nere i Hamnen.":"Hi! Are you out fishing too? My name is Lina, my dad is the fishmonger down at the Harbour.","Jag tappade min mammas guldring i sjön förra veckan. Den gled av när jag sköljde händerna från båten, och en stor gädda högg efter glittret innan den sjönk.":"I dropped my mum's gold ring in the lake last week. It slipped off when I rinsed my hands over the side of the boat, and a big pike snapped at the glitter before it sank.","Pappa säger att den är borta för alltid. Men gäddor sväljer ju allt som glänser... Om du får en riktigt stor gädda här i Storsjön, kan du titta efter?":"Dad says it's gone for good. But pike swallow anything shiny... If you catch a really big pike here in Storsjön, could you take a look?","Fånga en stor gädda, minst 3 kg, i Storsjön.":"Catch a big pike, at least 3 kg, in Storsjön.","Det måste vara en stor gädda, minst tre kilo. De små kan inte svälja en ring. Lycka till!":"It has to be a big pike, at least three kilos. The small ones can't swallow a ring. Good luck!","Är det... min ring! Du hittade den! Mamma kommer inte tro det.":"Is that... my ring! You found it! Mum won't believe it.","Ta det här som tack. Och jag ska be pappa om något mer: han har en burk med guldfärg kvar från när han målade skylten.":"Take this as a thank you. And I'll ask dad for something more: he has a tin of gold paint left over from when he painted the sign.","Gå till Varvet. Du kan måla din båt i samma guld som ringen.":"Go to the Boatyard. You can paint your boat the same gold as the ring.","Linas guld finns nu som båtfärg på Varvet, och du fick 400 kr.":"Lina's gold is now a boat colour at the Boatyard, and you got 400 kr.","Hej igen! Pappa säger att du är den bästa fiskaren i stan nu. Han ger dig nog bra betalt.":"Hi again! Dad says you're the best angler in town now. He'll probably pay you well.","Åh, hej! Hedda Strand, fiskforskare. Jag har stationen här vid älven där jag räknar laxen som vandrar.":"Oh, hi! Hedda Strand, fish researcher. I have my station here by the river where I count the salmon swimming upstream.","Jag har en teori: rödingen i Näkten, uppe vid Gillhov, kan vara en egen stam som funnits där sedan istiden. Men jag behöver ett levande exemplar för att ta prov.":"I have a theory: the Arctic char in Näkten, up by Gillhov, might be a separate strain that has been there since the ice age. But I need a live specimen to take samples.","Här, ta den här vattenhinken. Fånga en röding vid Gillhov så håller den sig levande tills du kommer tillbaka hit.":"Here, take this water bucket. Catch an Arctic char at Gillhov and it'll stay alive until you come back here.","Fånga en röding vid Gillhov i Näkten och ta den till Hedda.":"Catch an Arctic char at Gillhov in Näkten and bring it to Hedda.","Gillhov ligger längst norrut i Näkten. Rödingen står djupt, så du behöver nog färgekolod och ett skeddrag.":"Gillhov is in the far north of Näkten. The char stay deep, so you'll probably need a colour sonar and a spoon lure.","Du har den! Titta på färgerna... jag hade rätt, den här är annorlunda.":"You've got it! Look at the colours... I was right, this one is different.","Som tack: här är en burk elritsor jag fångat i bäcken. Småfisken lockar inte vad som helst, men de riktigt stora rovfiskarna kan inte låta bli.":"As a thank you, here's a jar of minnows I caught in the stream. Small fish like these don't tempt just anything, but the really big predators can't resist them.","Ta dem till Laxhålan om du vill ha en storlax. Gäddan går också på dem.":"Take them to Laxhålan if you want a big salmon. Pike go for them too.","Elritsa finns nu i din fiskelåda, och du fick 500 kr.":"Minnows are now in your tackle box, and you got 500 kr.","Laxen går upp i älven på hösten. Då står den tätt i Laxhålan.":"The salmon run up the river in autumn. That's when they crowd into Laxhålan.","Buorre beaivi. Jag heter Ánte. Mina renar betar här kring sjön på vintern, och jag fiskar när de vilar.":"Buorre beaivi. My name is Ánte. My reindeer graze around this lake in winter, and I fish while they rest.","Min farmor berättade om Rödingkungen: en uråldrig röding, stor som en kalv, som bara kommer upp när norrskenet dansar över Kallkällan.":"My grandmother told me about the Char King: an ancient char, big as a calf, that only comes up when the northern lights dance over Kallkällan.","De flesta tror att det är en saga. Men jag har sett ljuset i isen de nätterna.":"Most people think it's a fairy tale. But I've seen the light in the ice on those nights.","Ta min pimpel. Farmor skar den av renhorn. Om någon kan locka upp Kungen så är det med den.":"Take my jig. Grandmother carved it from reindeer antler. If anything can lure the King up, it's this.","Hornpimpeln finns nu i din fiskelåda.":"The antler jig is now in your tackle box.","Kallkällan ligger i nordvästra viken. Vänta på en klar natt när norrskenet syns.":"Kallkällan is in the northwest bay. Wait for a clear night when the northern lights are out.","Du fick den... Rödingkungen. Farmor hade rätt hela tiden.":"You got it... the Char King. Grandmother was right all along.","Det här kommer jag att berätta för mina barnbarn. Ta det här, det är det minsta jag kan ge dig.":"I'll be telling my grandchildren about this. Take this, it's the least I can give you.","Norrskenet är vackert ikväll. Renarna är lugna.":"The northern lights are beautiful tonight. The reindeer are calm.","Något glimmar i gäddans mage... det är en guldring! Ta den till Lina.":"Something glimmers in the pike's belly... it's a gold ring! Take it to Lina.","Du lägger rödingen i Heddas vattenhink. Ta den till henne vid Indalsälven.":"You put the char in Hedda's water bucket. Take it to her by the Indalsälven.","Ánte vill nog höra om det här.":"Ánte will probably want to hear about this.","Större fångstzon och 10 % bättre betalt.":"A bigger catch zone and 10 % higher prices.","Lite större fångstzon för den arten.":"A slightly bigger catch zone for that species.","arter simmar här. När du fångar en art som inte finns i akvariet kan du välja att släppa ner den här i stället för att sälja den.":"species swim here. When you catch a species that isn't in the aquarium yet, you can choose to put it here instead of selling it.","Akvariet är tomt. När du fångar en art som inte finns här kan du välja \"Till akvariet\" i stället för att behålla den.":"The aquarium is empty. When you catch a species that isn't here yet, you can choose \"To the aquarium\" instead of keeping it.","Häng upp":"Hang up","På":"On","Ingen än":"None yet","Klicka på Gå ut när du är redo att börja fiska.":"Tap Go out when you're ready to start fishing.","Djupkorten finns inte längre, ekolodet visar djupet nu. Du fick tillbaka":"The depth charts are gone, the sonar shows the depth now. You got back","Trollingbåten hade låsts upp av ett fel i spelet och har tagits bort. Du kan köpa den på Varvet.":"The trolling boat had been unlocked by a bug in the game and has been removed. You can buy it at the Boatyard.","Fiskekartorna finns inte längre. Du fick tillbaka":"The fishing maps are gone. You got back","– linorna är ute":"– the lines are out","– du behöver en motorbåt för att trolla":"– you need a motorboat to troll","Det är inte en giltig e-postadress.":"That's not a valid email address.","Skriv ett lösenord.":"Enter a password.","Fel e-post eller lösenord.":"Wrong email or password.","Det finns redan ett konto med den e-postadressen. Logga in i stället.":"There's already an account with that email address. Log in instead.","Lösenordet måste vara minst 6 tecken.":"The password must be at least 6 characters.","Den här webbadressen är inte godkänd i Firebase än.":"This web address isn't approved in Firebase yet.","För många försök. Vänta en stund och försök igen.":"Too many attempts. Wait a while and try again.","Den inloggningen är inte aktiverad i Firebase än.":"That login method isn't enabled in Firebase yet.","Något gick fel (":"Something went wrong (","okänt fel":"unknown error","Kunde inte nå inloggningen just nu. Spelet sparar fortfarande på den här enheten.":"Couldn't reach the login right now. The game still saves on this device.","fångst":"catch","fångster":"catches","Kunde inte hämta molnsparningen just nu.":"Couldn't fetch the cloud save right now.","Ditt sparade spel är hämtat från molnet.":"Your saved game was loaded from the cloud.","Nytt spel på ditt konto.":"New game on your account.","Vilket spel vill du fortsätta?":"Which game do you want to continue?","Ditt konto har redan ett sparat spel med":"Your account already has a saved game with","På den här enheten finns ett annat spel med":"This device has a different game with","Ditt konto är nytt. På den här enheten finns ett spel med":"Your account is new. This device has a game with","som tillhör ett annat konto.":"that belongs to another account.","Det spel du inte väljer försvinner.":"The game you don't choose will be lost.","Den här enhetens":"This device's","Enhetens spel sparas nu på ditt konto.":"This device's game is now saved to your account.","Ta med spelet":"Bring the game","Spelet sparas nu på ditt konto.":"The game is now saved to your account.","Börja om":"Start over","Kunde inte spara i molnet just nu. Det sparas på enheten och försöker igen.":"Couldn't save to the cloud right now. It's saved on the device and will try again.","Inloggad som":"Logged in as","Logga in för att spara i molnet":"Log in to save in the cloud",". Spelet sparas automatiskt i molnet. Logga in med samma konto på en annan telefon eller dator så fortsätter du där du var.":". The game saves automatically in the cloud. Log in with the same account on another phone or computer and you'll continue where you left off.","Du är utloggad. Spelet finns kvar på den här enheten.":"You're logged out. The game is still on this device.","Med ett konto sparas spelet i molnet. Då kan du byta telefon eller spela på datorn och fortsätta där du var. Ditt spel på den här enheten följer med.":"With an account your game is saved in the cloud, so you can switch phones or play on a computer and continue where you left off. Your game on this device comes with you.","Logga in med Google":"Log in with Google","Eller med e-post":"Or with email","Lösenord (minst 6 tecken)":"Password (at least 6 characters)","Lösenord":"Password","Glömt lösenordet?":"Forgot your password?","Skriv din e-postadress först.":"Enter your email address first.","Vi har skickat ett mejl så du kan välja ett nytt lösenord.":"We've sent you an email so you can choose a new password.","Största fisk":"Biggest fish","Pengar tjänat":"Money earned","Topplistan finns i webbversionen av spelet, där man loggar in och tävlar mot sina kompisar.":"The leaderboard is in the web version of the game, where you log in and compete against your friends.","Hämtar…":"Loading…","Logga in för att vara med":"Log in to take part","Du syns som":"You appear as","Ditt namn på topplistan":"Your name on the leaderboard","Ingen är med än. Bli först!":"Nobody's here yet. Be the first!","Kunde inte hämta topplistan just nu.":"Couldn't fetch the leaderboard right now.","Varje sommar när skolan slutade packade mamma bilen och körde dig hela vägen från Göteborg upp till morfar Erik i Jämtland.":"Every summer, as soon as school was over, Mum packed the car and drove you all the way from Gothenburg to Grandpa Erik's place in Jämtland.","Hemma i stan var det spårvagnar, trafik och asfalt. Hos morfar var det tyst, ljusa nätter och en sjö som aldrig tog slut. \"Min lilla stadsråtta\", brukade han kalla dig.":"Back home in the city it was all trams, traffic and concrete. At Grandpa's it was quiet, the summer nights never got dark, and the lake seemed to go on forever. \"My little city mouse,\" he used to call you.","Morfar lärde dig att sätta mask på kroken, rensa abborre på bryggan och lyssna efter odjuret i dimman. Han skrattade alltid när du blev rädd.":"Grandpa taught you how to bait a hook, clean perch on the jetty and listen for the monster in the fog. He always laughed when you got scared.","I våras kom ett brev från Östersund. Morfar har gått bort, och han har lämnat sin gamla timmerstuga vid Storsjön till dig.":"This spring a letter arrived from Östersund. Grandpa had passed away, and he had left his old log cabin on Storsjön to you.","Så nu har du lämnat stan, packat bilen och kört norrut. Stugan är sliten men varm, och nere vid bryggan ligger morfars gamla roddbåt.":"So you've left the city behind, packed the car and driven north. The cabin is worn but cosy, and Grandpa's old rowing boat is tied up down by the jetty.","På köksbordet ligger hans träspö och en lapp med sned handstil:":"On the kitchen table you find his wooden rod and a note in his slanted handwriting:","\"Sjön ger till den som har tålamod. Börja med masken, sälj fångsten i hamnen och glöm inte att elda i spisen. Kram, morfar.\"":"\"The lake rewards patience. Start with worms, sell your catch at the harbour and don't forget to light the stove. Love, Grandpa.\"","Börja":"Begin","Gäddfärsbullar":"Pike patties","Starka armar: tung fisk drar bara ner zonen hälften så mycket.":"Strong arms: heavy fish only drag the zone down half as much.","Smörstekt röding":"Butter-fried char","Lugn hand: linan spänns långsammare.":"Steady hands: the line tightens more slowly.","Ugnsbakad öring":"Oven-baked trout","Bredare fångstzon.":"Wider catch zone.","Båten och skotern går 15 % fortare.":"The boat and snowmobile go 15 % faster.","Varm i kroppen: fisken nappar mycket oftare på natten och på isen.":"Warmed up: fish bite much more often at night and on the ice.","Sikrom på knäckebröd":"Whitefish roe on crispbread","Dubbelt så stor chans till gyllene fisk.":"Twice the chance of a golden fish.","Dubbelt så stor chans till bjässar.":"Twice the chance of giants.","Småfiskbullar":"Small-fish patties","Lite bredare fångstzon. Görs av tre småfiskar: mört, nors eller bergsimpa.":"A slightly wider catch zone. Made from three small fish: roach, smelt or sculpin.","Fiskhandlaren betalar 15 % mer för fisken. Görs av tre fiskar av minst två olika arter.":"The fishmonger pays 15 % more for your fish. Made from three fish of at least two different species.","Vedsäck":"Sack of firewood","Tre vedträn. Räcker till en vanlig rätt eller en av de starkare rätterna.":"Three logs. Enough for one regular dish or one of the stronger dishes.","Tolv vedträn, billigare per styck. Räcker till ungefär fem rätter.":"Twelve logs, cheaper per log. Enough for about five dishes.","vedträn till":"logs for",". Köp ved i Sport & Fiske i hamnen.":". Buy firewood at Sport & Fiske in the harbour.","Du har inte rätt fisk i lastrummet.":"You don't have the right fish in the hold.","är klar.":"is ready.","Det varar ett dygn.":"It lasts a whole day.","Du har":"You have","vedträn i korgen. Köp mer ved i Sport & Fiske i hamnen.":"logs in the basket. Buy more firewood at Sport & Fiske in the harbour.","Vedkorgen är tom. Köp ved i Sport & Fiske i hamnen.":"The wood basket is empty. Buy firewood at Sport & Fiske in the harbour.","vedträn för att tända spisen. Köp ved i Sport & Fiske i hamnen.":"logs to light the stove. Buy firewood at Sport & Fiske in the harbour.","Det sprakar i spisen. Elden brinner ett dygn.":"The stove crackles. The fire burns for a full day.","vedträn. Varje rätt kostar ved, och fisken tas ur lastrummet.":"logs. Every dish costs firewood, and the fish is taken from the hold.","Köp ved i Sport & Fiske i hamnen.":"Buy firewood at Sport & Fiske in the harbour.","Du har ätit":"You have eaten","Ungefär":"About","Laga något gott av fångsten. Maten håller dig igång ett helt dygn, men du kan bara ha en maträtt i magen åt gången.":"Cook something tasty from your catch. A meal keeps you going for a whole day, but you can only have one dish in your belly at a time.","3 småfiskar":"3 small fish","Fånga rätt fisk för att lära dig receptet.":"Catch the right fish to learn the recipe.",": en fisk svalt ihjäl. Glöm inte att mata.":": a fish starved to death. Don't forget to feed them.",": fiskarna är hungriga.":": the fish are hungry.","Brasan tänds vid hamnen och hela bygden är ute. Fisken nappar oftare hela dagen.":"The bonfire is lit by the harbour and the whole village is out. Fish bite more often all day long.","Midsommarstången står vid hamnen. Fiskhandlaren betalar dubbelt för sik, röding och öring till midsommarborden.":"The maypole stands by the harbour. The fishmonger pays double for whitefish, Arctic char and brown trout for the midsummer tables.","Höstmarknad":"Autumn market","Marknad i hamnen. Fiskhandlaren betalar 30 % mer för all fisk.":"It's market day at the harbour. The fishmonger pays 30 % more for all fish.","Julgran i stugan och en julklapp under granen. Fiskhandlaren betalar dubbelt för lax och lake till julbordet.":"A Christmas tree in the cabin and a present underneath it. The fishmonger pays double for salmon and burbot for the Christmas table.","VÅR":"SPRING","HÖST":"AUTUMN","Vår":"Spring","Höst":"Autumn","Idag är det":"Today is","I morgon är det":"Tomorrow is",", år":", year","I dag är det":"Today is","Nästa högtid:":"Next holiday:","\"God jul, min fiskare! Jag hör att stugan står varm igen. Erik hade varit stolt. Köp något fint till båten.\"":"\"Merry Christmas, my angler! I hear the cabin is warm again. Erik would have been proud. Buy something nice for the boat.\"","\"Glad jul! Här är en slant till nya drag. Erik gjorde alltid gravad lax till julbordet, jag har inte glömt hur god den var.\"":"\"Merry Christmas! Here's a little something for new lures. Erik always made gravlax for the Christmas table, I haven't forgotten how good it was.\"","\"God jul och gott nytt år! Kom ihåg att klä dig varmt på isen. Ingen fisk är värd blöta ullsockor.\"":"\"Merry Christmas and a happy new year! Remember to dress warmly on the ice. No fish is worth wet wool socks.\"","\"Hej min vän! Snön ligger hög här också. Jag lägger i lite pengar, så har du något att elda för. God jul!\"":"\"Hello, dear! The snow is deep here too. I've put in a little money so you can keep the fire going. Merry Christmas!\"","\"God jul! Din pappa och Erik satt alltid på bryggan och ljög om sina fångster. Jag tror du slår dem båda.\"":"\"Merry Christmas! Your dad and Erik always sat on the jetty lying about their catches. I think you'll beat them both.\"","\"Glad jul från din faster! Jag funderade på att sticka en mössa, men pengar passar nog bättre i en fiskestuga.\"":"\"Merry Christmas from your aunt! I thought about knitting you a hat, but money is probably more useful in a fishing cabin.\"","\"God jul! Erik sa alltid att odjuret visar sig om natten, eller när dimman ligger tät över Storsjöflaket. Var försiktig där ute.\"":"\"Merry Christmas! Erik always said the monster shows itself at night, or when the fog lies thick over Storsjöflaket. Be careful out there.\"","\"En riktigt god jul! Ät lutfisk om du måste, men jag vet att du hellre tar lax. Lycka till på sjön!\"":"\"A very merry Christmas! Eat lutfisk if you must, but I know you'd rather have salmon. Good luck on the lake!\"","\"God jul, kära du! Det värmer mitt hjärta att någon i familjen fiskar på Storsjön igen. Jag hoppas att gäddorna nappar för dig i år.\"":"\"Merry Christmas, dear! It warms my heart that someone in the family is fishing on Storsjön again. I hope the pike are biting for you this year.\"","\"Glad jul! Jag hittade en gammal bild på dig och Erik på bryggan, du med en abborre nästan lika stor som du själv. Den har fått en plats på mitt kylskåp.\"":"\"Merry Christmas! I found an old photo of you and Erik on the jetty, you holding a perch almost as big as yourself. It has a spot on my fridge now.\"","Under granen ligger ett kuvert med ett julkort från faster Birgitta, och det sh in your hold. Every dish costs firewood. A meal gives you a bonus for a day, such as fish biting more often or your line holding up better.","Väggarna":"The walls","Tryck på väggen för att sätta upp dina finaste fångster som troféer.":"Tap the wall to put up your finest catches as trophies.","Fisk du fångar kan simma här i stället för att säljas.":"Fish you catch can swim here instead of being sold.","Här i viken vid morfars stuga är vattnet kallt och klart, perfekt för en egen fiskodling. Sätt ut en kasse, släpp i fisk du fångat och mata dem varje dygn. Välmatade fiskar växer och förökar sig, och de vuxna kan du sälja.":"Here in the bay by Grandpa's cabin the water is cold and clear, perfect for a fish farm of your own. Put out a pen, release fish you've caught and feed them every day. Well-fed fish grow and breed, and you can sell the adults.","Fisk som går att odla: regnbåge, röding, öring, sik, kanadaröding och lax. En kasse rymmer":"Fish that can be farmed: rainbow trout, Arctic char, brown trout, whitefish, lake trout and salmon. A pen holds","fiskar från början och kan utökas.":"fish to begin with and can be expanded.","Sätt ut en kasse för":"Put out a pen for","Kassen ligger ute! Släpp i fisk från lastrummet.":"The pen is out! Release fish from the hold.","Varje fisk äter en portion per dygn.":"Each fish eats one portion per day.","Foderautomaten matar av sig själv.":"The automatic feeder feeds them for you.","Mal småfisk (":"Grind small fish (","Matade för i dag":"Fed for today","Behöver mat i dag":"Needs food today","Tryck på en fisk för att se den eller sälja just den.":"Tap a fish to look at it or sell just that one.","Sälj vuxna, behåll ett par ·":"Sell adults, keep a pair ·","Behåller avelsparet":"Keeping the breeding pair","Inga vuxna än":"No adults yet","Sälj alla ·":"Sell all ·","Utöka kassen till":"Expand the pen to","Foderautomaten matar fiskarna av sig själv så länge det finns foder.":"The automatic feeder feeds the fish for you as long as there is feed.","Matade fiskar växer varje dygn, och vuxna par får yngel. Hungriga fiskar växer inte, och efter två dygn utan mat dör de.":"Fed fish grow every day, and adult pairs produce fry. Hungry fish don't grow, and after two days without food they die.","Logga in och spara i molnet":"Log in and save in the cloud","Du lastar på båten och åker till Näkten":"You load the boat and drive to Näkten","Du paddlar ut i Indalsälven. Strömmen tar tag i kanoten.":"You paddle out on the Indalsälven. The current grabs the canoe.","Du kör upp längs fjälleden. Kalfjället breder ut sig.":"You drive up the mountain trail. The bare fells spread out before you.","Tillbaka på Storsjön vid båtrampen":"Back on Storsjön at the boat ramp","Bara för testning. Ändringarna sparas i ditt spel.":"Testing only. The changes are saved in your game.","Tjäna 10 miljoner (trålaren)":"Earn 10 million (the trawler)","Lås upp all utrustning":"Unlock all gear","All utrustning upplåst":"All gear unlocked","Lås upp Olof":"Unlock Olof","Nästa fisk blir gyllene":"Next fish will be golden","Legend väntar…":"Legend waiting…","Nästa fisk blir legenden":"Next fish will be the legend","Nästa fisk vid Gillhov blir Gillhovsöringen, vid Storsjöflaket Storsjöodjuret och i grottan Kristalldraken":"The next fish at Gillhov will be the Gillhov Trout, at Storsjöflaket the Storsjö Monster and in the cave the Crystal Dragon","Avstängt":"Off","Skatt nära båten":"Treasure near the boat","Åk ut på sjön först":"Head out on the lake first","Byt årstid":"Change season","Åk tillbaka till Storsjön eller Näkten först.":"Go back to Storsjön or Näkten first.","Nils-storyn: nästa steg (":"Nils story: next step (","Storyn är på steg":"The story is on step","Lina/Hedda/Ánte: nästa steg":"Lina/Hedda/Ánte: next step","Ge mig älvkanot och fjällskoter":"Give me the river canoe and mountain snowmobile","Nils-storyn: börja om":"Nils story: start over","Storyn är nollställd":"The story has been reset","Byter vädret direkt. Regn, dimma och b
